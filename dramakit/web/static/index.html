// ---------- workbench ----------
function stageState(stage){
  const eps=(S.detail&&S.detail.episodes)||[];
  const proj=(S.detail&&S.detail.stage_status)||{};
  const pv=String(proj[stage]||"");     // the project level stages (import, analyse, cast, split)
  // A stopped stage is not a pending one. The runner writes "interrupted"
  // where it stopped, and a console that calls that "pending" tells the
  // user to start the whole run again instead of resuming it.
  if(pv==="done") return "done";
  if(pv==="running") return "running";
  if(pv==="interrupted") return "interrupted";
  if(pv==="failed") return "failed";
  if(!eps.length) return pv||"pending";
  let done=0, run=0, stop=0, bad=0;
  eps.forEach(ep=>{
    const v=String((ep.stage_status||{})[stage]||"");
    if(v==="done")done++; else if(v==="running")run++;
    else if(v==="interrupted")stop++; else if(v==="failed")bad++;
  });
  if(done===eps.length) return "done";
  if(run) return "partial";
  if(stop) return "interrupted";
  if(bad && !done) return "failed";
  if(done) return "partial";
  return "pending";
}
function epProgress(ep){
  const proj=(S.detail&&S.detail.stage_status)||{};
  const shared=["ingest","analyze","character","segment"];
  const vals=pipeStages().map(s=>(ep.stage_status||{})[s]||
    (shared.includes(s)?proj[s]:undefined));
  return Math.round(vals.filter(v=>v==="done").length/pipeStages().length*100);
}
function runningStageName(){
  // The project's own stages come first: ingest, analyze and character
  // belong to the project, not to any episode, so a page that looks only
  // at the episodes reports nothing running while the cast is being
  // dressed - which is most of the wait.
  const proj=(S.detail&&S.detail.stage_status)||{};
  for(const s of STAGES){ if(proj[s]==="running") return s; }
  const eps=(S.detail&&S.detail.episodes)||[];
  for(const ep of eps){ for(const s of STAGES){ if((ep.stage_status||{})[s]==="running") return s; } }
  return "";
}

// how long this stage has been running, as the page has seen it
let stageWatch={stage:"",since:0};
function stageElapsed(){
  const st=runningStageName();
  if(!st){ stageWatch={stage:"",since:0}; return null; }
  if(stageWatch.stage!==st){ stageWatch={stage:st,since:Date.now()}; }
  return Date.now()-stageWatch.since;
}
function fmtDur(ms){
  const t=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  if(h) return h+" 时 "+m+" 分";
  if(m) return m+" 分 "+sec+" 秒";
  return sec+" 秒";
}


// how wide the work is, and how it is going - a table of the stages and
// a line for each lane.  A bar that moves says nothing about how many

const LANE_ZH={"写作":"写作","旁路":"旁路","绘制":"绘制"};
function progressOverviewHtml(){
  const st=S.runStats||{};
  const stages=st.stages||{};
  const names=Object.keys(stages);
  if(!names.length) return "";
  const order=["script","storyboard","promptgen","voice","music","visual","compose","qc"];
  names.sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  const rows=names.map(k=>{
    const v=stages[k]||{};
    const zh=STAGE_ZH[k]||k;
    const run=+v.running||0, done=+v.done||0, fail=+v.failed||0;
    const started=+v.started||0, total=+v.total||0, conc=+v.concurrency||0;
    const since=+v.since||0, now=+st.now||0;
    const secs=since?Math.max(0,Math.round((now-since)/1000)):0;
    const busy=run>0;
    const mark=busy?"<span style='color:var(--confirm)'>◉</span>"
            :(total&&done>=total)?"<span style='color:var(--go2)'>●</span>"

      <td style="text-align:right;color:${busy?"var(--confirm)":"var(--fg3)"}">${run}</td>
      <td style="text-align:right;color:var(--go2)">${done}</td>
      <td style="text-align:right;color:${fail?"var(--danger2)":"var(--fg3)"}">${fail}</td>
      <td style="text-align:right" class="muted">${total||"—"}</td>
      <td style="text-align:right" class="muted">${conc||"—"}</td>
      <td style="text-align:right" class="muted">${secs?fmtDur(secs*1000):"—"}</td>
    </tr>`;
  }).join("");
  const lanes=st.lanes||{};
  const laneBits=Object.keys(lanes).map(l=>{
    const zh=LANE_ZH[l]||l;
    const s=STAGE_ZH[lanes[l]]||lanes[l];
    return `<span class="mini" style="margin-right:10px"><span style="color:var(--confirm)">◉</span> ${esc(zh)}·${esc(s)}</span>`;
  }).join("");
  const inflight=+st.inflight||0;
  const head=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
    <span class="mini"><b style="color:var(--confirm);font-size:13px">${inflight}</b> 路请求在飞</span>
    <span class="mini muted">已发起 ${+st.started||0} · 完成 ${+st.done||0}${+st.failed?` · 失败 ${+st.failed}`:""}</span>
    <span style="flex:1"></span>
    ${laneBits}
  </div>`;
  return head+`<table style="width:100%;font-size:12px;border-collapse:collapse">
    <tr style="color:var(--fg3);text-align:left">
      <th style="font-weight:500;padding:2px 8px 2px 0">阶段</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">已发起</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">在跑</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">完成</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">失败</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">共计</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">并发</th>
      <th style="font-weight:500;text-align:right;padding:2px 4px">用时</th>
    </tr>
    ${rows}
  </table>`;
}

  const overview=progressOverviewHtml();
  const st=runningStageName();
  if(!st) return overview?`<div class="card" style="margin-bottom:10px">${overview}</div>`:"";
  const zh=STAGE_ZH[st]||st;
  const hint=STAGE_HINT[st]||"";
  const p=(S.progress||{})[st];
  const ms=stageElapsed();
  const strip=pipeStages().map((x,i)=>{
    const v=stageState(x);
    const mark=v==="done"?"●":v==="running"?"◐":v==="interrupted"?"◑":"○";
    const col=v==="done"?"var(--go2)":v==="running"?"var(--confirm)"
             :v==="interrupted"?"var(--warn)":"var(--fg3)";
    return `<span style="color:${col}" title="${esc(STAGE_HINT[x]||STAGE_ZH[x])}">${mark} ${i+1} ${esc(STAGE_ZH[x])}</span>`;
  }).join("");
  let item="", bar="";
  if(p&&p.total){
    // the stage counts what it has finished, so the bar can be exact
    const n=Math.max(0,Math.min(100,Math.round((p.done||0)*100/p.total)));
    item=`<span class="mini muted">已完成 ${p.done||0}/${p.total} 项</span>`;
    bar=`<div class="prog-bar"><i style="width:${n}%"></i></div>`;
  }else{
    // it does not say how much is left; a bar that crawls says "still
    // going" more honestly than one stuck at zero
    bar=`<div class="prog-bar indet"><i></i></div>`;
  }
  return `<div class="card" style="margin-bottom:10px;border-color:var(--confirm)">
    <div style="display:flex;align-items:center;gap:9px">
      <span class="spin"></span>
      <b>${esc(zh)}</b>
      <span class="mini pulse" style="color:var(--confirm)">● 进行中</span>
      ${item}
      <span style="flex:1"></span>
      ${ms==null?"":`<span class="mini muted">已运行 ${fmtDur(ms)}</span>`}
      <button class="btn ghost" id="stopRunBtn" onclick="stopRun()"
              title="当前这一步的调用结束后停下（约 1 分钟内），已完成的保留">停止</button>
    </div>
    ${hint?`<div class="muted" style="font-size:12.5px;margin-top:6px">${esc(hint)}</div>`:""}
    ${bar}
    <div class="prog-strip">${strip}</div>
    ${overview?`<div style="margin-top:9px;padding-top:8px;border-top:1px solid var(--line)">${overview}</div>`:""}
  </div>`;
}

// update the panel where it stands: the workbench is not redrawn, so a
// long chapter list keeps its scroll and its ticks while this moves
function updateProgressPanel(){
  const slot=document.getElementById("progressSlot");
  if(!slot) return false;
  slot.innerHTML=workProgressHtml();
  return true;
}
function runningProgressHtml(){
  const s=runningStageName();
  if(!s) return "";
  const p=(S.progress||{})[s];
  const zh=STAGE_ZH[s]||s;
  let txt=`<span style="color:var(--go2)">● ${esc(zh)} 进行中</span>`;
  if(p&&p.total) txt+=` <span class="muted">已完成 ${p.done}/${p.total} 镜</span>`;
  return `<div style="margin-top:8px;font-size:12px">${txt}</div>`;
}
let progressPollTimer=null;
function startProgressPoll(){
  if(progressPollTimer) clearInterval(progressPollTimer);
  progressPollTimer=setInterval(async ()=>{
    if(!S.current) return;
    // Always ask. The old poll checked whether anything was running before
    // it fetched, and the only way to learn that is to fetch - so a task
    // submitted after the page loaded was never seen, and the workbench
    // stayed silent for the whole run.
    try{
      const pr=await getJSON("/api/progress?project="+encodeURIComponent(S.current));
      if(!pr||!pr.ok) return;
      S.progress=pr.progress||{};
      S.runStats={stages:pr.stages||{},lanes:pr.lanes||{},inflight:pr.inflight||0,
                  started:pr.started||0,done:pr.done||0,failed:pr.failed||0,
                  total:pr.total||0,now:pr.now||0};
      if(pr.project&&S.detail){
        S.detail.stage_status=pr.project.stage_status||{};
        (pr.project.episodes||[]).forEach(summary=>{
          const ep=(S.detail.episodes||[]).find(e=>e.index===summary.index);
          if(ep){ep.status=summary.status;ep.stage_status=summary.stage_status||{};}
        });
      }
      updateProgressPanel();
      renderStatusBar();
      renderHeader(); renderProjects();
    }catch(e){/* 网络瞬断 */}
  }, 4000);
}

function badge(st){
  const m={done:["done","完成"],running:["run","进行"],failed:["fail","失败"],
           pending:["","待办"],skipped:["","跳过"],
           // a refusal, not a fault: the work was not bad, it was stopped
           interrupted:["fail","已中断"]};
  const x=m[st]||["",st||""];
  return `<span class="badge ${x[0]}">${esc(x[1])}</span>`;
}

        <select class="f" id="boardFilterSel">${statuses.map(([v,l])=>`<option value="${v}" ${S.boardFilter===v?"selected":""}>${l}</option>`).join("")}</select>
        <button class="btn sm ghost" id="boardRefresh">⟳ 刷新</button>
      </div>
    </div>
    <div class="muted" style="font-size:12.5px;margin-bottom:10px">第 ${ep.index} 集 · ${ep.scenes.length} 场 · ${shotCount} 镜
      ${ep.video?`<a class="mini" href="${ep.video}" target="_blank" style="margin-left:6px">${mark("▶")} 成片</a>`:""}
      ${ep.video_mtime?`<span class="muted" style="font-size:12px;margin-left:6px">${ep.video_seconds?ep.video_seconds+"s · ":""}最后生成 ${ago(ep.video_mtime)}（${whenStr(ep.video_mtime)}）</span>`:""}
      ${ep.nle?`<a class="mini" href="${ep.nle}" target="_blank" style="margin-left:6px">FCPXML ${mark("↗")}</a>`:""}
      ${qcBadge(ep.qc)}</div>
    <div id="boardBlocks">${blocks||'<div class="empty">本集还没有分镜</div>'}</div>`;

  $("#boardEpSel").onchange=e=>{S.boardEp=parseInt(e.target.value)||0; renderBoard();};

  $$("#page-board .au").forEach(x=>x.onclick=()=>{new Audio(x.dataset.audio).play();});
  $$("#page-board .shotcard").forEach(c=>c.onclick=()=>{
    const sc=ep.scenes.find(s=>s.id===c.dataset.sc);

    const line=ep.scenes.flatMap(s=>s.lines).find(l=>l.id===x.dataset.line);

    if(line) openLineDrawer(ep,sc,line);
  });

// a preview that only answers the mouse is unreachable by keyboard and on
// a phone: hover, focus and tap all start it, and leaving stops it
function wireVideoPreview(root){
  if(!root) return;
  $$("[data-vprev], .shotcard video, .asset video", root).forEach(v=>{
    if(v.dataset.wired) return;
    v.dataset.wired="1";
    const host = v.closest(".shotcard") || v.closest(".asset") || v;
    const go=()=>{ const p=v.play(); if(p&&p.catch) p.catch(()=>{}); };
    const stop=()=>{ v.pause(); try{v.currentTime=0;}catch(e){} };
    host.addEventListener("pointerenter",go);
    host.addEventListener("pointerleave",stop);
    host.addEventListener("focusin",go);
    host.addEventListener("focusout",stop);
    if(!host.hasAttribute("tabindex") && host!==v) host.tabIndex=0;
    // a tap starts it where there is no hover to do it
    host.addEventListener("click",go);
  });
}
function matchesFilter(sh){
  const f=S.boardFilter;
  if(f==="all") return true;
  if(f==="video") return !!sh.video;
  if(f==="flf") return !!sh.end_image;
  return sh.status===f;
}
function shotCard(sh){
  // the picture is the shot: it gets the shot's own words as its name
  const what=attr(`第${sh.index||""}镜 ${sh.shot_type||""} ${sh.action||""}`.trim());
  let media="";
  if(sh.video) media=`<video src="${sh.video}" muted loop preload="metadata" aria-label="${what}"></video>`;
  else if(sh.image) media=`<img src="${sh.image}" loading="lazy" alt="${what}">`;
  else media='<div class="ph">无画面</div>';
  return `<div class="shotcard" data-sc="${attr(sh._sc||"")}" data-shot="${attr(sh.id)}" title="${attr(sh.action||"")}">
    <div class="media">${media}
      <span class="sidx">#${sh.index||""}</span>
      ${sh.end_image?'<span class="sfl">首尾帧</span>':""}
      <span class="sst">${badge(sh.status)}</span>
    </div>
    <div class="cap"><b>${esc(sh.shot_type)}</b> · ${esc(sh.camera||"")}<br>${esc((sh.action||"").slice(0,30))}</div>
  </div>`;
}

async function saveShot(){
  const d=S.drawer;
  if(d.kind!=="shot") return;
  const flfEl=$("#edFlf");
  const fields={
    shot_type:$("#edType").value, camera:$("#edCam").value,
    duration:num($("#edDur").value,3), seed:Math.round(num($("#edSeed").value,-1)),
    action:$("#edAction").value, prompt:$("#edPrompt").value,
    negative_prompt:$("#edNeg").value, end_prompt:$("#edEndPrompt").value,
    characters:$("#edChars").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    flf:flfEl.dataset.mixed?"__keep__":(flfEl.checked?true:false),
  };
  if(fields.flf==="__keep__") delete fields.flf;
  const r=await postJSON("/api/shot/update",{project:S.current,episode:d.ep.index,shot_id:d.shot.id,fields});
  if(!r.ok){ toast("保存失败："+esc(r.error||""),"err"); return; }
  toast("镜头已保存","ok"); closeDrawer();
  await selectProject(S.current,true); renderBoard();
}
async function regenShot(mode){
  const d=S.drawer;
  if(d.kind!=="shot") return;
  toast(`已提交${mode==="image"?"画面":mode==="video"?"视频":"画面+视频"}返工…`);
  const r=await postJSON("/api/shot/regen",{project:S.current,episode:d.ep.index,shot_id:d.shot.id,mode});
  if(!r.ok){ toast("提交失败："+esc(r.error||""),"err"); return; }
  pollJob(r.job,res=>{
    if(res&&res.ok){ toast("返工完成","ok"); closeDrawer(); selectProject(S.current,true).then(()=>renderBoard()); }
    else toast("返工失败："+esc((res&&res.error)||"未知错误"),"err",6000);
  });
}

function qcBadge(qc){
  if(!qc||!qc.metrics) return "";
  const m=qc.metrics, errs=qc.errors||[], warns=qc.warnings||[];
  const ok=!errs.length, bits=[];
  if(m.width) bits.push(`${m.width}x${m.height}`);
  if(m.duration) bits.push(`${m.duration.toFixed(0)}s`);
  if(m.integrated_lufs!==undefined) bits.push(`${m.integrated_lufs.toFixed(1)} LUFS`);
  if(m.true_peak_dbfs!==undefined) bits.push(`峰值 ${m.true_peak_dbfs.toFixed(1)}dB`);
  if(m.av_drift!==undefined) bits.push(`声画差 ${m.av_drift.toFixed(2)}s`);
  const cls=ok?(warns.length?"warn":"ok"):"bad";
  const col=ok?(warns.length?"var(--warn)":"var(--go2)"):"var(--danger2)";
  const tip=(errs.concat(warns)).join("\n");
  return `<span class="envchip ${cls}" style="color:${col}" title="${attr(tip)}">QC ${ok?"通过":"未通过"}${bits.length?" · "+esc(bits.join(" · ")):""}</span>`;
}

function syncNodes(name,btn){
  btn.disabled=true; btn.textContent="同步中…";
  const out=$("#nodeProg")||btn.closest("[data-node]")?.querySelector(`[data-msg="${CSS.escape(name)}"]`);
  if(out) out.textContent="正在准备…";
  postJSON("/api/nodes/sync",{node:name}).then(r=>{
    if(!r.ok){ if(out) out.textContent=r.error||"失败"; btn.disabled=false; btn.textContent="同步模型"; return; }
    const t=setInterval(async ()=>{
      const j=await getJSON("/api/jobs?id="+encodeURIComponent(r.job));
      if(!j||!j.ok||!j.job){ clearInterval(t); return; }
      const job=j.job, p=job.progress||{};
      if(p.file||p.phase){
        const pct=p.percent||0;
        if(out) out.textContent=`${pct.toFixed(1)}% · ${p.file||""} · ${((p.bytes_done||0)/1024**3).toFixed(2)}/${((p.bytes_total||0)/1024**3).toFixed(2)} GB`;
      }
      if(job.status!=="running"){
        clearInterval(t);
        if(out) out.textContent = job.status==="done" ? "同步完成" : (job.error||"失败");
        btn.disabled=false; btn.textContent="同步模型";
        loadNodesPage();
      }
    },1000);
  });
}

// ---------- 节点池：远程节点的设置、模型、工作流 ----------
// The pool used to be a read-only list on the pipeline page: it said
// which card was up and which weights it was missing, and there was
// nowhere to change any of it. Everything that decides what a card does
// - where it answers, how models reach it, which weights it loads,
// which workflow it runs - lived in the config file, to be edited by
// hand.
//
// This page is that file, per node. A card can be added, changed and
// taken out again, and what is written here is the file the scheduler
// reads: the fleet is edited where the fleet is run from.
let NODE_WFS = [];
let NODE_FILES = {};   // node -> {files, kinds, overrides}
let NODE_DIRTY = {};
let NODE_CARDS = [];   // the cards on the page, the new ones included

function nodeRoleChips(roles){
  const rs=(roles&&roles.length)?roles:["any"];
  return rs.map(r=>`<span class="chip ${r==="any"?"":"on"}" style="font-size:12px">${esc(r==="any"?"任意":r)}</span>`).join(" ");

async function loadNodesPage(){
  const box=$("#nodeList");
  if(!box) return;
  const r=await getJSON("/api/nodes");
  if(!r.ok){ box.innerHTML=`<div class="empty">加载失败：${esc(r.error||"")}</div>`; return; }
  NODE_WFS=r.workflows||[];
  // A card that is being written is not in the list yet - and the list
  // comes back on its own now and then.  It is kept, or what was typed
  // into it would be lost while it is being written.
  const drafts=NODE_CARDS.filter(c=>c._new);
  NODE_CARDS=(r.nodes||[]).map(n=>({...n,_new:false,key:n.name}));
  for(const d of drafts){
    if(d.name && NODE_CARDS.some(c=>c.name===d.name)) continue;
    NODE_CARDS.push(d);
  }
  renderNodeCards();
}
function renderNodeCards(){
  const box=$("#nodeList");
  if(!box) return;
  if(!NODE_CARDS.length){
    box.innerHTML=`<div class="empty">节点池里一台机器都没有。</div>`;
    return;
  }
  box.innerHTML=NODE_CARDS.map(nodeCardHtml).join("");
  $$("#nodeList [data-nf]").forEach(el=>{
    el.onchange=()=>{ NODE_DIRTY[el.closest("[data-node]").dataset.node]=true; };
    if(el.dataset.nf==="name"){
      // the name of a card that is not saved yet is what it will be
      el.oninput=()=>{
        const card=NODE_CARDS.find(c=>c.key===el.closest("[data-node]").dataset.node);
        if(card) card.name=(el.value||"").trim();
      };
    }
  });
  $$("#nodeList [data-wf]").forEach(el=>{
    el.onchange=()=>{ NODE_DIRTY[el.closest("[data-node]").dataset.node]=true; };
  });
  $$("#nodeList [data-save]").forEach(b=>b.onclick=()=>saveNode(b.dataset.save,b));
  $$("#nodeList [data-del]").forEach(b=>b.onclick=()=>delNode(b.dataset.del,b));
  $$("#nodeList [data-sync]").forEach(b=>b.onclick=()=>syncNodes(b.dataset.sync,b));
  // the model lists are read from each card, one at a time: they are the
  // only place that knows which files that card actually has
  for(const n of NODE_CARDS){
    if(!n._new) loadNodeModels(n.name);
  }
}

async function saveNode(key,btn){
  const card=$(`#nodeList [data-node="${CSS.escape(key)}"]`);
  if(!card) return;
  const msg=$(`#nodeList [data-msg="${CSS.escape(key)}"]`);
  // the name of a card that is already in the pool is the name it has;
  // only a card that is being added has a name field of its own
  const cfg={name:(card.dataset.name||"")};
  $$("[data-nf]",card).forEach(el=>{
    const k=el.dataset.nf;
    if(k==="name"){ cfg.name=(el.value||"").trim(); return; }
    if(el.type==="checkbox") cfg[k]=el.checked;
    else if(k==="roles") cfg[k]=el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else cfg[k]=el.value;
  });
  const wfs={};
  $$("[data-wf]",card).forEach(el=>{ wfs[el.dataset.wf]=el.value; });
  cfg.workflows=wfs;
  const ov={};
  $$("[data-ov]",card).forEach(el=>{
    ov[el.dataset.ov]=Object.assign({}, ov[el.dataset.ov]||{}, {[el.dataset.ovf]: el.value});
  });
  cfg.graph_overrides=ov;
  const node=NODE_CARDS.find(c=>c.key===key);
  if(node&&node.config&&node.config.primary) cfg.primary=true;
  if(!cfg.name && !cfg.primary){
    if(msg) msg.innerHTML=`<span style="color:var(--danger2)">先给这台机器起个名字</span>`;
    return;
  }
  btn.disabled=true; btn.textContent="保存中…";
  const r=await postJSON("/api/nodes/save",{nodes:[cfg]});
  btn.disabled=false; btn.textContent="保存这台节点";
  if(!r.ok){ if(msg) msg.innerHTML=`<span style="color:var(--danger2)">${esc(r.error||"保存失败")}</span>`; return; }
  if(msg) msg.innerHTML=`<span style="color:var(--go2)">${mark("✓")} 已保存</span>`;
  NODE_DIRTY[key]=false;
  // What was saved is what the card is now.  The page does not ask the
  // server again: looking at every card on the machine takes its time,
  // and the answer is already in the form.
  if(node){
    node.config=Object.assign({}, node.config||{}, cfg);
    node.base_url=cfg.base_url||node.base_url;
    if(node._new){ node._new=false; node.name=cfg.name; node.key=cfg.name; }
    renderNodeCards();
  }
  toast(cfg.primary?"本机设置已保存":"节点已保存","ok");
}
async function delNode(key,btn){
  const card=$(`#nodeList [data-node="${CSS.escape(key)}"]`);
  if(!card) return;
  const node=NODE_CARDS.find(c=>c.key===key);
  const name=(card.dataset.name||key);
  if(node&&node._new){
    // never written: it only has to go away from the page
    NODE_CARDS=NODE_CARDS.filter(c=>c.key!==key);
    renderNodeCards();
    return;
  }
  if(!confirm(`把这台节点从节点池里删掉？\n${name}\n\n配置会从 config/default.yaml 的 comfyui.nodes 里移除。`)) return;
  btn.disabled=true;
  const r=await postJSON("/api/nodes/save",{remove:[name]});
  btn.disabled=false;
  if(!r.ok){ toast(r.error||"删除失败","err"); return; }
  // the card is gone: the page says so at once
  NODE_CARDS=NODE_CARDS.filter(c=>c.key!==key);
  renderNodeCards();
  toast("已删除 "+name,"ok");
}
function stageStateFor(ep,stage){ const v=(ep.stage_status||{})[stage]; return v==="done"?"done":v||"pending"; }
function parseEps(str){
  const out=[]; (str||"").split(",").forEach(part=>{
    part=part.trim(); if(!part)return;
    if(part.includes("-")){const[a,b]=part.split("-").map(x=>parseInt(x)); for(let i=a;i<=b;i++)out.push(i);}
    else out.push(parseInt(part));
  });
  return [...new Set(out.filter(n=>!isNaN(n)))];
}
async function doRun(){
  const body={project:$("#runProj").value,episodes:parseEps($("#runEps").value),
    stages:[...runSel],overrides:{}};
  if(!body.project){ toast("请先选择项目","err"); return; }
  if(!body.stages.length){ toast("至少选一个阶段","err"); return; }
  // the chapters, when the run is about the ticked ones and not the
  // whole book
  if(window.__chapScope){
    const chosen=Array.from(_chapChosenSet());
    if(!chosen.length){ toast("勾了「只做选中的章节」，但一章都没勾","err"); return; }
    // A chapter that has been made already has a script and pictures
    // behind it, and a rerun writes over them.  That is a decision, so
    // it is asked for rather than done.
    const states=chapterStates();
    const done=chosen.filter(c=>states[c]==="done");
    const busy=chosen.filter(c=>states[c]==="running");
    if(done.length||busy.length){
      const bits=[];
      if(done.length) bits.push("第 "+done.slice(0,12).join("、")+(done.length>12?" 等 "+done.length+" 章":"")+" 已经做过");
      if(busy.length) bits.push("第 "+busy.slice(0,12).join("、")+(busy.length>12?" 等 "+busy.length+" 章":"")+" 正在做");
      const msg=bits.join("；")+"。\n\n重做会覆盖这些章节已有的剧本和画面。还要重做吗？";
      if(!confirm(msg)){ toast("没有开始","",2200); return; }
    }
    body.chapters=chosen;
    body.season=window.__nextSeason||1;
    const r=await postJSON("/api/chapters/choose",{project:body.project,chosen:chosen});
    if(!r||!r.ok){ toast("保存选章失败："+esc((r&&r.error)||"未知错误"),"err"); return; }
  }
  // The frame and the style in the panel are what this run will make.
  // They are written to the project first - so the dialog can show
  // them, and so the run cannot disagree with what was confirmed.
  if(S.lookDraft && S.lookDraft.project===body.project){
    const ok=await saveLook(true);
    if(!ok){ toast("画幅/风格没存上，这次先不开始","err"); return; }
  }
  if(window.runPreflight && !(await runPreflight(body.stages,"流水线",body))) return;
  $("#runStat").innerHTML='<span class="spin"></span> 运行中…（可切到别处，稍后刷新）';
  $("#runGo").disabled=true;
  postJSON("/api/run",body).then(r=>{
    if(!r.ok){ $("#runStat").textContent="失败："+(r.error||""); $("#runGo").disabled=false; return; }
    watchRun(r.job, body.project);
  });
}

// The watching of a run, whether it was started from here or carried on
// from where it stopped.
function watchRun(jid, project){
  pollJob(jid,(res,job)=>{
    $("#runGo").disabled=false;
    const rb=$("#runResume"); if(rb) rb.disabled=false;
    if(!res||job.status!=="done"){
      const msg=(job&&job.error)||"任务已中断，未产生完整结果";
      $("#runStat").innerHTML=`<span style="color:var(--danger2)">${mark("✗")} ${esc(msg)}</span>`;
      $("#runOut").innerHTML=`<div class="card run-result fail"><h3>运行未完成</h3><p>${esc(msg)}</p><button class="btn ghost" id="runToJobs">查看任务与日志</button></div>`;
      $("#runToJobs").onclick=()=>showWbTab("jobs");
      return;
    }
    const stageResults=(res&&res.results)||res||{};
    const failed=Object.entries(stageResults).filter(([,v])=>v&&v.error);
    const rows=Object.entries(stageResults).map(([s,v])=>`<div class="result-row"><b>${esc(STAGE_ZH[s]||s)}</b>${v&&v.error?`<span class="badge fail">${esc(v.error)}</span>`:'<span class="badge done">完成</span>'}</div>`).join("");
    $("#runStat").innerHTML=failed.length?`<span style="color:var(--warn)">部分阶段失败（${failed.length}）</span>`:'<span style="color:var(--go2)"><span aria-hidden="true">✓</span> 运行完成</span>';
    $("#runOut").innerHTML=`<div class="card run-result"><h3>${failed.length?"部分完成":"运行完成"}</h3>${rows}<details><summary>查看原始结果</summary><pre>${esc(JSON.stringify(stageResults,null,1))}</pre></details></div>`;
    toast(failed.length?"部分阶段失败，请查看结果":"流水线完成",failed.length?"err":"ok");
    if(project) selectProject(project,true).then(()=>renderWorkbench());
  });
}

// Carry on from where the run stopped: the same chapters, the same
// episodes, the same stages - the ones that are finished are skipped.
async function doResume(){
  const slug=($("#runProj")&&$("#runProj").value)||S.current;
  if(!slug){ toast("先选一个项目","err"); return; }
  const r=await postJSON("/api/resume",{project:slug});
  if(!r||!r.ok){ toast((r&&r.error)||"没有可续跑的记录","err",4200); return; }
  $("#runStat").innerHTML='<span class="spin"></span> 续跑中…（接着上次的计划）';
  $("#runGo").disabled=true;
  const rb=$("#runResume"); if(rb) rb.disabled=true;
  toast("已按上次的计划继续","ok",2600);
  watchRun(r.job, slug);
}

    const isDef=m.id===S.modelDefault;

      :(m.api_key_set?`已保存 ${esc(m.api_key_masked||"")} · 留空不修改`:"未设置（本地可随便填）");

        <div class="grow"><label class="fl">模型名</label>

            ${m.api_key_set?'<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--fg2);white-space:nowrap"><input type="checkbox" data-f="clear_key">清除</label>':""}

function bindModelEvents(){
  $$("#modelList .mcard").forEach((card,i)=>{
    const m=S.modelEntries[i]; if(!m) return;
    $$(".chip[data-role]",card).forEach(c=>c.onclick=()=>c.classList.toggle("on"));
    $('input[name="mdef"]',card).onchange=()=>{ S.modelDefault=m.id; renderModelList(); };
    $$("[data-act]",card).forEach(b=>b.onclick=()=>{
      const act=b.dataset.act;
      if(act==="key"){
        const inp=$('[data-f="api_key"]',card);
        const show=inp.type==="password"; inp.type=show?"text":"password";
        b.textContent=show?"隐藏":"显示";
      } else if(act==="test"){
        testModel(i);
      } else if(act==="del"){
        harvestModels(); S.modelEntries.splice(i,1);
        if(!S.modelEntries.some(x=>x.id===S.modelDefault)) S.modelDefault=S.modelEntries[0]?S.modelEntries[0].id:"";
        renderModelList();
      } else if(act==="up" && i>0){
        harvestModels(); [S.modelEntries[i-1],S.modelEntries[i]]=[S.modelEntries[i],S.modelEntries[i-1]]; renderModelList();
      } else if(act==="down" && i<S.modelEntries.length-1){
        harvestModels(); [S.modelEntries[i+1],S.modelEntries[i]]=[S.modelEntries[i],S.modelEntries[i+1]]; renderModelList();
      }
    });
  });
}
function harvestModels(){
  $$("#modelList .mcard").forEach((card,i)=>{
    const m=S.modelEntries[i]; if(!m) return;
    $$("[data-f]",card).forEach(inp=>{
      const f=inp.dataset.f;
      if(f==="api_key"){ const v=inp.value.trim(); if(v) m.api_key=v; }
      else if(f==="clear_key"){ if(inp.checked){ m.clear_api_key=true; delete m.api_key; } else delete m.clear_api_key; }
      else if(f==="use_proxy"){ m.use_proxy=inp.checked; }
      else if(f==="temperature"||f==="max_tokens"||f==="timeout"){ m[f]=num(inp.value,m[f]); }
      else m[f]=inp.value;
    });
    m.roles=$$(".chip.on[data-role]",card).map(c=>c.dataset.role);
  });
  const sel=$('input[name="mdef"]:checked'); if(sel) S.modelDefault=sel.value;
}
function addModel(provId, provs){
  harvestModels();
  const p=(provs||[]).find(x=>x.id===provId)||{};
  const id="m"+Date.now().toString(36);
  const first=S.modelEntries.length===0;
  S.modelEntries.push({id,label:(p.label||"新模型").replace(/（.*?）/g,"").trim()||"新模型",
    base_url:p.base_url||"",model:p.model||"",api_key:p.api_key||"",
    temperature:0.7,max_tokens:4096,timeout:300,use_proxy:false,
    roles:first?(S.modelRoles||[]).map(r=>r.id):[]});
  if(first||!S.modelDefault) S.modelDefault=id;
  renderModelList();
}
function addAllInOne(){
  harvestModels();
  const roles=(S.modelRoles||[]).map(r=>r.id);
  if(!roles.length){ toast("没有可用任务列表","warn"); return; }
  // 便捷：沿用当前默认/第一张卡的连接信息（通常就是主力模型），用户只需核对地址和模型名
  const cur=S.modelEntries.find(x=>x.id===S.modelDefault)||S.modelEntries[0]||{};
  const id="m"+Date.now().toString(36);
  // 置顶（列表顺序＝优先级），勾满全部任务并设为默认兜底 → 它一个人包干所有活
  S.modelEntries.unshift({id,label:cur.label?`${cur.label.replace(/（.*?）/g,"").trim()}·全包`:"全能模型（全包）",
    base_url:cur.base_url||"http://localhost:11434/v1",
    model:cur.model||"",api_key:"",
    temperature:num(cur.temperature,0.7),max_tokens:Math.round(num(cur.max_tokens,4096)),
    timeout:num(cur.timeout,300),use_proxy:!!cur.use_proxy,
    roles:roles});
  S.modelDefault=id;
  renderModelList();
  toast("已置顶一个勾满全部任务的模型。核对地址/模型名后点「保存模型清单」即可；下方卡片原样保留，想恢复分工把它的任务取消勾选或删除即可","ok");
}
async function testModel(i){
  harvestModels();
  const m=S.modelEntries[i]; if(!m) return;
  const card=$(`#modelList .mcard[data-i="${i}"]`);
  const out=$('[data-out="test"]',card), chipsBox=$('[data-out="models"]',card);
  out.innerHTML='<span class="spin"></span> 正在连接…（最多约 10 秒）';
  const r=await postJSON("/api/config/test_llm",{entry_id:m.id,base_url:m.base_url,
    api_key:m.api_key||"",model:m.model,use_proxy:!!m.use_proxy});
  const models=r.models||[];
  if(models.length){
    const dl=$(`datalist#ml${i}`); if(dl) dl.innerHTML=models.map(x=>`<option value="${esc(x)}">`).join("");
    chipsBox.innerHTML='<span class="muted" style="font-size:12px">端点模型（点击选用）：</span>'+
      models.slice(0,30).map(x=>`<span class="chip" data-pick="${esc(x)}">${esc(x)}</span>`).join("");
    $$(".chip",chipsBox).forEach(c=>c.onclick=()=>{ $('[data-f="model"]',card).value=c.dataset.pick; });
  } else chipsBox.innerHTML="";
  out.innerHTML = r.ok
    ? `<span style="color:var(--go2)">${mark("✓")} ${esc(r.message||"连接成功")}</span>${r.used_saved_key?'<span class="muted">（用了已保存的 Key）</span>':""}`
    : `<span style="color:var(--danger2)">${mark("✗")} ${esc(r.error||"连接失败")}</span>`;
}
async function saveModels(){
  harvestModels();
  for(const m of S.modelEntries){
    if(!(m.base_url||"").trim()||!(m.model||"").trim()){
      $("#mSaveOut").innerHTML='<span style="color:var(--danger2)">每个模型都要填接口地址和模型名</span>'; return;
    }
  }
  const body={default:S.modelDefault,entries:S.modelEntries.map(m=>({
    id:m.id,label:(m.label||"").trim(),base_url:(m.base_url||"").trim(),
    model:(m.model||"").trim(),temperature:num(m.temperature,0.7),
    max_tokens:Math.round(num(m.max_tokens,4096)),timeout:num(m.timeout,300),
    use_proxy:!!m.use_proxy,roles:m.roles||[],
    ...(m.api_key?{api_key:m.api_key}:{}),...(m.clear_api_key?{clear_api_key:true}:{}),
  }))};
  $("#mSave").disabled=true;
  const r=await postJSON("/api/config/models",body);
  $("#mSave").disabled=false;
  if(!r.ok){ $("#mSaveOut").innerHTML=`<span style="color:var(--danger2)">保存失败：${esc(r.error||"")}</span>`; return; }
  S.settings=r; S.modelEntries=r.entries||[]; S.modelDefault=r.default||"";
  $("#mSaveOut").innerHTML=`<span style="color:var(--go2)">${mark("✓")} 已写回 default.yaml</span>`;
  renderModelList(); toast("模型清单已保存","ok");
}

$("#cmdGo").onclick=runCmd;
$("#cmd").addEventListener("keydown",e=>{if(e.key==="Enter")runCmd();});
async function runCmd(){
  const instr=$("#cmd").value.trim(); if(!instr) return;
  $("#cmdGo").disabled=true; $("#cmdGo").textContent="解析中";
  const r=await postJSON("/api/ai/parse",{instruction:instr,project:$("#cmdproj").value});
  $("#cmdGo").disabled=false; $("#cmdGo").textContent="解析";
  if(!r.ok){ toast("解析失败："+esc(r.error||""),"err"); return; }
  showPreview(r.action,instr);
}
function showPreview(a,instr){
  const p=$("#preview");
  const params=Object.entries(a.params||{}).filter(([k,v])=>v!==""&&!(Array.isArray(v)&&!v.length)&&!(v&&typeof v==="object"&&!Object.keys(v).length));
  const pstr=params.map(([k,v])=>`<span class="kv">${esc(k)}=${esc(typeof v==="object"?JSON.stringify(v):v)}</span>`).join(" ");
  p.style.cssText="display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border-bottom:1px solid var(--ai-soft-line);padding:9px 14px";
  p.innerHTML=`<div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:12.5px">${esc(a.title)} ${a.note?`<span class="muted" style="font-weight:400">· ${esc(a.note)}</span>`:""}</div>
      <div class="muted" style="font-size:12.5px;margin:2px 0 5px">${esc(a.confirm_msg||"")} · 原话：“${esc(instr)}”</div>
      <div>${pstr||'<span class="muted">（无参数）</span>'}</div></div>
    <button class="btn ${a.needs_confirm?"confirm":"go"} sm" id="pvOk">${a.needs_confirm?"确认执行":"执行"}</button>
    <button class="btn ghost sm" id="pvNo">取消</button>`;
  $("#pvNo").onclick=()=>p.style.display="none";
  $("#pvOk").onclick=()=>execAction(a);
}
async function execAction(a){
  $("#preview").style.display="none"; $("#cmd").value="";
  const r=await postJSON("/api/ai/run",{action:a});
  if(!r.ok){ toast("执行失败："+esc(r.error||""),"err"); return; }
  if(r.job){
    toast("已提交，后台执行中…");
    pollJob(r.job,res=>{
      toast(mark("✓")+" "+a.title+" 完成","ok");
      if(a.kind==="search"&&res){ switchPage("workbench"); S.wbTab="assets"; showWbTab("assets"); renderSearchResults(res); }
      boot(); if(S.current) selectProject(S.current,true);
    });
  } else if(r.result){
    const res=r.result;
    if(a.kind==="search"){ switchPage("workbench"); S.wbTab="assets"; showWbTab("assets"); renderSearchResults(res); }
    else toast(mark("✓")+" "+a.title+" 完成","ok");
    boot();
  }
}
function renderSearchResults(res){
  const box=$("#searchres"); if(!box) return;
  box.innerHTML=""; (res.results||[]).forEach(x=>box.appendChild(resultCard(x)));
  $("#searchmeta").innerHTML=`命中 <b>${res.count||0}</b> 条`;
  $("#assetSection")&&($("#assetSection").style.display="none");
}

<script>
// the chapter picker: the table of contents, and how many episodes
window.__chapters = [];
// which chapters are picked: keep it here so switching modes keeps your picks
window.__chosen = window.__chosen || null;
window.__chapMode = window.__chapMode || "icon";

function _chapChosenSet(){
  // The picked chapters, read from whichever mode is on screen.  List mode
  // shows checkboxes, icon mode shows tiles; taking only one of them left
  // the other view picking nothing at all.
  const boxes=[].slice.call(document.querySelectorAll("#chapterList input[type=checkbox]"));
  if(boxes.length){
    window.__chosen=new Set(boxes.filter(b=>b.checked).map(b=>Number(b.dataset.idx)));
  } else {
    const tiles=[].slice.call(document.querySelectorAll("#chapterList .chap-tile"));
    if(tiles.length){
      window.__chosen=new Set(tiles.filter(t=>t.classList.contains("on"))
                                   .map(t=>Number(t.dataset.idx)));
    }
  }
  if(!window.__chosen) window.__chosen=new Set();
  window.__chapChosen=window.__chosen;
  return window.__chosen;
}
// what the run is about: the ticked chapters, or the whole book
function drawChapScope(){
  const n=window.__chapChosen?window.__chapChosen.size:0;
  const hint=document.getElementById("chapScopeHint");
  if(hint) hint.textContent=window.__chapScope?("本次做这 "+n+" 章"):"本次做整本书";
  const rs=document.getElementById("runScope");
  if(rs) rs.textContent=window.__chapScope?("· 章节 "+n+" 章"):"";
}
function updateChapHint(){
  const hint=document.getElementById("chapterHint");
  if(!hint) return;
  const n=(window.__chapters||[]).length;
  const k=_chapChosenSet().size;
  hint.textContent="共 "+n+" 章 · 已选 "+k;
}
// What has been made of each chapter: made, being made, or not made.
// The pipeline writes down which chapters each episode was made of, so
// this is the truth rather than a guess; a project made before that
// was written down falls back to the chapters that were cut.
function chapterStates(){
  const map={};
  const d=S.detail;
  if(!d) return map;
  const eps=d.episodes||[];
  let mapped=false;
  eps.forEach(ep=>{
    const list=ep.chapter_indexes||[];
    if(!list.length) return;
    const vals=Object.values(ep.stage_status||{});
    let s="pending";
    if(vals.length && vals.every(v=>v==="done")) s="done";
    else if(vals.indexOf("running")>=0||vals.indexOf("interrupted")>=0
         ||vals.indexOf("failed")>=0) s="running";
    list.forEach(ci=>{ map[ci]=s; mapped=true; });
  });
  if(!mapped){
    const meta=d.meta||{};
    const ps=d.stage_status||{};
    const vals=Object.values(ps);
    const s=vals.indexOf("running")>=0?"running"
          :(vals.length&&vals.every(v=>v==="done"))?"done":"running";
    (meta.segmented_chapters||[]).forEach(ci=>{ map[ci]=s; });
  }
  return map;
}
const CHAP_STATE_ZH={done:"做过",running:"正在做",pending:"没做过"};
function _chapClick(idx, on){
  const set=_chapChosenSet();
  if(on) set.add(idx); else set.delete(idx);
  updateChapHint();
}
function setAllChapters(on){
  const set=_chapChosenSet();
  if(on){ (window.__chapters||[]).forEach(c=>set.add(c.index)); }
  else set.clear();
  // reflect it in whichever mode is showing
  [].slice.call(document.querySelectorAll("#chapterList input[type=checkbox]"))
    .forEach(b=>{ b.checked=on; });
  [].slice.call(document.querySelectorAll("#chapterList .chap-tile"))
    .forEach(t=>{ t.classList.toggle("on", on); });
  updateChapHint();
}
function toggleChapMode(){
  _chapChosenSet();                       // stash picks before we redraw
  window.__chapMode = window.__chapMode==="list" ? "icon" : "list";
  _renderChapters();
}
function _renderChapters(){
  const box=document.getElementById("chapterList");
  const chs=window.__chapters||[];
  if(!box) return;
  const chosen=_chapChosenSet();
  const mode=window.__chapMode;
  const lbl=document.getElementById("chapMode");
  // the button names the view it will switch to, not the one already showing
  if(lbl){ lbl.textContent = mode==="list" ? "图标视图" : "列表视图";
           lbl.setAttribute("aria-label", lbl.textContent); }

  if(!chs.length){ box.innerHTML='<div class="muted">这本书没有切出章节</div>'; return; }

  const states=chapterStates();
  const stateOf=(c)=>states[c.index]||"pending";

  if(mode==="list"){
    let lastVol=null, out=[];
    chs.forEach(c=>{
      if(c.volume && c.volume!==lastVol){
        out.push('<div class="chap-vol">'+esc(c.volume)+'</div>');
        lastVol=c.volume;
      }
      out.push('<label class="chap-row st-'+stateOf(c)+'" style="display:flex;gap:8px;align-items:center;padding:2px 0">' +
        '<input type="checkbox" data-idx="'+c.index+'"'+(chosen.has(c.index)?' checked':'')+
        ' onchange="_chapClick('+c.index+',this.checked)"> ' +
        '<b class="rd-open" onclick="event.stopPropagation();openReader('+c.index+')" ' +
        'style="cursor:pointer" title="点击阅读">第'+c.index+'章 '+esc(c.title||'')+'</b> ' +
        '<span class="muted">'+Math.round(c.chars/1000)+'k 字</span> ' +
        '<span class="chap-state">'+CHAP_STATE_ZH[stateOf(c)]+'</span></label>');
    });
    box.innerHTML=out.join("");
  } else {
    let lastVol=null, out=['<div class="chap-grid">'];
    chs.forEach(c=>{
      if(c.volume && c.volume!==lastVol){
        out.push('</div><div class="chap-vol">'+esc(c.volume)+'</div><div class="chap-grid">');
        lastVol=c.volume;
      }
      out.push('<div class="chap-tile st-'+stateOf(c)+(chosen.has(c.index)?' on':'')+'" '+
        'data-idx="'+c.index+'" title="第'+c.index+'章 '+esc(c.title||'')+' · '+
        Math.round(c.chars/1000)+'k 字 · '+CHAP_STATE_ZH[stateOf(c)]+'（点一下选中）" '+
        'onclick="_chapTile(this)">' +
        '<span class="tick">'+(chosen.has(c.index)?'✓':'')+'</span>' +
        '<span class="cn">'+c.index+'</span>' +
        '<span class="ck">'+Math.round(c.chars/1000)+'k</span>' +
        '<span class="cr" onclick="event.stopPropagation();openReader('+c.index+')" '+
        'title="读这一章">读</span></div>');
    });
    out.push('</div>');
    box.innerHTML=out.join("");
  }
  updateChapHint();
}
function _chapTile(el){
  const on=!el.classList.contains("on");
  el.classList.toggle("on", on);
  _chapClick(Number(el.dataset.idx), on);
}
async function loadChapters(slug){
  const r = await postJSON("/api/catalog",{project:slug});
  if(!r || !r.ok) return;
  window.__chapters = r.chapters || [];
  // Nothing is picked to begin with: a page that says "all of them"
  // before anyone has chosen anything is not saying what the person
  // wants.  The 全选 button is there when they want all of them.
  window.__chosen = new Set();
  const card = document.getElementById("work-chapters");
  if(card) card.style.display = "";
  _renderChapters();
  drawChapScope();
}
</script>


<script>

  const what = p ? ((p.episodes||0)+" 集、"+(p.shots||0)+" 个镜头、"+(p.characters||0)+" 个角色") : "";

<script>
// ---- chapter reader ----
function _chapByIndex(idx){
  return (window.__chapters||[]).find(c=>c.index===idx) || null;
}
let _rdLast=null;
async function openReader(idx){
  const slug=S.current;
  const root=document.getElementById("readerRoot");
  if(!root) return;
  // remember where the reader was opened from, but only on the way in:
  // turning to the next chapter reopens this sheet, and the caret should
  // still go back to the chapter list afterwards
  if(!root.firstChild) _rdLast=document.activeElement;
  // draw the shell first so the click feels instant, then fill it
  root.innerHTML='<div class="rd-scrim" data-rd-scrim>'+
    '<div class="rd-sheet" role="dialog" aria-modal="true" aria-labelledby="rdTitle">'+
      '<div class="rd-head">'+
        '<span class="rd-t" id="rdTitle">读取中…</span>'+
        '<span class="rd-v" id="rdVol"></span>'+
        '<span style="flex:1"></span>'+
        '<span class="rd-v" id="rdPos"></span>'+
        '<button class="btn ghost icon" data-rd-close aria-label="关闭阅读器 (Esc)">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '</div>'+
      '<div class="rd-body" id="rdBody" tabindex="0">正在读取正文…</div>'+
      '<div class="rd-foot">'+
        '<button class="btn" id="rdPrev" data-rd-prev>← 上一章</button>'+
        '<button class="btn" id="rdNext" data-rd-next>下一章 →</button>'+
        '<span style="flex:1"></span>'+
        '<span id="rdMeta"></span>'+
      '</div>'+
    '</div></div>';
  const scrim=root.querySelector("[data-rd-scrim]");
  scrim.onclick=e=>{ if(e.target===scrim) closeReader(); };
  root.querySelector("[data-rd-close]").onclick=closeReader;
  root.querySelector("[data-rd-prev]").onclick=()=>_rdStep(-1);
  root.querySelector("[data-rd-next]").onclick=()=>_rdStep(1);
  trapFocus(root.querySelector(".rd-sheet"));
  const closeBtn=root.querySelector("[data-rd-close]");
  if(closeBtn) closeBtn.focus();
  window.__rdIdx=idx;
  document.addEventListener("keydown", _rdKey);

  const r=await postJSON("/api/chapter/read",{project:slug,chapter:idx});
  if(!r||!r.ok){
    const b=document.getElementById("rdBody");
    if(b) b.innerHTML='<span class="muted">读不到这一章：'+esc((r&&r.error)||"未知错误")+'</span>';
    return;
  }
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v||"";};
  set("rdTitle","第"+r.index+"章 "+(r.title||""));
  set("rdVol", r.volume||"");
  set("rdBody", r.text||"");
  set("rdMeta", Math.round((r.chars||0)/1000)+"k 字");
  _rdSyncNav();
}
function _rdSyncNav(){
  // grey out the ends of the volume, and say where you are
  const list=window.__chapters||[];
  const pos=list.findIndex(c=>c.index===window.__rdIdx);
  const set=(id,dis)=>{const e=document.getElementById(id); if(e) e.disabled=!!dis;};
  set("rdPrev", pos<=0);
  set("rdNext", pos<0 || pos>=list.length-1);
  const e=document.getElementById("rdPos");
  if(e && pos>=0) e.textContent="第 "+(pos+1)+" / "+list.length+" 章";
}
function _rdStep(dir){
  const list=window.__chapters||[];
  const pos=list.findIndex(c=>c.index===window.__rdIdx);
  const nx=list[pos+dir];
  if(nx) openReader(nx.index);
}
function _rdTyping(e){
  const t=e.target||{};
  // a field being typed in, and the chapter text itself: arrows inside
  // the page being read move the page, not the chapter
  return t.isContentEditable||["INPUT","TEXTAREA","SELECT"].includes(t.tagName||"")||t.id==="rdBody";
}
function _rdKey(e){
  if(e.key==="Escape"){ closeReader(); return; }
  if(_rdTyping(e)) return;              // arrows belong to what is being read or typed
  if(e.key==="ArrowLeft") _rdStep(-1);
  if(e.key==="ArrowRight") _rdStep(1);
}
function closeReader(){
  const root=document.getElementById("readerRoot");
  if(root) root.innerHTML="";
  document.removeEventListener("keydown", _rdKey);
  _rdLast?.focus?.();
  _rdLast=null;
}
</script>

<script>
// ---------- production seasons ----------
// A long book is made a season at a time. This shows what each season
// took and what it left, and starts a new one over the picked chapters.
async function loadSeasons(slug){
  const r = await getJSON("/api/seasons?project="+encodeURIComponent(slug));
  const box = document.getElementById("seasonList");
  if(!box) return;
  if(!r || !r.ok){
    box.innerHTML = '<div class="muted">读不到季记录</div>';
    return;
  }
  window.__seasons = r.seasons || [];
  window.__nextSeason = r.current || 1;
  const card = document.getElementById("work-seasons");
  if(card) card.style.display = "";
  const hint = document.getElementById("seasonHint");
  if(hint) hint.textContent = "已完成 " + (r.chapters_done||0) + " / " +
      (r.chapters_total||0) + " 章 · 下一季从第 " + (r.next_chapter||1) + " 章起";
  const rows = (window.__seasons||[]).map(se=>{
    // what this season covered: the episodes it produced says more than
    // the chapters it read, and a season made before seasons existed has
    // only the episodes.
    let span = "";
    if(se.episode_range && se.episode_range.length===2){
      span = "第" + se.episode_range[0] + "~" + se.episode_range[1] + "集";
    } else if(se.chapters && se.chapters.length){
      span = "第" + Math.min.apply(null,se.chapters) + "~" +
             Math.max.apply(null,se.chapters) + "章";
    } else {
      span = "来路不明";
    }
    const st = se.status==="done" ? "完成" : (se.status==="failed" ? "失败" : "进行中");
    const tone = se.status==="done" ? "var(--go2)"
               : (se.status==="failed" ? "var(--danger)" : "var(--warn)");
    return '<div style="display:flex;gap:8px;align-items:center;padding:4px 0;' +
      'border-bottom:1px solid var(--line)">' +
      '<b>第' + se.index + '季</b>' +
      '<span class="mini" style="color:' + tone + '">' + st + '</span>' +
      '<span class="mini muted">' + span + '</span>' +
      '<span class="mini muted">' + (se.episodes||0) + ' 集</span>' +
      (se.synopsis ? '<span class="mini muted" style="flex:1;overflow:hidden;' +
        'text-overflow:ellipsis;white-space:nowrap">' + esc(se.synopsis) + '</span>'
        : '<span style="flex:1"></span>') +
      '</div>';
  }).join("");
  box.innerHTML = rows || '<div class="muted">还没有季，选中章节后开始第一季</div>';
}

// Start a season over whatever is picked. One season is one whole run of
// the pipeline - analysis through the finished film - not three stages of
// it, because a batch of chapters is a batch of episodes and half of one
// is not an episode anyone can watch.
</script>

<script>
// ---------- see a picture whole ----------
// A reference sheet is a thumbnail beside a form, and a face you are meant
// to be checking has to be checked. This opens it over the page, with the
// character's other references a key away.
let lightbox={imgs:[],i:0,label:"",last:null};
function openLightbox(imgs,i,label){
  const list=(imgs||[]).filter(Boolean);
  if(!list.length) return;
  // last goes inside the object: assigning it before the rebuild below
  // would be thrown away by it
  lightbox={imgs:list,i:Math.max(0,Math.min(i||0,list.length-1)),
            label:label||"",last:document.activeElement};
  renderLightbox();
  document.addEventListener("keydown",lightboxKeys);
  const close=document.querySelector("#lightboxRoot [data-lb-close]");
  if(close) close.focus();
}
function closeLightbox(){
  const r=document.getElementById("lightboxRoot");
  if(r) r.innerHTML="";
  document.removeEventListener("keydown",lightboxKeys);
  // the caret returns to the picture the viewer clicked
  lightbox.last?.focus?.();
  lightbox.last=null;
}
function lightboxStep(d){
  const n=lightbox.i+d;
  if(n<0||n>=lightbox.imgs.length) return;
  lightbox.i=n;
  renderLightbox();
}
function lightboxKeys(e){
  const t=e.target||{};
  if(t.isContentEditable||["INPUT","TEXTAREA","SELECT"].includes(t.tagName||"")) return;
  if(e.key==="Escape") closeLightbox();
  else if(e.key==="ArrowLeft") lightboxStep(-1);
  else if(e.key==="ArrowRight") lightboxStep(1);
}
function renderLightbox(){
  const root=document.getElementById("lightboxRoot");
  if(!root) return;
  const {imgs,i,label}=lightbox;
  const many=imgs.length>1;
  const head=(label||"图片");
  root.innerHTML=`<div class="lb-scrim" data-lb-scrim>
    <div class="lb-box" role="dialog" aria-modal="true" aria-label="${attr(head)}">
      <div class="lb-head">
        <span class="t">${esc(label)}</span>
        ${many?`<span class="n">${i+1} / ${imgs.length}</span>`:""}
        <span style="flex:1"></span>
        <button class="btn ghost icon" data-lb-close aria-label="关闭图片">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="lb-body" data-lb-body>
        <img src="${imgs[i]}" alt="${attr(head+"：第 "+(i+1)+" 张，共 "+imgs.length+" 张")}">
      </div>
      <div class="lb-foot">
        <button class="btn" ${i<=0?"disabled":""} data-lb-prev>← 上一张</button>
        <span class="muted">${many?"← → 翻页 · ":""}点击空白处或 Esc 关闭</span>
        <span style="flex:1"></span>
        <button class="btn" ${i>=imgs.length-1?"disabled":""} data-lb-next>下一张 →</button>
      </div>
    </div></div>`;
  // only the space around the box closes it: a click on the picture itself
  // was closing the thing the viewer had leaned in to look at
  const scrim=root.querySelector("[data-lb-scrim]");
  const body=root.querySelector("[data-lb-body]");
  const closeOutside=e=>{ if(e.target===scrim||e.target===body) closeLightbox(); };
  scrim.onclick=closeOutside;
  body.onclick=closeOutside;
  root.querySelector("[data-lb-close]").onclick=closeLightbox;
  root.querySelector("[data-lb-prev]").onclick=()=>lightboxStep(-1);
  root.querySelector("[data-lb-next]").onclick=()=>lightboxStep(1);
  trapFocus(root.querySelector(".lb-box"));
}
</script>

<script>
// ---------- stop a run ----------
// The pipeline asks whether to continue before each stage and before each
// episode, so this takes effect at the next item rather than at the end of
// the batch - which is the only reason to have a button at all.
async function stopRun(){
  const btn=document.getElementById("stopRunBtn");
  if(btn){ btn.disabled=true; btn.textContent="正在停…"; }
  const r=await postJSON("/api/jobs/stop",{});
  if(!r||!r.ok){
    if(btn){ btn.disabled=false; btn.textContent="停止"; }
    toast((r&&r.error)||"停不下来","err",4000);
    return;
  }
toast("已请求停止：当前这一步的调用结束后停下（约 1 分钟内），" +
        "已完成的保留","",5000);
  // the panel keeps polling; the stage will show as interrupted when the
  // run has actually let go
  setTimeout(()=>{ updateProgressPanel(); }, 2500);
}
</script>

<script>
// ---------- the skills: what each stage writes with ----------
// The stages send their skills with every model call, so a list that
// looks harmless is a multiplier on the whole batch - the prompt stage
// was measured at ten thousand characters per shot because two skills
// were always on. What one costs is shown next to it.
const SK_STAGES=[["analyze","分析"],["script","编剧"],
                 ["storyboard","分镜"],["promptgen","提示词"]];
let SK=null;   // {skills, selection, costs}
let SK_PROMISE=null, SK_FOR="";   // the load on its way, and for whom

function fmtChars(n){ return n>=10000 ? (n/10000).toFixed(1)+"万字" : (n||0)+"字"; }

async function loadSkills(){
  const slug=S.current;
  const q=slug?("?project="+encodeURIComponent(slug)):"";
  const r=await getJSON("/api/skills"+q);
  if(!r||!r.ok){ toast("读不到技能目录","err"); return; }
  SK=r;
  renderSkills();
}

function renderSkills(){
  const box=$("#page-skills");
  if(!SK){ box.innerHTML='<div class="empty">读取中…</div>'; loadSkills(); return; }
  const sel=SK.selection||{}, costs=SK.costs||{};
  const byName={}; (SK.skills||[]).forEach(x=>byName[x.name]=x);

  // what each stage is using, and what that costs per call
  const stageHtml=SK_STAGES.map(([k,zh])=>{
    const names=sel[k]||[];
    const chips=names.length
      ? names.map(n=>`<button type="button" class="chip on" title="${esc((byName[n]||{}).description||"")}"
            aria-label="${attr(((byName[n]||{}).title||n))}，从${esc(zh)}移出" data-skill="${esc(n)}" data-stage="${esc(k)}">${esc((byName[n]||{}).title||n)}<span class="sk-x" aria-hidden="true">×</span></button>`).join("")
      : '<span class="muted">不使用技能（用内置规矩）</span>';
    return `<div class="card" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <b>${esc(zh)}</b>
        <span class="mini muted">每次调用注入</span>
        <b class="sk-cost" style="color:${(costs[k]||0)>6000?"var(--danger2)":"var(--fg2)"}">${fmtChars(costs[k]||0)}</b>
        <span style="flex:1"></span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">${chips}</div>
    </div>`;
  }).join("");

  // every skill there is, grouped by family
  const fams={};
  (SK.skills||[]).forEach(x=>{ (fams[x.family_zh]=fams[x.family_zh]||[]).push(x); });
  const rows=Object.keys(fams).map(fam=>{
    const list=fams[fam];
    const total=list.reduce((a,x)=>a+x.chars,0);
    return `<h3 class="page" style="font-size:13px;margin:16px 0 6px">${esc(fam)}
        <span class="muted" style="font-weight:400;font-size:12px">${list.length} 个 · ${fmtChars(total)}</span></h3>
      <div class="card" style="padding:4px 14px">${list.map(x=>skillRow(x,sel)).join("")}</div>`;
  }).join("");

  box.innerHTML=`
    <h1 class="page">技能</h1>
    <div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="mini muted">当前项目</span>
      <b>${esc((S.detail&&S.detail.meta&&(S.detail.meta.title||S.detail.meta.name))||S.current||"（未选项目）")}</b>
      <span style="flex:1"></span>
      <button class="btn ai" id="skReco">让 AI 按本项目挑</button>
      <button class="btn go" id="skSave">保存到本项目</button>
    </div>
    <div id="skRecoBox"></div>
    <h2 class="page" style="font-size:14px;margin:14px 0 8px">各阶段在用</h2>
    ${stageHtml}
    <h2 class="page" style="font-size:14px;margin:16px 0 8px">全部技能
      <span class="muted" style="font-weight:400;font-size:12px">点右边的阶段名加入或移出</span></h2>
    ${rows}`;
  // wired after the draw, and through data attributes: an inline handler
  // carrying a skill name is a handler that breaks on an apostrophe
  $("#skReco").onclick=recommendSkills;
  $("#skSave").onclick=saveSkills;
  $$("[data-skill]",box).forEach(b=>b.onclick=()=>skillPick(b.dataset.stage,b.dataset.skill));
}

function skillRow(x, sel){
  const picks=SK_STAGES.map(([k,zh])=>{
    const on=(sel[k]||[]).indexOf(x.name)>=0;
    return `<button type="button" class="sk-pick ${on?"on":""}" data-skill="${esc(x.name)}" data-stage="${esc(k)}"
      aria-pressed="${on?"true":"false"}" title="${on?"从":"加入"}${esc(zh)}">${esc(zh)}</button>`;
  }).join("");
  const desc=(x.description||"").replace(/\s+/g," ").slice(0,150);
  return `<div class="sk-row">
    <div style="min-width:0">
      <span class="sk-name">${esc(x.title||x.name)}</span>
      <span class="sk-size">${fmtChars(x.chars)}</span>
      <div class="sk-desc" title="${esc(x.description||"")}">${esc(desc)}${(x.description||"").length>150?"…":""}</div>
      ${x.refs?`<div class="mini muted" style="margin-top:3px">另有 ${x.refs} 个深参考（${fmtChars(x.ref_chars)}，在配置的 refs 里点名才注入）</div>`:""}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${picks}</div>
  </div>`;
}

function skillPick(stage,name){
  if(!SK||!SK.selection) return;
  const list=SK.selection[stage]=SK.selection[stage]||[];
  const i=list.indexOf(name);
  // the cost is what the catalog says the selected skills add, summed
  // again after each change - not a running total that drifts when a
  // name is added twice or a catalog entry is edited
  if(i>=0) list.splice(i,1); else list.push(name);
  const byName={}; (SK.skills||[]).forEach(x=>byName[x.name]=x);
  SK.costs=SK.costs||{};
  SK.costs[stage]=list.reduce((a,n)=>a+((byName[n]||{}).chars||0),0);
  // the page is redrawn, so the scroll position is put back where it was
  const scroll=($("#main")||{}).scrollTop||0;
  renderSkills();
  $("#main").scrollTop=scroll;
}

async function saveSkills(){
  if(!S.current){ toast("先选一个项目","err"); return; }
  const r=await postJSON("/api/skills/save",{project:S.current,selection:SK.selection});
  if(!r||!r.ok){ toast("保存失败："+esc((r&&r.error)||"未知错误"),"err"); return; }
  // what comes back is what was stored: the server drops names that are
  // no longer in the catalog, and the page must show the stored list
  SK.selection=r.selection||SK.selection;
  SK.costs=r.costs||SK.costs;
  toast("已保存。下次跑流水线生效（正在跑的不受影响）","ok",4000);
  const scroll=($("#main")||{}).scrollTop||0;
  renderSkills();
  $("#main").scrollTop=scroll;
}

async function recommendSkills(){
  if(!S.current){ toast("先选一个项目","err"); return; }
  const btn=document.getElementById("skReco");
  if(btn){ btn.disabled=true; btn.textContent="正在读项目…"; }
  const r=await postJSON("/api/skills/recommend",{project:S.current});
  if(btn){ btn.disabled=false; btn.textContent="✦ 让 AI 按本项目挑"; }
  if(!r||!r.ok){ toast("推荐失败："+esc((r&&r.error)||"未知错误"),"err",5000); return; }
  SK.selection=r.selection||{};
  SK.costs=r.costs||{};
  const box=document.getElementById("skRecoBox");
  if(box&&r.reasons){
    const rows=Object.keys(r.reasons).map(k=>
      `<div class="sk-row"><span class="sk-name">${esc(k)}</span>
       <div class="sk-desc">${esc(r.reasons[k])}</div></div>`).join("");
    box.innerHTML=`<div class="card" style="margin-bottom:8px">
      <b>AI 的理由</b><div style="margin-top:6px">${rows}</div>
      <div class="mini muted" style="margin-top:8px">还没保存——确认后点「保存到本项目」。</div>
    </div>`;
  }
  renderSkills();
}
</script>
<script src="/modern.js"></script>
</body>
</html>
