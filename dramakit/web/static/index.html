<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DramaKit 制作台</title>
<script>
try{
  if(localStorage.getItem("dk-theme")==="dark") document.documentElement.dataset.theme="dark";
}catch(e){}
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#f4f6f9; --bg2:#ffffff; --bg3:#eef2f7; --bg4:#dfe6ee;
    --line:#dbe2ea; --line2:#c3ceda;
    --fg:#1b2733; --fg2:#475569; --fg3:#64748b;
    --go:#1a7f37; --go2:#238636; --danger:#cf222e; --danger2:#c4302b;
    --confirm:#0969da; --confirm2:#0969da; --warn:#9a6700; --ai:#8250df;
    --chip:#eef2f7; --r:6px;
    --rail:#f9fbfd; --rail-on:#e8f1ff;
    --proj-on:#e8f1ff; --proj-on-line:#b9d4f7;
    --ai-soft-bg:#f4efff; --ai-soft-line:#dcccf8; --ai-soft-fg:#6b46c1;
    --ai-btn-bg:#f1eaff; --ai-btn-line:#cbb6f2; --ai-btn-fg:#5b3fbf;
    --pcard-on:#edf5ff;
    --done-bg:#e9f7ee; --done-line:#b5e2c0; --done-fg:#17692f;
    --partial-bg:#fff7e0; --partial-line:#ebd49c; --partial-fg:#7a5600;
    --badge-done-line:#b5e2c0; --badge-run-line:#b3d4f7; --badge-fail-line:#f0b8b4;
    --flf-bg:#f3edff; --flf-line:#d8c6f7; --flf-fg:#6b46c1;
    --media-bg:#e6ecf3; --ph1:#edf1f6; --ph2:#f7f9fb;
    --dash:#e4eaf1; --scrim:rgba(0,0,0,.62); --overlay:rgba(15,23,42,.32);
    --shadow:rgba(15,23,42,.18); --scroll:#c3ceda;
    --ai-focus:rgba(130,80,223,.18); --brand-shadow:rgba(58,110,240,.25);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c1015; --bg2:#121820; --bg3:#1a222c; --bg4:#202b37;
    --line:#27313d; --line2:#334250;
    --fg:#e8eef5; --fg2:#9fb0c1; --fg3:#697b8d;
    --go:#248a3d; --go2:#3fb950; --danger:#c93636; --danger2:#f0645c;
    --confirm:#1f6feb; --confirm2:#4c9aff; --warn:#c9971c; --ai:#8b5cf6;
    --chip:#1d2732;
    --rail:#090d11; --rail-on:#17222e;
    --proj-on:#17222e; --proj-on-line:#2b4a70;
    --ai-soft-bg:#201735; --ai-soft-line:#4b3a7a; --ai-soft-fg:#b79cff;
    --ai-btn-bg:#3b2a63; --ai-btn-line:#5b3fa0; --ai-btn-fg:#d8c9ff;
    --pcard-on:#16233a;
    --done-bg:#122117; --done-line:#2a5533; --done-fg:#9be2a8;
    --partial-bg:#1e1a10; --partial-line:#574a22; --partial-fg:#f0d38a;
    --badge-done-line:#264d2e; --badge-run-line:#243b5e; --badge-fail-line:#5e2626;
    --flf-bg:#201735; --flf-line:#4b3a7a; --flf-fg:#c4a5ff;
    --media-bg:#000000; --ph1:#11161d; --ph2:#151b23;
    --dash:#1e262f; --scrim:rgba(0,0,0,.72); --overlay:rgba(4,7,11,.5);
    --shadow:rgba(0,0,0,.55); --scroll:#2b3745;
    --ai-focus:rgba(139,92,246,.15); --brand-shadow:rgba(58,110,240,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
    font:13px/1.45 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    overflow:hidden}
  a{color:var(--confirm2);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:flex;height:100%}

  /* ---------- icon rail ---------- */
  #rail{width:68px;flex:0 0 auto;background:var(--rail);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
  .brand{width:38px;height:38px;border-radius:9px;background:linear-gradient(145deg,#2c6bed,#7c3aed);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
    letter-spacing:.5px;color:#fff;margin-bottom:10px;box-shadow:0 4px 14px var(--brand-shadow)}
  .railbtn{width:54px;padding:7px 0 5px;border:0;background:transparent;color:var(--fg3);
    display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px;
    cursor:pointer;font-size:10px;font-family:inherit}
  .railbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .railbtn:hover{background:var(--bg3);color:var(--fg2)}
  .railbtn.on{background:var(--rail-on);color:var(--confirm2)}
  .railbtn.on::before{content:"";position:absolute;left:0;width:2px;height:26px;background:var(--confirm2);border-radius:2px}
  .railbtn{position:relative}
  .rail-sp{flex:1}

  /* ---------- shell ---------- */
  #shell{flex:1;min-width:0;display:flex;flex-direction:column}
  header{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:baseline;gap:8px;min-width:0}
  .crumb b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .crumb span{font-size:11px;color:var(--fg3);white-space:nowrap}
  .hchips{display:flex;gap:6px;align-items:center;flex:1;overflow:hidden}
  .hchip{background:var(--chip);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;font-size:11px;color:var(--fg2);white-space:nowrap}
  .hchip b{color:var(--fg);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
  .dot.ok{background:var(--go2)} .dot.bad{background:var(--danger2)}
  .dot.warn{background:var(--warn)} .dot.na{background:var(--fg3)}
  .noderow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:6px 0;border-bottom:1px solid var(--line)}
  .noderow:last-child{border-bottom:none}

  /* ---------- AI command bar ---------- */
  #cmdbar{display:flex;gap:8px;padding:7px 14px;background:var(--bg2);
    border-bottom:1px solid var(--line);align-items:center;flex:0 0 auto}
  #cmdbar .lbl{font-size:11px;color:var(--ai);font-weight:650;white-space:nowrap;
    border:1px solid var(--ai-soft-line);background:var(--ai-soft-bg);color:var(--ai-soft-fg);border-radius:4px;padding:2px 7px}
  #cmd{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:var(--r);padding:7px 11px;font-size:12.5px;outline:none;font-family:inherit}
  #cmd:focus{border-color:var(--ai);box-shadow:0 0 0 2px var(--ai-focus)}
  #cmdproj{background:var(--bg);border:1px solid var(--line);color:var(--fg2);
    border-radius:var(--r);padding:6px 8px;font-size:12px;max-width:160px}

  /* ---------- workspace ---------- */
  #body{display:flex;flex:1;min-height:0}
  #side{width:232px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--line);
    overflow-y:auto;padding:10px}
  #side.hide{display:none}
  #main{flex:1;min-width:0;overflow-y:auto;padding:16px 18px}
  .side-h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);
    margin:12px 0 6px;font-weight:700;display:flex;justify-content:space-between}
  .side-h:first-child{margin-top:0}
  .proj{padding:7px 9px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;
    margin-bottom:3px}
  .proj:hover{background:var(--bg3)}
  .proj.on{background:var(--proj-on);border-color:var(--proj-on-line)}
  .proj .pn{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj .pm{color:var(--fg3);font-size:10.5px;margin-top:1px}
  .tagfilter{display:flex;flex-wrap:wrap;gap:4px}
  .tg{background:var(--chip);border:1px solid var(--line);color:var(--fg2);
    border-radius:12px;padding:1px 7px;font-size:10.5px;cursor:pointer}
  .tg:hover{border-color:var(--fg3)}
  .tg.on{background:var(--confirm);border-color:var(--confirm);color:#fff}

  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--line);background:var(--bg3);color:var(--fg);
    border-radius:var(--r);padding:6px 13px;font-size:12.5px;cursor:pointer;
    font-weight:550;white-space:nowrap;font-family:inherit}
  .btn:hover{filter:brightness(1.14)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.go{background:var(--go);border-color:var(--go);color:#fff}
  .btn.confirm{background:var(--confirm);border-color:var(--confirm);color:#fff}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.ghost{background:transparent}
  .btn.ai{background:var(--ai-btn-bg);border-color:var(--ai-btn-line);color:var(--ai-btn-fg)}
  .btn.sm{padding:3px 9px;font-size:11.5px}
  .btn.xs{padding:1px 7px;font-size:10.5px;border-radius:4px}
  #themeBtn{display:flex;align-items:center;justify-content:center;width:30px;padding:0}
  #themeBtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  html[data-theme="light"] #themeBtn .ico-sun{display:none}
  html[data-theme="dark"] #themeBtn .ico-moon{display:none}

  /* ---------- general ---------- */
  h1.page{font-size:17px;margin:0 0 3px;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--fg2);font-size:12px;margin-bottom:14px;line-height:1.55}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;
    align-items:center;gap:8px;justify-content:space-between}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .grow{flex:1;min-width:180px}
  label.fl{display:block;font-size:10.5px;color:var(--fg2);margin-bottom:3px}
  input.f,textarea.f,select.f{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--fg);border-radius:var(--r);padding:6px 9px;font-size:12.5px;outline:none;
    font-family:inherit}
  input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--confirm)}
  textarea.f{resize:vertical;min-height:54px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--fg2);
    border-radius:14px;padding:3px 10px;font-size:11.5px;cursor:pointer}
  .chip:hover{border-color:var(--fg3)}
  .chip.on{background:var(--confirm);border-color:var(--confirm);color:#fff}
  .pcard{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 12px;cursor:pointer;min-width:120px}
  .pcard:hover{border-color:var(--fg3)}
  .pcard.on{border-color:var(--confirm);background:var(--pcard-on)}
  .pcard .pl{font-weight:650;font-size:12.5px}
  .pcard .pd{color:var(--fg3);font-size:10.5px;margin-top:1px}
  .preset{display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);
    color:var(--fg2);background:var(--chip)}
  .badge.done{color:var(--go2);border-color:var(--badge-done-line)}
  .badge.run{color:var(--confirm2);border-color:var(--badge-run-line)}
  .badge.fail{color:var(--danger2);border-color:var(--badge-fail-line)}
  .badge.flf{color:var(--flf-fg);border-color:var(--flf-line);background:var(--flf-bg)}
  .muted{color:var(--fg3)}
  .empty{color:var(--fg3);text-align:center;padding:38px 10px;font-size:12.5px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--fg3);
    border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  code,.kv{font-family:var(--mono);font-size:11px;background:var(--bg);
    border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  .mini{font-size:9.5px;background:var(--chip);border:1px solid var(--line);
    border-radius:9px;padding:0 6px;color:var(--fg3);display:inline-block}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--bg3);border:1px solid var(--line);
    border-left:3px solid var(--confirm2);border-radius:var(--r);padding:10px 15px;
    font-size:12.5px;max-width:380px;box-shadow:0 6px 24px var(--shadow);z-index:200;
    opacity:0;transform:translateY(8px);transition:.2s}
  .toast.show{opacity:1;transform:none}
  .toast.err{border-left-color:var(--danger2)}
  .toast.ok{border-left-color:var(--go2)}

  /* ---------- workbench ---------- */
  .hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
  .hero .cover{width:96px;height:170px;flex:0 0 auto;border-radius:7px;overflow:hidden;
    background:var(--media-bg);border:1px solid var(--line)}
  .hero .cover img{width:100%;height:100%;object-fit:cover}
  .hero .hb{flex:1;min-width:0}
  .hero .ht{font-size:19px;font-weight:750;margin:0 0 2px}
  .hero .hm{color:var(--fg2);font-size:12px}
  .statrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:6px;
    padding:7px 11px;min-width:92px}
  .stat b{display:block;font-size:17px;line-height:1.2}
  .stat span{font-size:10.5px;color:var(--fg3)}
  .stagebar{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .stg{display:flex;align-items:center;gap:5px;background:var(--bg2);
    border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11.5px;
    color:var(--fg2);cursor:pointer}
  .stg:hover{border-color:var(--fg3)}
  .stg.done{color:var(--done-fg);border-color:var(--done-line);background:var(--done-bg)}
  .stg.partial{color:var(--partial-fg);border-color:var(--partial-line);background:var(--partial-bg)}
  .stg.pending{color:var(--fg2)}
  .stg .num{font-family:var(--mono);font-size:10px;opacity:.7}
  .epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .epcard{background:var(--bg2);border:1px solid var(--line);border-radius:7px;
    padding:11px;cursor:pointer;transition:border-color .12s}
  .epcard:hover{border-color:var(--line2)}
  .epcard .eh{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .epcard .eh b{font-size:13px}
  .epcard .el{color:var(--fg2);font-size:11.5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .epcard .ef{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .epcard .ebar{height:3px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
  .epcard .ebar i{display:block;height:100%;background:var(--go2)}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  details.fold{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
    padding:0;margin-bottom:12px;overflow:hidden}
  details.fold>summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:650;
    list-style:none;display:flex;align-items:center;gap:8px;color:var(--fg2)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary:hover{color:var(--fg)}
  details.fold[open]>summary{border-bottom:1px solid var(--line);color:var(--fg)}
  details.fold .inner{padding:13px 14px}

  /* ---------- storyboard ---------- */
  .boardbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .boardbar select{max-width:200px}
  .scblock{border:1px solid var(--line);border-radius:7px;margin-bottom:12px;
    background:var(--bg2);overflow:hidden}
  .sch{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--bg3);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sch .t{font-weight:650;font-size:12.5px}
  .sch .m{color:var(--fg3);font-size:11px}
  .shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;padding:10px 12px}
  .shotcard{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    overflow:hidden;cursor:pointer;position:relative}
  .shotcard:hover{border-color:var(--confirm)}
  .shotcard .media{height:200px;background:var(--media-bg);position:relative}
  .shotcard .media img,.shotcard .media video{width:100%;height:100%;object-fit:cover;display:block}
  .shotcard .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--fg3);font-size:11px;
    background:repeating-linear-gradient(45deg,var(--ph1),var(--ph1) 6px,var(--ph2) 6px,var(--ph2) 12px)}
  .shotcard .cap{padding:5px 7px;font-size:10.5px;color:var(--fg2);line-height:1.35}
  .shotcard .cap b{color:var(--fg);font-weight:600;font-size:11px}
  .shotcard .sidx{position:absolute;left:5px;top:5px;background:var(--scrim);
    color:#fff;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px}
  .shotcard .sfl{position:absolute;right:5px;top:5px;background:var(--flf-bg);
    color:var(--flf-fg);border:1px solid var(--flf-line);font-size:9.5px;padding:1px 6px;border-radius:3px}
  .shotcard .sst{position:absolute;right:5px;bottom:5px}
  .lines{padding:0 12px 10px}
  .line{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--dash);font-size:12px;
    align-items:flex-start}
  .line:last-child{border-bottom:0}
  .line .sp{color:var(--confirm2);min-width:58px;font-weight:600;font-size:11.5px}
  .line .tx{flex:1;color:var(--fg2)}
  .line .au{color:var(--fg3);font-size:10.5px;cursor:pointer;white-space:nowrap}
  .line .au:hover{color:var(--fg)}
  .lineedit{background:transparent;border:0;color:var(--fg3);cursor:pointer;font-size:10.5px;
    padding:0 4px}
  .lineedit:hover{color:var(--confirm2)}

  /* ---------- cast ---------- */
  .castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .castcard{background:var(--bg2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .casttop{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
  .casttop .ref{width:88px;height:132px;flex:0 0 auto;border-radius:5px;overflow:hidden;
    background:var(--media-bg);border:1px solid var(--line)}
  .casttop .ref img{width:100%;height:100%;object-fit:cover}
  .casttop .cb{flex:1;min-width:0}
  .casttop .cn{font-size:14px;font-weight:700}
  .casttop .cr{color:var(--fg2);font-size:11.5px;margin:2px 0 6px}
  .reflist{display:flex;gap:4px;flex-wrap:wrap}
  .reflist img{width:38px;height:56px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
  .castbody{padding:10px}
  .castbody textarea{min-height:64px;font-size:11.5px}
  .lockrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;
    font-size:11.5px;color:var(--fg2)}
  .lockrow input[type=checkbox]{accent-color:var(--confirm)}
  .locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .loc{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11.5px}
  .loc .li{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .loc .li img{width:44px;height:60px;object-fit:cover;border-radius:3px}

  /* ---------- assets ---------- */
  .assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .asset{background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .asset .am{height:180px;background:var(--media-bg);display:flex;align-items:center;justify-content:center}
  .asset .am img,.asset .am video{width:100%;height:100%;object-fit:cover}
  .asset .am .at{color:var(--fg3);font-size:11px;text-align:center;padding:6px}
  .asset .ab{padding:6px 8px}
  .asset .an{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asset .ameta{font-size:10px;color:var(--fg3);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
  .res{display:flex;gap:10px;padding:9px;border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:7px;background:var(--bg2);align-items:flex-start}

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const num = (v,d)=>{const x=parseFloat(v);return Number.isFinite(x)?x:d;};
const attr = s => esc(s).replace(/'/g,"&#39;");

const STAGES=["ingest","analyze","character","segment","script","storyboard","promptgen","visual","voice","subtitle","music","compose"];
const STAGE_ZH={ingest:"导入",analyze:"分析",character:"定妆",segment:"分集",script:"剧本",storyboard:"分镜",promptgen:"提示词",visual:"画面",voice:"配音",subtitle:"字幕",music:"配乐",compose:"合成"};
const STAGE_HINT={ingest:"清洗 · 分章",analyze:"角色 · 世界观",character:"锚点 · 三视图",segment:"按钩子切集",script:"台词 · 旁白",storyboard:"场次 · 镜头",promptgen:"中英提示词",visual:"ComfyUI 出图/视频",voice:"逐句 TTS",subtitle:"跟着配音走",music:"情绪匹配 BGM",compose:"ffmpeg 成片"};

const S = {
  state:null, templates:null, projects:[], current:"", tags:{}, tagSel:new Set(),
  detail:null, health:null, activePage:"guide", activeTag:"",
  settings:null, modelEntries:[], modelDefault:"", modelRoles:[],
  boardEp:0, boardFilter:"all", assetKind:"", assetRows:[],
  drawer:{kind:"",ep:null,sc:null,shot:null,line:null},
  production:null, booted:false, guideBusy:null, guideProbing:false,
  comfyInspect:null, comfyInspecting:false, comfyApplying:false, comfyUrl:"", comfyPick:null,
};

// ---------- api ----------
async function api(path, opts={}){
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type")||"";
  if(ct.includes("json")) return r.json();
  return {ok:r.ok, text:await r.text()};
}
const getJSON = p => api(p);
const postJSON = (p,b) => api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});

function toast(msg, kind="", ms=3200){
  const t=$("#toast"); t.className="toast show "+kind; t.innerHTML=msg;
  clearTimeout(t._x); t._x=setTimeout(()=>t.className="toast "+kind, ms);
}
async function pollJob(jid, onDone){
  const tick = async ()=>{
    const r = await getJSON("/api/jobs?id="+encodeURIComponent(jid));
    const j = r.job;
    if(!j){ toast("任务丢失","err"); return; }
    if(j.status==="running"){ setTimeout(tick, 900); return; }
    if(j.status==="error"){ toast("任务失败："+esc(j.error),"err",6000); onDone&&onDone(null,j); return; }
    onDone&&onDone(j.result,j);
  };
  tick();
}

// ---------- boot / nav ----------
async function boot(){
  const st = await getJSON("/api/state");
  if(!st.ok){ toast("无法连接后端","err"); return; }
  S.state=st; S.projects=st.projects||[];
  if(!S.current || !S.projects.some(p=>p.slug===S.current)) S.current=st.current_project||(S.projects[0]&&S.projects[0].slug)||"";
  if(!S.templates) S.templates=await getJSON("/api/templates");
  renderHeader(); renderCmdProj(); renderProjects(); renderTags();
  if(S.current) await selectProject(S.current, true); else { S.detail=null; renderAllPages(); }
  renderAllPages();
  if(!S.booted){ S.activePage = S.projects.length ? "workbench" : "guide"; S.booted=true; }
  switchPage(S.activePage, true);
  startProgressPoll();
}

function renderHeader(){
  const c=(S.state&&S.state.config_summary)||{};
  const same=c.default_model===c.tag_model;
  const chips=[
    ["模型",c.default_model],
    ...(same||!c.tag_model?[]:[["打标",c.tag_model]]),
    ["ComfyUI",(c.comfyui_enabled?"":"关 ")+(c.comfyui||"").replace(/^https?:\/\//,"")],
    ["TTS",c.tts],["配乐",c.music],
  ];
  $("#hchips").innerHTML=chips.filter(x=>x[1]).map(([k,v])=>`<span class="hchip">${k} <b>${esc(v)}</b></span>`).join("");
  const d=S.detail;

function renderProjects(){
  const box=$("#projlist");
  if(!S.projects.length){ box.innerHTML='<div class="muted" style="font-size:11.5px">暂无项目</div>'; return; }
  box.innerHTML=S.projects.map(p=>{
    const isCur=p.slug===S.current&&S.detail;
    let pct=0;
    if(isCur){
      const d=stageSummary(p.slug);
      pct=d.total?Math.round(d.done/d.total*100):0;
    }
    return `<div class="proj ${p.slug===S.current?"on":""}" data-slug="${esc(p.slug)}">
      <div class="pn">${esc(p.title)}</div>
      <div class="pm">${esc(p.genre||"")} · ${p.episodes}集 · ${p.shots}镜${isCur?" · "+pct+"%":""}</div>
    </div>`;
  }).join("");
  $$("#projlist .proj").forEach(x=>x.onclick=()=>selectProject(x.dataset.slug));
}
function stageSummary(slug){
  // lightweight from project list (server detail has the truth; this is a hint)
  const p=S.projects.find(x=>x.slug===slug);
  const total=STAGES.length*(p&&p.episodes?p.episodes:1);
  let done=0;
  if(S.detail&&S.detail.slug===slug){
    (S.detail.episodes||[]).forEach(ep=>STAGES.forEach(s=>{ if((ep.stage_status||{})[s]==="done") done++; }));
  }
  return {total,done};
}

async function renderTags(){
  const r=await getJSON("/api/tags?project="+encodeURIComponent(S.current||""));
  S.tags=r.tags||{};
  const keys=Object.keys(S.tags).slice(0,44);
  $("#tagCount").textContent=keys.length?Object.keys(S.tags).length+" 个":"";
  const box=$("#tagfilter");
  if(!keys.length){ box.innerHTML='<span class="muted" style="font-size:11px">运行或索引后出现</span>'; return; }
  box.innerHTML=keys.map(t=>`<span class="tg ${S.tagSel.has(t)?"on":""}" data-tag="${esc(t)}">${esc(t)} <b style="opacity:.65">${S.tags[t]}</b></span>`).join("");
  $$("#tagfilter .tg").forEach(c=>c.onclick=()=>{
    const t=c.dataset.tag; S.tagSel.has(t)?S.tagSel.delete(t):S.tagSel.add(t);
    renderTags(); jumpSearch([...S.tagSel].join(" "));
  });
}

async function selectProject(slug, quiet){
  S.current=slug;
  renderProjects(); renderCmdProj();
  const d=await getJSON("/api/projects/"+encodeURIComponent(slug));
  if(!d.ok){ toast("加载项目失败："+esc(d.error||""),"err"); return; }
  S.detail=d;
  const pr=await getJSON("/api/progress?project="+encodeURIComponent(slug));
  S.progress=(pr&&pr.ok)?(pr.progress||{}):{};
  if(!S.boardEp || !(d.episodes||[]).some(e=>e.index===S.boardEp)) S.boardEp=(d.episodes[0]||{}).index||0;
  renderHeader(); renderProjects(); renderTags();
  renderAllPages();
  if(!quiet) toast("已打开《"+esc(d.meta.title||d.meta.name)+"》","",1600);
}

let guideTimer=null;
function gEnvState(){
  const h=S.health, p=(h&&h.probe)||{}, b=(h&&h.brain)||{};
  const comfy=!!(p.comfyui&&p.comfyui.reachable);
  const llm=!!(b.main&&b.main.ok)||!!((p.llm_endpoints||[]).length);
  const tts=!!(p.tts&&p.tts.voice_count);
  const ff=!!p.ffmpeg;
  return {checked:!!h,ff,llm,comfy,tts,done:[ff,llm,comfy,tts].filter(Boolean).length};
}
function gStagesState(stages){
  const eps=(S.detail&&S.detail.episodes)||[];
  if(!eps.length) return {state:"pending",done:0,total:stages.length};
  const done=stages.filter(s=>stageState(s)==="done").length;
  return {state:done===stages.length?"done":done?"partial":"pending",done,total:stages.length};
}
function gArchNode(s){
  const st=stageState(s), cls=st==="done"?"done":st==="partial"?"partial":"";
  return `<div class="anode ${cls}" data-gstage="${s}" title="点击去流水线重跑「${STAGE_ZH[s]}」">
    <span class="adot"></span><span class="ai">${String(STAGES.indexOf(s)+1).padStart(2,"0")}</span>
    <b>${STAGE_ZH[s]}</b><small>${STAGE_HINT[s]||""}</small></div>`;
}
function gLane(label,stages,out){
  return `<div class="arch-lane"><div class="arch-lbl">${label}</div>
    ${stages.map(gArchNode).join('<span class="aarrow">→</span>')}${out?`<span class="aarrow">→</span>${out}`:""}</div>`;
}
const gbtn=(label,act,cls="ghost",extra="")=>`<button class="btn sm ${cls}" data-gact="${act}" ${extra}>${label}</button>`;
function gStepHTML(o){
  const st=o.st||{state:"pending",done:0,total:1};
  const cur=o.cur&&st.state!=="done";
  const cls=st.state==="done"?"done":cur?"cur":"";
  const pct=st.total?Math.round(st.done/st.total*100):0;
  const bst=st.state==="done"?"done":st.state==="partial"?"running":"pending";
  return `<div class="gstep ${cls}">
    <div class="gnum">${st.state==="done"?"✓":o.n}</div>
    <div>
      <div class="gt">${esc(o.title)} ${badge(bst)}
        <span class="muted" style="font-weight:400;font-size:10.5px">${st.state==="done"?"本段完成":(st.done?`${st.done}/${st.total} 阶段完成`:`${st.total} 个阶段`)}</span></div>

}

function ciChips(map){
  const keys=Object.keys(map||{}).filter(k=>map[k]);

  return keys.map(k=>`<span>${esc(CI_LABEL[k]||k)} #${esc(map[k])}</span>`).join("");

function ciPickInit(r){

  const rec=r.recommend||{};
  S.comfyPick={
    t2i: okFile(cs.t2i_workflow,"t2i")||(rec.t2i&&rec.t2i.file)||"",
    i2v: okFile(cs.i2v_workflow,"i2v")||(rec.i2v&&rec.i2v.file)||"",

function ciPaint(selId,mapId){
  const el=$("#"+selId), box=$("#"+mapId);
  if(!el||!box) return;
  const w=((S.comfyInspect&&S.comfyInspect.workflows)||[]).find(x=>x.file===el.value);
  box.innerHTML=el.value?(w?ciChips(w.map):""):"";
}
function comfyBind(){
  const pairs=[["t2i","ciT2I","ciMapT2I"],["i2v","ciI2V","ciMapI2V"],["flf","ciFlf","ciMapFlf"]];
  pairs.forEach(([k,s,m])=>{
    const el=$("#"+s); if(!el) return;
    el.onchange=()=>{ if(S.comfyPick) S.comfyPick[k]=el.value; ciPaint(s,m); };
    ciPaint(s,m);
  });
}
async function inspectComfy(){
  if(S.comfyInspecting) return;
  const u=$("#ciUrl");
  const url=(u&&u.value.trim())||"";
  S.comfyUrl=url; S.comfyInspecting=true; S.comfyInspect=null;
  if(S.activePage==="guide") renderGuide();
  const r=await postJSON("/api/comfyui/inspect",{base_url:url});
  S.comfyInspecting=false;
  if(!r.ok){ toast("识别失败："+esc(r.error||""),"err",6000); if(S.activePage==="guide") renderGuide(); return; }
  S.comfyInspect=r;
  if(r.reachable){
    ciPickInit(r);
    const n=(r.workflows||[]).filter(w=>w.ok).length;
    toast(`识别完成：发现 ${(r.workflows||[]).length} 个工作流，${n} 个可用`,"ok",3600);
  } else toast("连不上 ComfyUI，检查地址/端口/代理","err",5000);
  if(S.activePage==="guide") renderGuide();
}
async function applyComfy(){
  if(S.comfyApplying) return;
  const r=S.comfyInspect;
  if(!r||!r.reachable) return toast("先点「自动识别」连上 ComfyUI","err");
  const val=id=>{const e=$(id); return e?e.value:"";};
  const pick=id=>{const e=$(id); return e?e.checked:true;};
  const t2i=val("#ciT2I"), i2v=val("#ciI2V"), flf=val("#ciFlf");
  if(!t2i) return toast("至少要选一条出图工作流","err");
  const mapOf=f=>{const w=((S.comfyInspect&&S.comfyInspect.workflows)||[]).find(x=>x.file===f); return (w&&w.map)||{};};
  const body={
    base_url:val("#ciUrl"), enabled:true, auto_map:true, auto_workflows:true,
    t2i_workflow:t2i, i2v_workflow:i2v, flf_workflow:flf, first_last_frame:!!flf,
    mode: i2v?"image_then_video":"image",
    t2i_nodes:mapOf(t2i), i2v_nodes:mapOf(flf||i2v),
    checkpoint:val("#ciCkpt"), consistency:val("#ciCons"),
    generate_location_refs:pick("#ciLoc"), auto_cast:pick("#ciCast"),
  };
  S.comfyApplying=true; if(S.activePage==="guide") renderGuide();
  const res=await postJSON("/api/comfyui/apply",body);
  S.comfyApplying=false;
  if(!res.ok){ toast("应用失败："+esc(res.error||""),"err",6000); if(S.activePage==="guide") renderGuide(); return; }
  toast("已写入配置并启用，开始自检…","ok",3000);
  await boot();
  if(S.activePage==="guide") renderGuide();
  probeGuide();
}
async function startStages(stages,label){
  if(!S.current) return toast("先新建或选择一个项目","err");
  if(S.guideBusy) return toast("已有任务在运行，等它结束再提交","err");
  if(!stages||!stages.length) return toast("没有选择阶段","err");
  runSel=new Set(stages);
  const names=stages.map(s=>STAGE_ZH[s]||s).join(" → ");
  S.guideBusy={stages,label:label||names};
  renderGuide();
  const r=await postJSON("/api/run",{project:S.current,episodes:[],stages,overrides:{}});
  if(!r.ok){ S.guideBusy=null; renderGuide(); return toast("提交失败："+esc(r.error||""),"err"); }
  toast("已提交："+esc(names),"",2400);
  if(guideTimer) clearInterval(guideTimer);
  guideTimer=setInterval(async()=>{
    if(!S.current) return;
    const d=await getJSON("/api/projects/"+encodeURIComponent(S.current));
    if(d.ok){ S.detail=d; renderHeader(); if(S.activePage==="guide") renderGuide(); }
  },2500);
  pollJob(r.job,async res=>{
    if(guideTimer){ clearInterval(guideTimer); guideTimer=null; }
    S.guideBusy=null;
    const failed=(stages||[]).filter(s=>res&&res[s]&&res[s].error);
    if(!res) toast("任务失败，请到流水线查看输出","err",6000);
    else if(failed.length) toast("部分阶段失败："+failed.map(s=>STAGE_ZH[s]||s).join("、"),"err",6000);
    else toast((label||"阶段")+" 完成","ok");
    await selectProject(S.current,true);
    if(S.activePage==="guide") renderGuide();
  });
}

  btn.disabled=true; btn.textContent="创建中…";
  const r=await postJSON("/api/new",{name,source});
  if(!r.ok){ btn.disabled=false; btn.textContent=old; return toast("创建失败："+esc(r.error||""),"err"); }
  S.current=r.slug;
  await boot();
  S.activePage="guide"; switchPage("guide",true);
  const d=S.detail;
  if(source&&!(d&&d.meta&&d.meta.source_file)){
    toast("项目已建，但源文件不可读；请检查路径后重试导入","err",6000);
    return;
  }
  if(source){ toast("项目已创建，开始导入…","ok"); startStages(["ingest"],"导入"); }
  else toast("项目已创建；补上小说路径后可跑「导入」","",3200);
}

// ---------- workbench ----------
function stageState(stage){
  const eps=(S.detail&&S.detail.episodes)||[];
  if(!eps.length) return "pending";
  let done=0, run=0;
  eps.forEach(ep=>{const v=(ep.stage_status||{})[stage]; if(v==="done")done++; else if(v==="running")run++;});
  if(done===eps.length) return "done";
  if(done||run) return "partial";
  return "pending";
}
function epProgress(ep){
  const vals=STAGES.map(s=>(ep.stage_status||{})[s]);
  return Math.round(vals.filter(v=>v==="done").length/STAGES.length*100);
}
function runningStageName(){
  const eps=(S.detail&&S.detail.episodes)||[];
  let runningStage="";
  for(const ep of eps){ for(const s of STAGES){ if((ep.stage_status||{})[s]==="running") runningStage=s; } }
  return runningStage;
}
function runningProgressHtml(){
  const s=runningStageName();
  if(!s) return "";
  const p=(S.progress||{})[s];
  const zh=STAGE_ZH[s]||s;
  let txt=`<span style="color:var(--go2)">● ${esc(zh)} 进行中</span>`;
  if(p&&p.total) txt+=` <span class="muted">已完成 ${p.done}/${p.total} 镜</span>`;
  return `<div style="margin-top:8px;font-size:12px">${txt}</div>`;
}
let progressPollTimer=null;
function startProgressPoll(){
  if(progressPollTimer) clearInterval(progressPollTimer);
  progressPollTimer=setInterval(async ()=>{
    if(!S.current) return;
    // 只在有阶段 running 且停留在进度相关页时刷新，避免打扰其它操作
    if(!runningStageName()) return;
    if(!["workbench","pipeline","board"].includes(S.activePage)) return;
    try{
      const d=await getJSON("/api/projects/"+encodeURIComponent(S.current));
      if(!d.ok) return;
      S.detail=d;
      const pr=await getJSON("/api/progress?project="+encodeURIComponent(S.current));
      if(pr&&pr.ok) S.progress=pr.progress||{};
      if(S.activePage==="workbench") renderWorkbench();
      else if(S.activePage==="pipeline") renderRun();
      else if(S.activePage==="board") renderBoard();
    }catch(e){/* 忽略瞬时错误 */}
  }, 8000);
}

    <span class="dot ${stageState(s)==="done"?"ok":stageState(s)==="partial"?"warn":"na"}"></span>

  const epHtml=eps.map(ep=>`<div class="epcard" data-ep="${ep.index}">

        <div class="statrow">
          <div class="stat"><b>${eps.length}</b><span>集数</span></div>

          <div class="stat"><b>${shots}</b><span>分镜</span></div>
          <div class="stat"><b>${(d.characters||[]).length}</b><span>角色</span></div>
          <div class="stat"><b>${doneStages}/12</b><span>阶段完成</span></div>
        </div>
        <div class="quick">
          <button class="btn go" data-act="run-all">▶ 跑完整流程</button>
          <button class="btn confirm" data-act="open-board">分镜台</button>
          <button class="btn ai" data-act="open-assets">AI 检索资产</button>
          <button class="btn ghost" onclick="reindex('${attr(d.slug)}',true)">AI 打标签</button>
        </div>

    <div class="card"><h3>制作阶段 <span class="muted" style="font-weight:400">完成 ${doneStages}/12</span></h3>
      <div class="stagebar">${stageHtml}</div>

  $$("#page-workbench .stg").forEach(x=>x.onclick=()=>{

function badge(st){
  const m={done:["done","完成"],running:["run","进行"],failed:["fail","失败"],pending:["","待办"],skipped:["","跳过"]};
  const x=m[st]||["",st||""];
  return `<span class="badge ${x[0]}">${esc(x[1])}</span>`;
}

function renderBoard(){

  const statuses=[["all","全部"],["done","已完成"],["pending","待生成"],["failed","失败"],["video","有视频"],["flf","首尾帧"]];

  const blocks=ep.scenes.map(sc=>{
    sc.shots.forEach(sh=>{sh._sc=sc.id;});

      </div>
      <div class="boardbar">
        <select class="f" id="boardEpSel">${eps.map(e=>`<option value="${e.index}" ${e.index===ep.index?"selected":""}>第${e.index}集 · ${esc(e.title||"")}</option>`).join("")}</select>
        <select class="f" id="boardFilterSel">${statuses.map(([v,l])=>`<option value="${v}" ${S.boardFilter===v?"selected":""}>${l}</option>`).join("")}</select>
        <button class="btn sm ghost" id="boardRefresh">⟳ 刷新</button>
      </div>
    </div>
    <div class="muted" style="font-size:11.5px;margin-bottom:10px">第 ${ep.index} 集 · ${ep.scenes.length} 场 · ${shotCount} 镜
      ${ep.video?`<a class="mini" href="${ep.video}" target="_blank" style="margin-left:6px">▶ 成片</a>`:""}</div>
    <div id="boardBlocks">${blocks||'<div class="empty">本集还没有分镜</div>'}</div>`;

  $("#boardRefresh").onclick=()=>selectProject(S.current,true).then(()=>renderBoard());

    const sc=ep.scenes.find(s=>s.id===c.dataset.sc);
    const sh=sc&&sc.shots.find(s=>s.id===c.dataset.shot);
    if(sh) openShotDrawer(ep,sc,sh);
  });
  $$("#page-board .lineedit").forEach(x=>x.onclick=()=>{
    const line=ep.scenes.flatMap(s=>s.lines).find(l=>l.id===x.dataset.line);

  });
}
function matchesFilter(sh){
  const f=S.boardFilter;
  if(f==="all") return true;
  if(f==="video") return !!sh.video;
  if(f==="flf") return !!sh.end_image;
  return sh.status===f;
}
function shotCard(sh){
  let media="";
  if(sh.video) media=`<video src="${sh.video}" muted loop preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()"></video>`;
  else if(sh.image) media=`<img src="${sh.image}" loading="lazy">`;
  else media='<div class="ph">无画面</div>';
  return `<div class="shotcard" data-sc="${attr(sh._sc||"")}" data-shot="${attr(sh.id)}" title="${attr(sh.action||"")}">
    <div class="media">${media}
      <span class="sidx">#${sh.index||""}</span>
      ${sh.end_image?'<span class="sfl">首尾帧</span>':""}
      <span class="sst">${badge(sh.status)}</span>
    </div>
    <div class="cap"><b>${esc(sh.shot_type)}</b> · ${esc(sh.camera||"")}<br>${esc((sh.action||"").slice(0,30))}</div>
  </div>`;
}

async function saveShot(){
  const d=S.drawer;
  if(d.kind!=="shot") return;
  const flfEl=$("#edFlf");
  const fields={
    shot_type:$("#edType").value, camera:$("#edCam").value,
    duration:num($("#edDur").value,3), seed:Math.round(num($("#edSeed").value,-1)),
    action:$("#edAction").value, prompt:$("#edPrompt").value,
    negative_prompt:$("#edNeg").value, end_prompt:$("#edEndPrompt").value,
    characters:$("#edChars").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    flf:flfEl.dataset.mixed?"__keep__":(flfEl.checked?true:false),
  };
  if(fields.flf==="__keep__") delete fields.flf;
  const r=await postJSON("/api/shot/update",{project:S.current,episode:d.ep.index,shot_id:d.shot.id,fields});
  if(!r.ok){ toast("保存失败："+esc(r.error||""),"err"); return; }
  toast("镜头已保存","ok"); closeDrawer();
  await selectProject(S.current,true); renderBoard();
}
async function regenShot(mode){
  const d=S.drawer;
  if(d.kind!=="shot") return;
  toast(`已提交${mode==="image"?"画面":mode==="video"?"视频":"画面+视频"}返工…`);
  const r=await postJSON("/api/shot/regen",{project:S.current,episode:d.ep.index,shot_id:d.shot.id,mode});
  if(!r.ok){ toast("提交失败："+esc(r.error||""),"err"); return; }
  pollJob(r.job,res=>{
    if(res&&res.ok){ toast("返工完成","ok"); closeDrawer(); selectProject(S.current,true).then(()=>renderBoard()); }
    else toast("返工失败："+esc((res&&res.error)||"未知错误"),"err",6000);
  });
}

  $$("#page-cast .castcard").forEach(card=>{

    const locked=$("[data-f=locked]",card);
    card.querySelector('[data-act="save"]').onclick=async()=>{
      const body={project:S.current,name,fields:{...fields,locked:locked.checked},

async function loadAssets(){

function jumpSearch(q){
  switchPage("assets");
  setTimeout(()=>{ const inp=$("#searchq"); if(inp){inp.value=q||""; doSearch(q||"");} },30);
}
async function doSearch(q){
  q=(q||"").trim();
  const meta=$("#searchmeta"), res=$("#searchres"), sec=$("#assetSection");
  if(!meta) return;
  if(!q){ meta.innerHTML=""; res.innerHTML=""; if(sec)sec.style.display=""; return; }
  if(sec) sec.style.display="none";
  res.innerHTML='<div class="empty"><span class="spin"></span> 检索中…</div>';
  const url="/api/search?q="+encodeURIComponent(q)+"&project="+encodeURIComponent(S.current||"");
  const r=await getJSON(url);
  if(!r.ok){ res.innerHTML=`<div class="empty">失败：${esc(r.error||"")}</div>`; return; }
  const f=r.filters||{};
  meta.innerHTML=`AI 解析 → 关键词[${(f.keywords||[]).map(esc).join(", ")||"—"}]
    标签[${(f.tags||[]).map(esc).join(", ")||"—"}] 类型[${(f.kinds||[]).map(esc).join(", ")||"—"}]
    · 命中 <b>${r.count}</b> 条 <button class="btn xs ghost" id="searchClear">清除</button>`;
  const box=$("#searchres"); box.innerHTML="";
  if(!r.count){ box.appendChild(el("div","empty","没有匹配的资产")); }
  (r.results||[]).forEach(a=>box.appendChild(resultCard(a)));
  const c=$("#searchClear"); if(c)c.onclick=()=>{ $("#searchq").value=""; doSearch(""); };
}
function resultCard(a){
  const d=el("div","res");
  let thumb="";
  const murl=a.media_url||"";
  if((a.kind==="image"||a.kind==="cover")&&murl) thumb=`<img src="${murl}" loading="lazy">`;
  else if(a.kind==="video"&&murl) thumb=`<video src="${murl}" muted preload="metadata"></video>`;
  else thumb=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--fg3);font-size:10px">${esc(a.kind)}</div>`;
  d.innerHTML=`<div class="thumb">${thumb}</div>
    <div class="rb">
      <div class="rt">${esc(a.title||a.kind)} <span class="mini">${esc(a.kind)}</span>
        ${a.ep_index?`<span class="mini">第${a.ep_index}集</span>`:""} ${badge(a.status)}</div>
      <div class="rx">${esc(a.summary||a.text||"")}</div>
      <div class="rtags">${(a.tags||[]).slice(0,10).map(t=>`<span class="mini">${esc(t)}</span>`).join("")}
        ${a.category?`<span class="mini" style="color:var(--confirm2)">${esc(a.category)}</span>`:""}</div>
      ${murl?`<div style="margin-top:5px"><a href="${murl}" target="_blank" class="mini">打开文件 ↗</a></div>`:""}
    </div>`;
  return d;
}

async function loadNodes(){
  const box=$("#nodeBox");
  if(!box) return;
  const r=await getJSON("/api/nodes");
  if(!r.ok){ box.innerHTML=`<div class="empty">加载失败：${esc(r.error||"")}</div>`; return; }
  const rows=(r.nodes||[]).map(n=>{
    const miss=n.missing||[];
    return `<div class="noderow">
      <span class="dot ${n.online?"ok":"bad"}"></span>
      <b>${esc(n.name)}</b>
      <span class="muted" style="font-size:11px">${esc(n.base_url)}</span>
      ${n.online?`<span class="muted" style="font-size:11px">v${esc(n.version)} · ${esc(n.device||"")} · 显存 ${(n.vram_free/1024**3).toFixed(1)}G 空闲</span>`:`<span class="mini" style="color:var(--danger2)">离线</span>`}
      ${miss.length?`<span class="mini" style="color:var(--warn,#d99)">缺 ${miss.length} 个模型</span>
        <span class="muted" style="font-size:10.5px">${miss.slice(0,4).map(esc).join("、")}${miss.length>4?" …":""}</span>`:`<span class="mini" style="color:var(--go2)">模型齐全</span>`}
      <span style="flex:1"></span>
      ${n.online&&miss.length?`<button class="btn xs confirm" data-sync="${attr(n.name)}">同步模型</button>`:""}
    </div>`;
  }).join("");
  box.innerHTML=(rows||'<div class="empty">没有节点</div>')
    +`<div class="muted" style="font-size:10.5px;margin-top:6px">清单来自工作流：${(r.models||[]).length} 个模型文件</div>`
    +`<div id="nodeProg"></div>`;
  $$("#nodeBox [data-sync]").forEach(b=>b.onclick=()=>syncNodes(b.dataset.sync,b));
}
function syncNodes(name,btn){
  btn.disabled=true; btn.textContent="同步中…";
  const out=$("#nodeProg");
  out.innerHTML='<div class="muted" style="font-size:11px;margin-top:6px">正在准备…</div>';
  postJSON("/api/nodes/sync",{node:name}).then(r=>{
    if(!r.ok){ out.innerHTML=`<div class="mini" style="color:var(--danger2)">${esc(r.error||"失败")}</div>`; btn.disabled=false; btn.textContent="同步模型"; return; }
    const t=setInterval(async ()=>{
      const j=await getJSON("/api/jobs?id="+encodeURIComponent(r.job));
      if(!j.ok||!j.job){ clearInterval(t); return; }
      const job=j.job, p=job.progress||{};
      if(p.file||p.phase){
        const pct=p.percent||0, barLen=20, filled=Math.round(barLen*pct/100);
        out.innerHTML=`<div style="margin-top:8px;font-size:11px">
          <div style="letter-spacing:1px">${"█".repeat(filled)}${"░".repeat(barLen-filled)} ${pct.toFixed(1)}%</div>
          <div class="muted" style="font-size:10.5px">${esc(p.file||"")} · ${((p.bytes_done||0)/1024**3).toFixed(2)}/${((p.bytes_total||0)/1024**3).toFixed(2)} GB · ${(p.speed_mb||0).toFixed(1)} MB/s · ETA ${p.eta||0}s</div>
        </div>`;
      }
      if(job.status!=="running"){
        clearInterval(t);
        out.innerHTML = job.status==="done"
          ? `<div class="mini" style="color:var(--go2);margin-top:6px">✓ 同步完成</div>`
          : `<div class="mini" style="color:var(--danger2);margin-top:6px">✗ ${esc(job.error||"失败")}</div>`;
        btn.disabled=false; btn.textContent="同步模型";
        loadNodes();
      }
    },1000);
  });
}
function stageStateFor(ep,stage){ const v=(ep.stage_status||{})[stage]; return v==="done"?"done":v||"pending"; }
function parseEps(str){
  const out=[]; (str||"").split(",").forEach(part=>{
    part=part.trim(); if(!part)return;
    if(part.includes("-")){const[a,b]=part.split("-").map(x=>parseInt(x)); for(let i=a;i<=b;i++)out.push(i);}
    else out.push(parseInt(part));
  });
  return [...new Set(out.filter(n=>!isNaN(n)))];
}
function doRun(){
  const body={project:$("#runProj").value,episodes:parseEps($("#runEps").value),
    stages:[...runSel],overrides:{}};
  if(!body.project){ toast("请先选择项目","err"); return; }
  if(!body.stages.length){ toast("至少选一个阶段","err"); return; }
  $("#runStat").innerHTML='<span class="spin"></span> 运行中…（可切到别处，稍后刷新）';
  $("#runGo").disabled=true;
  postJSON("/api/run",body).then(r=>{
    if(!r.ok){ $("#runStat").textContent="失败："+(r.error||""); $("#runGo").disabled=false; return; }
    pollJob(r.job,res=>{
      $("#runGo").disabled=false;
      $("#runStat").innerHTML='<span style="color:var(--go2)">✓ 运行完成</span>';
      $("#runOut").innerHTML=`<div class="card"><h3>结果</h3><pre style="font-family:var(--mono);font-size:11px;overflow:auto;margin:0">${esc(JSON.stringify(res,null,1))}</pre></div>`;
      toast("流水线完成","ok"); selectProject(body.project,true).then(()=>renderWorkbench());
    });
  });
}

function bindModelEvents(){
  $$("#modelList .mcard").forEach((card,i)=>{
    const m=S.modelEntries[i]; if(!m) return;
    $$(".chip[data-role]",card).forEach(c=>c.onclick=()=>c.classList.toggle("on"));
    $('input[name="mdef"]',card).onchange=()=>{ S.modelDefault=m.id; renderModelList(); };
    $$("[data-act]",card).forEach(b=>b.onclick=()=>{
      const act=b.dataset.act;
      if(act==="key"){
        const inp=$('[data-f="api_key"]',card);
        const show=inp.type==="password"; inp.type=show?"text":"password";
        b.textContent=show?"隐藏":"显示";
      } else if(act==="test"){
        testModel(i);
      } else if(act==="del"){
        harvestModels(); S.modelEntries.splice(i,1);
        if(!S.modelEntries.some(x=>x.id===S.modelDefault)) S.modelDefault=S.modelEntries[0]?S.modelEntries[0].id:"";
        renderModelList();
      } else if(act==="up" && i>0){
        harvestModels(); [S.modelEntries[i-1],S.modelEntries[i]]=[S.modelEntries[i],S.modelEntries[i-1]]; renderModelList();
      } else if(act==="down" && i<S.modelEntries.length-1){
        harvestModels(); [S.modelEntries[i+1],S.modelEntries[i]]=[S.modelEntries[i],S.modelEntries[i+1]]; renderModelList();
      }
    });
  });
}
function harvestModels(){
  $$("#modelList .mcard").forEach((card,i)=>{
    const m=S.modelEntries[i]; if(!m) return;
    $$("[data-f]",card).forEach(inp=>{
      const f=inp.dataset.f;
      if(f==="api_key"){ const v=inp.value.trim(); if(v) m.api_key=v; }
      else if(f==="clear_key"){ if(inp.checked){ m.clear_api_key=true; delete m.api_key; } else delete m.clear_api_key; }
      else if(f==="use_proxy"){ m.use_proxy=inp.checked; }
      else if(f==="temperature"||f==="max_tokens"||f==="timeout"){ m[f]=num(inp.value,m[f]); }
      else m[f]=inp.value;
    });
    m.roles=$$(".chip.on[data-role]",card).map(c=>c.dataset.role);
  });
  const sel=$('input[name="mdef"]:checked'); if(sel) S.modelDefault=sel.value;
}
function addModel(provId, provs){
  harvestModels();
  const p=(provs||[]).find(x=>x.id===provId)||{};
  const id="m"+Date.now().toString(36);
  const first=S.modelEntries.length===0;
  S.modelEntries.push({id,label:(p.label||"新模型").replace(/（.*?）/g,"").trim()||"新模型",
    base_url:p.base_url||"",model:p.model||"",api_key:p.api_key||"",
    temperature:0.7,max_tokens:4096,timeout:300,use_proxy:false,
    roles:first?(S.modelRoles||[]).map(r=>r.id):[]});
  if(first||!S.modelDefault) S.modelDefault=id;
  renderModelList();
}
function addAllInOne(){
  harvestModels();
  const roles=(S.modelRoles||[]).map(r=>r.id);
  if(!roles.length){ toast("没有可用任务列表","warn"); return; }
  // 便捷：沿用当前默认/第一张卡的连接信息（通常就是主力模型），用户只需核对地址和模型名
  const cur=S.modelEntries.find(x=>x.id===S.modelDefault)||S.modelEntries[0]||{};
  const id="m"+Date.now().toString(36);
  // 置顶（列表顺序＝优先级），勾满全部任务并设为默认兜底 → 它一个人包干所有活
  S.modelEntries.unshift({id,label:cur.label?`${cur.label.replace(/（.*?）/g,"").trim()}·全包`:"全能模型（全包）",
    base_url:cur.base_url||"http://localhost:11434/v1",
    model:cur.model||"",api_key:"",
    temperature:num(cur.temperature,0.7),max_tokens:Math.round(num(cur.max_tokens,4096)),
    timeout:num(cur.timeout,300),use_proxy:!!cur.use_proxy,
    roles:roles});
  S.modelDefault=id;
  renderModelList();
  toast("已置顶一个勾满全部任务的模型。核对地址/模型名后点「保存模型清单」即可；下方卡片原样保留，想恢复分工把它的任务取消勾选或删除即可","ok");
}
async function testModel(i){
  harvestModels();
  const m=S.modelEntries[i]; if(!m) return;
  const card=$(`#modelList .mcard[data-i="${i}"]`);
  const out=$('[data-out="test"]',card), chipsBox=$('[data-out="models"]',card);
  out.innerHTML='<span class="spin"></span> 正在连接…（最多约 10 秒）';
  const r=await postJSON("/api/config/test_llm",{entry_id:m.id,base_url:m.base_url,
    api_key:m.api_key||"",model:m.model,use_proxy:!!m.use_proxy});
  const models=r.models||[];
  if(models.length){
    const dl=$(`datalist#ml${i}`); if(dl) dl.innerHTML=models.map(x=>`<option value="${esc(x)}">`).join("");
    chipsBox.innerHTML='<span class="muted" style="font-size:10.5px">端点模型（点击选用）：</span>'+
      models.slice(0,30).map(x=>`<span class="chip" data-pick="${esc(x)}">${esc(x)}</span>`).join("");
    $$(".chip",chipsBox).forEach(c=>c.onclick=()=>{ $('[data-f="model"]',card).value=c.dataset.pick; });
  } else chipsBox.innerHTML="";
  out.innerHTML = r.ok
    ? `<span style="color:var(--go2)">✓ ${esc(r.message||"连接成功")}</span>${r.used_saved_key?'<span class="muted">（用了已保存的 Key）</span>':""}`
    : `<span style="color:var(--danger2)">✗ ${esc(r.error||"连接失败")}</span>`;
}

    id:m.id,label:(m.label||"").trim(),base_url:(m.base_url||"").trim(),

    stat.innerHTML=res.used_llm?'<span style="color:var(--go2)">✓ 已由 AI 生成并写入</span>':'<span style="color:var(--warn)">✓ 已写入（未连到大模型，用模板规则生成）</span>';
    $("#setupWizOut").innerHTML=`<div class="card" style="margin-top:9px"><h3>写入 ${esc(res.written||"config/default.yaml")}</h3>
      <pre style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-family:var(--mono);font-size:10.5px;margin:0">${esc(JSON.stringify(res.overrides||{},null,1))}</pre></div>`;
    toast("配置已更新","ok"); boot(); loadProduction();
  });
}

// ---------- AI command bar ----------
$("#cmdGo").onclick=runCmd;
$("#cmd").addEventListener("keydown",e=>{if(e.key==="Enter")runCmd();});
async function runCmd(){
  const instr=$("#cmd").value.trim(); if(!instr) return;
  $("#cmdGo").disabled=true; $("#cmdGo").textContent="解析中";
  const r=await postJSON("/api/ai/parse",{instruction:instr,project:$("#cmdproj").value});
  $("#cmdGo").disabled=false; $("#cmdGo").textContent="解析";
  if(!r.ok){ toast("解析失败："+esc(r.error||""),"err"); return; }
  showPreview(r.action,instr);
}
function showPreview(a,instr){
  const p=$("#preview");
  const params=Object.entries(a.params||{}).filter(([k,v])=>v!==""&&!(Array.isArray(v)&&!v.length)&&!(v&&typeof v==="object"&&!Object.keys(v).length));
  const pstr=params.map(([k,v])=>`<span class="kv">${esc(k)}=${esc(typeof v==="object"?JSON.stringify(v):v)}</span>`).join(" ");
  p.style.cssText="display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border-bottom:1px solid var(--ai-soft-line);padding:9px 14px";
  p.innerHTML=`<div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:12.5px">${esc(a.title)} ${a.note?`<span class="muted" style="font-weight:400">· ${esc(a.note)}</span>`:""}</div>
      <div class="muted" style="font-size:11.5px;margin:2px 0 5px">${esc(a.confirm_msg||"")} · 原话：“${esc(instr)}”</div>
      <div>${pstr||'<span class="muted">（无参数）</span>'}</div></div>
    <button class="btn ${a.needs_confirm?"confirm":"go"} sm" id="pvOk">${a.needs_confirm?"确认执行":"执行"}</button>
    <button class="btn ghost sm" id="pvNo">取消</button>`;
  $("#pvNo").onclick=()=>p.style.display="none";
  $("#pvOk").onclick=()=>execAction(a);
}
async function execAction(a){
  $("#preview").style.display="none"; $("#cmd").value="";
  const r=await postJSON("/api/ai/run",{action:a});
  if(!r.ok){ toast("执行失败："+esc(r.error||""),"err"); return; }
  if(r.job){
    toast("已提交，后台执行中…");
    pollJob(r.job,res=>{
      toast("✓ "+a.title+" 完成","ok");
      if(a.kind==="search"&&res){ switchPage("assets"); jumpSearch(""); renderSearchResults(res); }
      boot(); if(S.current) selectProject(S.current,true);
    });
  } else if(r.result){
    const res=r.result;
    if(a.kind==="search"){ switchPage("assets"); renderSearchResults(res); }
    else toast("✓ "+a.title+" 完成","ok");
    boot();
  }
}
function renderSearchResults(res){
  const box=$("#searchres"); if(!box) return;
  box.innerHTML=""; (res.results||[]).forEach(x=>box.appendChild(resultCard(x)));
  $("#searchmeta").innerHTML=`命中 <b>${res.count||0}</b> 条`;
  $("#assetSection")&&($("#assetSection").style.display="none");
}

// ---------- misc ----------
window.reindex=function(slug,withAI){
  toast(withAI?"AI 打标签中…":"重建索引中…");
  postJSON("/api/reindex",{project:slug,with_ai:withAI}).then(r=>{
    if(!r.ok) return toast("失败："+esc(r.error||""),"err");
    pollJob(r.job,res=>{ toast("索引完成："+(res&&res.total||0)+" 条","ok"); renderTags(); if(S.current===slug) selectProject(slug,true); });
  });
};
$("#newProj").onclick=()=>{
  switchPage("guide");
  setTimeout(()=>{ const n=$("#gName"); if(n){ n.scrollIntoView({behavior:"smooth",block:"center"}); n.focus(); } },60);
};
$("#refreshBtn").onclick=()=>boot();
$("#healthBtn").onclick=()=>{ switchPage("guide"); probeGuide(); };
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault(); $("#cmd").focus();
  }
  if(e.key==="Escape"){ closeDrawer(); $("#preview").style.display="none"; }
});

// ---------- init ----------
renderSetup();
boot();
</script>
</body>
