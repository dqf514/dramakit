<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DramaKit 制作台</title>
<script>
try{
  if(localStorage.getItem("dk-theme")==="dark") document.documentElement.dataset.theme="dark";
}catch(e){}
</script>
<style>
  /* One token layer, one palette. Everything the sheets paint with is
     here: light and dark values of the same names, so a component cannot
     pick a colour that only exists in one theme. Contrast for text is
     checked against the surface it actually sits on. */
  :root{
    color-scheme:light;
    --bg:#f6f7f9; --bg2:#ffffff; --bg3:#eef1f5; --bg4:#e2e7ed;
    --line:#dfe4ea; --line2:#c7d0da;
    --fg:#1c2632; --fg2:#4e5c6d; --fg3:#5c6a7c;
    --go:#127065; --go2:#0f665c; --danger:#b42318; --danger2:#a01911;
    --confirm:#3267d6; --confirm2:#2858ba; --warn:#8a5a10; --ai:#6b46c1;
    --chip:#eef1f5; --r:8px;
    --rail:#f0f2f5; --rail-on:#e5ecfa;
    --proj-on:#e9effa; --proj-on-line:#b9c9e7;
    --ai-soft-bg:#f4efff; --ai-soft-line:#dcccf8; --ai-soft-fg:#5b3fbf;
    --ai-btn-bg:#f1eaff; --ai-btn-line:#cbb6f2; --ai-btn-fg:#5b3fbf;
    --pcard-on:#e9effa;
    --done-bg:#e9f7ee; --done-line:#b5e2c0; --done-fg:#12612b;
    --partial-bg:#fff7e0; --partial-line:#ebd49c; --partial-fg:#6b4a00;
    --badge-done-line:#b5e2c0; --badge-run-line:#b3d4f7; --badge-fail-line:#f0b8b4;
    --flf-bg:#f3edff; --flf-line:#d8c6f7; --flf-fg:#5b3fbf;
    --media-bg:#e6ecf3; --monitor:#151a21; --ph1:#edf1f6; --ph2:#f7f9fb;
    --dash:#e4eaf1; --scrim:rgba(0,0,0,.62); --overlay:rgba(15,23,42,.32);
    --shadow:rgba(28,38,50,.16); --scroll:#c3ceda;
    --count-bg:#b42318; --count-fg:#ffffff;
    /* text that sits on a filled accent. White clears the light accents
      but only about 3:1 on the brighter dark-mode ones, so dark mode
      paints them with ink instead. */
    --on-accent:#ffffff;
    --ai-focus:rgba(130,80,223,.18); --brand-shadow:rgba(58,110,240,.25);
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#11151a; --bg2:#191f27; --bg3:#222a34; --bg4:#2c3642;
    --line:#303a46; --line2:#465363;
    --fg:#edf1f5; --fg2:#b0bdca; --fg3:#8c9aaa;
    --go:#32a394; --go2:#65c4b6; --danger:#e0574f; --danger2:#f0645c;
    --confirm:#6290e8; --confirm2:#8eaff0; --warn:#d9a441; --ai:#a374f5;
    --chip:#222a34;
    --rail:#0e1217; --rail-on:#202c3d;
    --proj-on:#202c3d; --proj-on-line:#3f587d;
    --ai-soft-bg:#201735; --ai-soft-line:#4b3a7a; --ai-soft-fg:#c4a5ff;
    --ai-btn-bg:#3b2a63; --ai-btn-line:#5b3fa0; --ai-btn-fg:#d8c9ff;
    --pcard-on:#202c3d;
    --done-bg:#122117; --done-line:#2a5533; --done-fg:#9be2a8;
    --partial-bg:#1e1a10; --partial-line:#574a22; --partial-fg:#f0d38a;
    --badge-done-line:#264d2e; --badge-run-line:#243b5e; --badge-fail-line:#5e2626;
    --flf-bg:#201735; --flf-line:#4b3a7a; --flf-fg:#c4a5ff;
    --media-bg:#000000; --monitor:#0a0e13; --ph1:#11161d; --ph2:#151b23;
    --dash:#1e262f; --scrim:rgba(0,0,0,.72); --overlay:rgba(4,7,11,.5);
    --shadow:rgba(0,0,0,.55); --scroll:#2b3745;
    /* the alert chip flips instead of reusing white: white on the lighter
      dark-mode red is only about 3:1 */
    --count-bg:#f0645c; --count-fg:#1b0b0b;
    --on-accent:#0b1220;
    --ai-focus:rgba(139,92,246,.15); --brand-shadow:rgba(58,110,240,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    overflow:hidden}
  a{color:var(--confirm2);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:flex;height:100%}

  /* ---------- icon rail ---------- */
  #rail{width:68px;flex:0 0 auto;background:var(--rail);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
  /* the mark on the rail: a solid accent, because the console is not a
    poster, and its letters take the accent's contrast partner */
  .brand{width:38px;height:38px;border-radius:9px;background:var(--confirm);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
    letter-spacing:.5px;color:var(--on-accent);margin-bottom:10px}
  /* a divider between two groups of chips is a rule, not a character:
    a pipe drawn in the border colour reads as a smudge and a screen
    reader has nothing to do with it */
  .chip-sep{align-self:stretch;width:1px;background:var(--line2);margin:2px 2px}
  .railbtn{width:54px;padding:7px 0 5px;border:0;background:transparent;color:var(--fg3);
    display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px;
    cursor:pointer;font-size:12px;font-family:inherit}
  .railbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .railbtn:hover{background:var(--bg3);color:var(--fg2)}
  .railbtn.on{background:var(--rail-on);color:var(--confirm2)}
  .railbtn.on::before{content:"";position:absolute;left:0;width:2px;height:26px;background:var(--confirm2);border-radius:2px}
  .railbtn{position:relative}
  .rail-sp{flex:1}

  /* ---------- shell ---------- */
  #shell{flex:1;min-width:0;display:flex;flex-direction:column}
  header{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:baseline;gap:8px;min-width:0}
  .crumb b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .crumb span{font-size:12px;color:var(--fg3);white-space:nowrap}
  .hchips{display:flex;gap:6px;align-items:center;flex:1;overflow:hidden}
  .hchip{background:var(--chip);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;font-size:12px;color:var(--fg2);white-space:nowrap}
  .hchip b{color:var(--fg);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
  .dot.ok{background:var(--go2)} .dot.bad{background:var(--danger2)}
  .dot.warn{background:var(--warn)} .dot.na{background:var(--fg3)}
  .noderow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:6px 0;border-bottom:1px solid var(--line)}
  .noderow:last-child{border-bottom:none}

  /* ---------- AI command bar ---------- */
  #cmdbar{display:flex;gap:8px;padding:7px 14px;background:var(--bg2);
    border-bottom:1px solid var(--line);align-items:center;flex:0 0 auto}
  #cmdbar .lbl{font-size:12px;color:var(--ai);font-weight:650;white-space:nowrap;
    border:1px solid var(--ai-soft-line);background:var(--ai-soft-bg);color:var(--ai-soft-fg);border-radius:4px;padding:2px 7px}
  #cmd{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:var(--r);padding:7px 11px;font-size:12.5px;outline:none;font-family:inherit}
  #cmd:focus{border-color:var(--ai);box-shadow:0 0 0 2px var(--ai-focus)}
  #cmdproj{background:var(--bg);border:1px solid var(--line);color:var(--fg2);
    border-radius:var(--r);padding:6px 8px;font-size:12px;max-width:160px}

  /* ---------- workspace ---------- */
  #body{display:flex;flex:1;min-height:0}
  #side{width:232px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;padding:10px}
  /* The column of projects is a column: the list, the tags, the form
     for a new project, and the management panel at the bottom. */
  .side-content{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
  .side-content > *{flex:0 0 auto}
  .newproj{display:flex;flex-direction:column;gap:8px;align-items:stretch;
    max-width:460px}
  .newproj .grow{flex:0 0 auto}
  .newproj .f{width:100%}
  #side #flowNewFold{margin:12px 0 4px}
  #side #flowNewFold>summary{padding:8px 10px;font-size:12.5px}
  #side #flowNewFold .inner{padding:10px}
  #sideToggle{display:flex;align-items:center;justify-content:center;gap:6px;
    flex:0 0 auto;width:100%;margin-top:12px;color:var(--fg3)}
  #side.hide{display:flex;width:44px;padding:10px 5px}
  #side.hide .side-content{display:none}
  #side.hide #sideToggle span:last-child{display:none}
  #main{flex:1;min-width:0;overflow-y:auto;padding:16px 18px}
  .side-h{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--fg3);
    margin:12px 0 6px;font-weight:700;display:flex;justify-content:space-between}
  .side-h:first-child{margin-top:0}
  .proj{padding:7px 9px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;
    margin-bottom:3px;position:relative}
  .proj:hover{background:var(--bg3)}
  .proj.on{background:var(--proj-on);border-color:var(--proj-on-line)}
  .proj .pn{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding-right:26px}
  .proj .pm{color:var(--fg3);font-size:12px;margin-top:1px}
  /* Deleting a project is a real button: reachable by Tab, big enough to
    hit, and it says which project it means. */
  .proj-del{position:absolute;top:4px;right:4px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:6px;background:transparent;
    color:var(--fg3);font-size:15px;line-height:1;cursor:pointer;padding:0;
    transition:background .14s ease,color .14s ease,border-color .14s ease}
  .proj-del:hover,.proj-del:focus-visible{background:color-mix(in srgb,var(--danger2) 12%,transparent);
    border-color:var(--danger2);color:var(--danger2)}
  .tagfilter{display:flex;flex-wrap:wrap;gap:6px}
  /* a filter you can actually hit: 24px tall, 8px apart, and it answers
    the pointer instead of changing all at once */
  .tg{background:var(--chip);border:1px solid var(--line);color:var(--fg2);
    border-radius:12px;min-height:26px;padding:3px 11px;font-size:12.5px;cursor:pointer;
    transition:background .14s ease,border-color .14s ease,color .14s ease}
  .tg:hover{border-color:var(--fg3)}
  .tg.on{background:var(--confirm);border-color:var(--confirm);color:var(--on-accent)}

  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--line);background:var(--bg3);color:var(--fg);
    border-radius:var(--r);min-height:34px;padding:6px 14px;font-size:13px;cursor:pointer;
    font-weight:600;white-space:nowrap;font-family:inherit;
    transition:background .14s ease,border-color .14s ease,color .14s ease,transform .1s ease}
  .btn:hover{background:var(--bg4);border-color:var(--line2)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.go{background:var(--go);border-color:var(--go);color:var(--on-accent)}
  .btn.go:hover{background:var(--go2);border-color:var(--go2)}
  .btn.confirm{background:var(--confirm);border-color:var(--confirm);color:var(--on-accent)}
  .btn.confirm:hover{background:var(--confirm2);border-color:var(--confirm2)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
  .btn.danger:hover{background:var(--danger2);border-color:var(--danger2)}
  .btn.ghost{background:transparent}
  .btn.ghost:hover{background:var(--bg3)}
  .btn.ai{background:var(--ai-btn-bg);border-color:var(--ai-btn-line);color:var(--ai-btn-fg)}
  .btn.sm{min-height:30px;padding:3px 10px;font-size:12.5px}
  .btn.xs{min-height:26px;padding:2px 9px;font-size:12px;border-radius:5px}
  /* an icon-only button is square, carries its own name for readers, and
    draws the mark as an svg rather than a character someone typed */
  .btn.icon{width:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .btn.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .btn.sm.icon{width:32px}
  .btn.xs.icon{width:28px}
  #themeBtn{display:flex;align-items:center;justify-content:center;width:34px;min-height:34px;padding:0}
  #themeBtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  html[data-theme="light"] #themeBtn .ico-sun{display:none}
  html[data-theme="dark"] #themeBtn .ico-moon{display:none}

  /* ---------- general ---------- */
  h1.page{font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--fg2);font-size:13.5px;margin-bottom:14px;line-height:1.55;max-width:880px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;
    align-items:center;gap:8px;justify-content:space-between}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .grow{flex:1;min-width:180px}
  /* a field label is read before the field is filled in, so it is not a
    footnote: 12px minimum, and it stays the same size everywhere */
  label.fl{display:block;font-size:12px;color:var(--fg2);margin-bottom:5px;font-weight:600}
  input.f,textarea.f,select.f{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--fg);border-radius:var(--r);min-height:36px;padding:7px 10px;font-size:13.5px;outline:none;
    font-family:inherit}
  input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--confirm);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--confirm) 18%,transparent)}
  textarea.f{resize:vertical;min-height:60px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--fg2);
    border-radius:14px;min-height:28px;padding:4px 11px;font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
    transition:background .14s ease,border-color .14s ease,color .14s ease}
  .chip:hover{border-color:var(--fg3)}
  .chip.on{background:var(--confirm);border-color:var(--confirm);color:var(--on-accent)}
  .pcard{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 12px;cursor:pointer;min-width:120px;min-height:44px}
  .pcard:hover{border-color:var(--fg3)}
  .pcard.on{border-color:var(--confirm);background:var(--pcard-on)}
  .pcard .pl{font-weight:650;font-size:13px}
  .pcard .pd{color:var(--fg3);font-size:12.5px;margin-top:2px}
  .preset{display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:12.5px;min-height:22px;padding:2px 9px;border-radius:11px;border:1px solid var(--line);
    color:var(--fg2);background:var(--chip);display:inline-flex;align-items:center}
  .badge.done{color:var(--done-fg);border-color:var(--done-line);background:var(--done-bg)}
  .badge.run{color:var(--confirm2);border-color:var(--badge-run-line)}
  .badge.fail{color:var(--danger2);border-color:var(--badge-fail-line);
    background:color-mix(in srgb,var(--danger2) 8%,var(--bg2))}
  .badge.flf{color:var(--flf-fg);border-color:var(--flf-line);background:var(--flf-bg)}
  /* a status is never colour alone: the word is already in the badge, and
    the dot in front of it carries the shape as well as the hue */
  .muted{color:var(--fg3)}
  .empty{color:var(--fg3);text-align:center;padding:38px 10px;font-size:13.5px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--fg3);
    border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  code,.kv{font-family:var(--mono);font-size:12px;background:var(--bg);
    border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .mini{font-size:12px;background:var(--chip);border:1px solid var(--line);
    border-radius:9px;padding:2px 7px;color:var(--fg2);display:inline-block;line-height:1.35}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--bg3);border:1px solid var(--line);
    border-left:4px solid var(--confirm2);border-radius:var(--r);padding:11px 15px;
    font-size:13.5px;max-width:380px;box-shadow:0 6px 24px var(--shadow);z-index:200;
    opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
  .toast.show{opacity:1;transform:none}
  .toast.err{border-left-color:var(--danger2)}
  .toast.ok{border-left-color:var(--go2)}

  /* ---------- workbench ---------- */
  /* The cover is a poster, and it is as tall as the block of text beside
     it.  The picture inside is taken out of the flow, so the poster's
     own size does not push the row wider than the page: before, the
     picture's natural height made the whole header a thousand pixels
     tall. */
  .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;
    align-items:stretch;margin-bottom:14px}
  .hero .cover{position:relative;height:100%;min-height:212px;aspect-ratio:9/16;
    border-radius:7px;overflow:hidden;background:var(--media-bg);
    border:1px solid var(--line)}
  .hero .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .hsyn{margin-top:5px;font-size:12.5px;line-height:1.45;color:var(--fg2);
    max-width:52ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden}
  .hero .hb{flex:1;min-width:0}
  .hero .ht{font-size:19px;font-weight:750;margin:0 0 2px}
  .hero .hm{color:var(--fg2);font-size:12px}
  .statrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:6px;
    padding:7px 11px;min-width:92px}
  .stat b{display:block;font-size:17px;line-height:1.2}
  .stat span{font-size:12px;color:var(--fg3)}
  .stagebar{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .stg{display:flex;align-items:center;gap:5px;background:var(--bg2);
    border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px;
    color:var(--fg2);cursor:pointer}
  .stg:hover{border-color:var(--fg3)}
  .stg.done{color:var(--done-fg);border-color:var(--done-line);background:var(--done-bg)}
  .stg.partial{color:var(--partial-fg);border-color:var(--partial-line);background:var(--partial-bg)}
  .stg.pending{color:var(--fg2)}
  /* stopped and failed look different from each other and from pending:
    one wants a resume, one wants a look at the log, one wants a first run */
  .stg.interrupted{color:var(--partial-fg);border-color:var(--warn);
    background:color-mix(in srgb,var(--warn) 12%,var(--bg2));border-style:dashed}
  .stg.failed{color:var(--danger2);border-color:var(--danger2);
    background:color-mix(in srgb,var(--danger2) 10%,var(--bg2))}
  .stg.running{color:var(--confirm);border-color:var(--badge-run-line)}
  .stg .num{font-family:var(--mono);font-size:12px;opacity:.7}
  .epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .epcard{background:var(--bg2);border:1px solid var(--line);border-radius:7px;
    padding:11px;cursor:pointer;transition:border-color .12s}
  .epcard:hover{border-color:var(--line2)}
  .epcard .eh{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .epcard .eh b{font-size:13px}
  .epcard .el{color:var(--fg2);font-size:12.5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .epcard .ef{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .epcard .ebar{height:3px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
  .epcard .ebar i{display:block;height:100%;background:var(--go2)}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  details.fold{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
    padding:0;margin-bottom:12px;overflow:hidden}
  details.fold>summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:650;
    list-style:none;display:flex;align-items:center;gap:8px;color:var(--fg2)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary:hover{color:var(--fg)}
  details.fold[open]>summary{border-bottom:1px solid var(--line);color:var(--fg)}
  details.fold .inner{padding:13px 14px}

  /* ---------- the management panel, in the column of projects ---------- */
  /* the management panel is at the bottom of the column of projects */
  #side #projectManagement{margin-top:auto}
  #side #projectManagement>summary{padding:8px 10px;font-size:12.5px}
  #side #projectManagement .inner{padding:10px}
  #side #projectManagement .management-grid{display:flex;flex-direction:column;gap:11px}
  #side #projectManagement .management-grid b{font-size:12.5px}
  #side #projectManagement .management-grid .muted{font-size:11.5px;line-height:1.4}
  #side #projectManagement .management-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  #side #projectManagement .management-actions .btn{font-size:11.5px;padding:3px 9px;
    min-height:26px}
  #side #projectManagement .trash-row{display:flex;gap:7px;align-items:center;
    font-size:11.5px;margin-top:6px}
  #side #projectManagement .trash-row .grow{min-width:0}
  #side #projectManagement .trash-row .btn{flex:0 0 auto;min-height:24px;padding:2px 8px}

  /* ---------- storyboard ---------- */
  .boardbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .boardbar select{max-width:200px}
  .scblock{border:1px solid var(--line);border-radius:7px;margin-bottom:12px;
    background:var(--bg2);overflow:hidden}
  .sch{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--bg3);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sch .t{font-weight:650;font-size:12.5px}
  .sch .m{color:var(--fg3);font-size:12px}
  .shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;padding:10px 12px}
  .shotcard{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    overflow:hidden;cursor:pointer;position:relative}
  .shotcard:hover{border-color:var(--confirm)}
  .shotcard .media{height:200px;background:var(--media-bg);position:relative}
  .shotcard .media img,.shotcard .media video{width:100%;height:100%;object-fit:cover;display:block}
  .shotcard .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--fg3);font-size:12px;
    background:repeating-linear-gradient(45deg,var(--ph1),var(--ph1) 6px,var(--ph2) 6px,var(--ph2) 12px)}
  .shotcard .cap{padding:5px 7px;font-size:12px;color:var(--fg2);line-height:1.35}
  .shotcard .cap b{color:var(--fg);font-weight:600;font-size:12px}
  .shotcard .sidx{position:absolute;left:5px;top:5px;background:var(--scrim);
    color:#fff;font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:3px}
  .shotcard .sfl{position:absolute;right:5px;top:5px;background:var(--flf-bg);
    color:var(--flf-fg);border:1px solid var(--flf-line);font-size:12.5px;padding:1px 6px;border-radius:3px}
  .shotcard .sst{position:absolute;right:5px;bottom:5px}
  .lines{padding:0 12px 10px}
  .line{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--dash);font-size:12px;
    align-items:flex-start}
  .line:last-child{border-bottom:0}
  .line .sp{color:var(--confirm2);min-width:58px;font-weight:600;font-size:12.5px}
  .line .tx{flex:1;color:var(--fg2)}
  .line .au{color:var(--fg3);font-size:12px;cursor:pointer;white-space:nowrap}
  .line .au:hover{color:var(--fg)}
  .lineedit{background:transparent;border:0;color:var(--fg3);cursor:pointer;font-size:12px;
    padding:0 4px}
  .lineedit:hover{color:var(--confirm2)}

  /* ---------- cast ---------- */
  .castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .castcard{background:var(--bg2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .casttop{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
  /* The reference is one wide sheet now - a head on the left and three
     bodies on the right - so the box is sized to that ratio instead of a
     portrait crop that cut the bodies off the edge. */
  .casttop .ref{width:184px;height:auto;aspect-ratio:2/1;flex:0 0 auto;border-radius:5px;
    overflow:hidden;background:var(--media-bg);border:1px solid var(--line)}
  .casttop .ref img{width:100%;height:100%;object-fit:contain;display:block}
  .casttop .cb{flex:1;min-width:0}
  .casttop .cn{font-size:14px;font-weight:700}
  .casttop .cr{color:var(--fg2);font-size:12.5px;margin:2px 0 6px}
  .reflist{display:flex;gap:4px;flex-wrap:wrap}
  .reflist img{width:64px;height:32px;object-fit:contain;border-radius:3px;border:1px solid var(--line)}
  .castbody{padding:10px}
  .castbody textarea{min-height:64px;font-size:12.5px}
  .lockrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;
    font-size:12.5px;color:var(--fg2)}
  .lockrow input[type=checkbox]{accent-color:var(--confirm)}
  .locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .loc{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12.5px}
  .loc .li{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .loc .li img{width:44px;height:60px;object-fit:cover;border-radius:3px}

  /* ---------- assets ---------- */
  .assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .asset{background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .asset .am{height:180px;background:var(--media-bg);display:flex;align-items:center;justify-content:center}
  .asset .am img,.asset .am video{width:100%;height:100%;object-fit:cover}
  .asset .am .at{color:var(--fg3);font-size:12px;text-align:center;padding:6px}
  .asset .ab{padding:6px 8px}
  .asset .an{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asset .ameta{font-size:12px;color:var(--fg3);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
  .res{display:flex;gap:10px;padding:9px;border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:7px;background:var(--bg2);align-items:flex-start}
  .res .thumb{width:56px;height:80px;flex:0 0 auto;border-radius:4px;overflow:hidden;background:var(--media-bg)}
  .res .thumb img,.res .thumb video{width:100%;height:100%;object-fit:cover}
  .res .rb{flex:1;min-width:0}
  .res .rt{font-weight:600;font-size:12.5px}
  .res .rx{color:var(--fg2);font-size:12.5px;margin:2px 0;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .res .rtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

  /* ---------- settings / models ---------- */
  .health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
  .hc{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .hc .hn{font-size:12px;color:var(--fg3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .hc .hv{font-size:12.5px;font-weight:600}
  .hc .hd{font-size:12px;color:var(--fg2);margin-top:3px;word-break:break-all}
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);
    margin-top:6px;cursor:pointer}

  /* ---------- guide ---------- */
  .guide-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(135deg,var(--bg2),var(--ai-soft-bg));
    border:1px solid var(--ai-soft-line);border-radius:8px;padding:15px 17px;margin-bottom:12px}
  .guide-hero h1{font-size:20px;margin:0 0 3px;letter-spacing:.2px}
  .guide-hero .gsub{color:var(--fg2);font-size:12.5px;line-height:1.55;max-width:640px}
  .guide-hero .gh-side{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .guide-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px}
  .guide-stats b{display:block;font-size:16px;line-height:1.2}
  .guide-stats span{font-size:12px;color:var(--fg3)}
  .gab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ai-soft-bg);
    border:1px solid var(--ai-soft-line);color:var(--ai-soft-fg);border-radius:6px;
    padding:8px 11px;font-size:12px;margin-bottom:10px}
  .arch{display:flex;flex-direction:column;gap:8px}
  .arch-lane{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap;background:var(--bg);
    border:1px solid var(--line);border-radius:7px;padding:7px}
  .arch-lbl{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--fg3);background:var(--bg3);border-radius:5px;
    letter-spacing:.5px;text-align:center}
  .anode{flex:1 1 88px;min-width:84px;background:var(--bg2);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;cursor:pointer;position:relative;transition:border-color .12s}
  .anode:hover{border-color:var(--confirm2)}
  .anode .ai{font-family:var(--mono);font-size:12px;color:var(--fg3)}
  .anode b{display:block;font-size:12.5px;margin:1px 0}
  .anode small{display:block;font-size:12.5px;color:var(--fg3);line-height:1.3}
  .anode .adot{position:absolute;right:7px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--fg3)}
  .anode.done{border-color:var(--done-line);background:var(--done-bg)}
  .anode.done .adot{background:var(--go2)}
  .anode.partial{border-color:var(--partial-line);background:var(--partial-bg)}
  .anode.partial .adot{background:var(--warn)}
  .anode.out{flex:1 1 110px;cursor:default;background:var(--bg3);border-style:dashed}
  .anode.out:hover{border-color:var(--line)}
  .aarrow{display:flex;align-items:center;color:var(--fg3);font-size:12px;padding:0 1px}
  .arch-base{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .basechip{font-size:12px;color:var(--fg2);background:var(--bg3);border:1px solid var(--line);
    border-radius:12px;padding:2px 9px}
  .basechip b{color:var(--fg);font-weight:600}
  .arch-note{font-size:12.5px;color:var(--fg2);line-height:1.6;margin-top:9px;
    background:var(--bg);border-left:2px solid var(--ai-soft-line);padding:7px 10px;border-radius:0 5px 5px 0}
  .gsteps{display:flex;flex-direction:column;gap:7px}
  .gstep{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
  .gstep.done{border-color:var(--done-line);background:var(--done-bg)}
  .gstep.cur{border-color:var(--confirm);box-shadow:0 0 0 2px var(--ai-focus)}
  .gnum{width:25px;height:25px;border-radius:50%;background:var(--bg4);color:var(--fg2);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
  .gstep.done .gnum{background:var(--go);color:var(--on-accent)}
  .gstep.cur .gnum{background:var(--confirm);color:var(--on-accent)}
  .gstep .gt{font-weight:650;font-size:12.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .gstep .gd{color:var(--fg3);font-size:12px;margin-top:1px;line-height:1.5}
  .gstep .ga{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .gbar{height:3px;background:var(--bg4);border-radius:2px;margin-top:6px;overflow:hidden;
    width:min(260px,100%)}
  .gbar i{display:block;height:100%;background:var(--go2)}
  .gstep.cur .gbar i{background:var(--confirm2)}
  .envchip{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;
    color:var(--fg3);background:var(--bg2)}
  .envchip.ok{color:var(--done-fg);border-color:var(--done-line);background:var(--done-bg)}
  .envchip.bad{color:var(--danger2);border-color:var(--badge-fail-line)}
  .gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  .intg{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:12px}
  .intg .ih{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
  .intg .ih b{font-size:13px}
  .intg .im{font-size:12px;color:var(--fg3);word-break:break-all;margin-bottom:6px;line-height:1.5}
  .intg ol{margin:6px 0 0;padding-left:17px;font-size:12.5px;color:var(--fg2);line-height:1.6}
  .intg ol li{margin-bottom:2px}
  .intg code{font-size:12px;word-break:break-all}
  .intg-note{font-size:12px;color:var(--fg3);background:var(--bg);border-left:2px solid var(--line2);
    padding:6px 8px;margin-top:8px;line-height:1.55;border-radius:0 4px 4px 0}
  .intg-err{border-left-color:var(--danger2);color:var(--danger2)}
  .cibox{margin-top:8px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:9px 10px}
  .cibox .cirow{display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap}
  .cibox .cirow .grow{flex:1;min-width:170px}
  .cibox .f{padding:5px 7px;font-size:12px}
  .cibox .fl{font-size:12px;margin-bottom:2px}
  .cibox .cigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-top:8px}
  .cibox .fw{font-size:12px;color:var(--fg3);margin-top:7px;line-height:1.55}
  .cibox .cierr{color:var(--danger2);font-size:12px;line-height:1.55;margin-top:6px}
  .cimap{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;min-height:14px}
  .cimap span{font-size:12.5px;background:var(--bg3);border:1px solid var(--line);border-radius:3px;
    padding:0 5px;color:var(--fg3);font-family:var(--mono)}
  .cimap span.muted{border:0;background:none;padding:0}
  .flowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}
  .flow{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
  .flow b{font-size:12px;display:block;margin-bottom:3px}
  .flow span{font-size:12.5px;color:var(--fg2);line-height:1.55}
  .newform{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
  .newform .grow{min-width:190px}
  @media(max-width:760px){ .gstep{grid-template-columns:26px 1fr} .gstep .ga{grid-column:2;justify-content:flex-start} }

  /* ---------- drawer ---------- */
  #drawerMask{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;
    transition:.18s;z-index:140}
  #drawerMask.show{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;
    background:var(--bg2);border-left:1px solid var(--line2);z-index:150;
    transform:translateX(102%);transition:.2s;display:flex;flex-direction:column}
  #drawer.show{transform:none}
  .dhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .dhead .dt{font-weight:700;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbody{flex:1;overflow-y:auto;padding:13px 14px}
  .dfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);
    background:var(--bg3)}
  .dprev{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .dprev .dp{width:92px;height:150px;border-radius:5px;overflow:hidden;background:var(--media-bg);
    border:1px solid var(--line);position:relative}
  .dprev .dp img,.dprev .dp video{width:100%;height:100%;object-fit:cover}
  .dprev .dp span{position:absolute;left:3px;top:3px;background:var(--scrim);
    font-size:12px;color:#fff;padding:0 4px;border-radius:2px}
  .dsec{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .dsec:first-child{border-top:0;margin-top:0;padding-top:0}
  .dsec h4{margin:0 0 8px;font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px}

  @media(max-width:1180px){
    /* The project column was hidden here and the button that was meant
       to bring it back did nothing, so the projects could not be reached
       at all.  They are above the work now, and the work is below
       them. */
    #body{flex-direction:column}
    #side{display:block;width:100%;flex:0 0 auto;max-height:38vh;overflow:auto;
      border-right:none;border-bottom:1px solid var(--line)}
    #sideToggle{display:none}
  }
  @media(max-width:900px){ #cmdproj{display:none} .hero .cover{display:none} }

/* workbench: main column + chapter rail on the right */
.wb-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.wb-main{min-width:0}
.wb-rail{position:sticky;top:0;min-width:0}
@media (max-width:1100px){.wb-layout{grid-template-columns:minmax(0,1fr)}
  .wb-rail{position:static}}

/* the chapter rail card */
#work-chapters{margin-bottom:0}
.chap-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.chap-tools .btn{padding:3px 9px;font-size:12.5px}
.chap-tools .grow{flex:1}
.chap-body{max-height:min(50vh,540px);overflow:auto;margin-top:6px;
    overscroll-behavior:contain}

/* icon mode: a tile per chapter, scannable at a glance */
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.chap-tile{position:relative;border:1px solid var(--line);background:var(--bg3);
  border-radius:var(--r);padding:6px 3px;text-align:center;cursor:pointer;
  font-size:12px;line-height:1.25;user-select:none;transition:.12s}
.chap-tile .cn{font-weight:650;color:var(--fg2);display:block}
.chap-tile .ck{color:var(--fg3);font-size:12px;display:block;margin-top:1px}
.chap-tile.on{background:var(--pcard-on);border-color:var(--proj-on-line)}
.chap-tile.on .cn{color:var(--confirm)}
.chap-tile:hover{border-color:var(--confirm)}
  /* A chapter says where it is: made, being made, or not made yet. */
  .chap-tile.st-done{border-color:var(--done-line);background:var(--done-bg)}
  .chap-tile.st-done .cn{color:var(--done-fg)}
  .chap-tile.st-running{border-color:var(--confirm);
    background:color-mix(in srgb,var(--confirm) 12%,var(--bg3))}
  .chap-tile.st-running .cn{color:var(--confirm)}
  .chap-tile.st-running::after{content:"";position:absolute;left:3px;top:3px;
    width:5px;height:5px;border-radius:50%;background:var(--confirm);
    animation:sbblink 1.2s ease-in-out infinite}
  @keyframes sbblink{0%,100%{opacity:.25}50%{opacity:1}}
  .chap-state{font-size:11.5px;color:var(--fg3);margin-left:auto;white-space:nowrap}
  .chap-row.st-done .chap-state{color:var(--done-fg)}
  .chap-row.st-running .chap-state{color:var(--confirm)}
  .chap-tile .tick{position:absolute;top:1px;right:3px;font-size:12px;color:var(--confirm);opacity:0}
.chap-tile.on .tick{opacity:1}
/* reading a chapter is a thing you do on purpose, so it gets its own
   button rather than sharing the click with picking - and it only shows
   when the pointer is on the tile, so the grid stays a grid */
.chap-tile .cr{position:absolute;bottom:1px;right:3px;font-size:11.5px;color:var(--fg3);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;cursor:pointer;
  background:var(--bg);line-height:1.5;opacity:0;transition:.12s}
.chap-tile:hover .cr{opacity:1}
.chap-tile .cr:hover{color:var(--fg);border-color:var(--confirm);opacity:1}
.chap-vol{grid-column:1/-1;font-size:12px;color:var(--fg3);margin:6px 0 2px;
  border-bottom:1px solid var(--line);padding-bottom:2px;font-weight:600}

/* the reader: a scrim over the page, a sheet of paper on top of it */
.rd-scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:24px}
.rd-sheet{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 18px 60px var(--shadow)}
.rd-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line)}
.rd-head .rd-t{font-weight:650;font-size:14px}
.rd-head .rd-v{color:var(--fg3);font-size:12.5px}
.rd-body{overflow:auto;padding:18px 26px;line-height:1.95;font-size:14.5px;
  white-space:pre-wrap;color:var(--fg)}
.rd-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-top:1px solid var(--line);color:var(--fg3);font-size:12.5px}
.rd-foot .btn{padding:4px 12px;font-size:12px}

/* the progress panel: a stage that is running, and how long it has been */
@keyframes dkspin{to{transform:rotate(360deg)}}
#progressSlot .spin{display:inline-block;width:11px;height:11px;
  border:2px solid var(--line);border-top-color:var(--confirm);border-radius:50%;
  animation:dkspin .9s linear infinite;vertical-align:-1px}
#progressSlot:empty{display:none}
.prog-strip{margin-top:9px;font-size:12.5px;line-height:2}
.prog-strip span{white-space:nowrap;margin-right:9px}

/* the running stage, made to look like it is running */
@keyframes dkbreathe{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:dkbreathe 1.6s ease-in-out infinite}
@keyframes dkbar{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.prog-bar{position:relative;height:6px;border-radius:3px;overflow:hidden;
  background:var(--bg4);margin-top:10px}
.prog-bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--confirm),var(--confirm2));
  transition:width .6s ease}
/* when a stage says how much is left, the bar says so too; when it does
   not, an honest crawl is better than a bar frozen at zero */
.prog-bar.indet i{width:25%;background:linear-gradient(90deg,transparent,var(--confirm),var(--confirm2),transparent);
  animation:dkbar 1.5s linear infinite}

/* a picture, whole, over the page */
.lb-scrim{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:120;
  display:flex;align-items:center;justify-content:center;padding:18px}
.lb-box{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  width:min(1240px,97vw);max-height:97vh;display:flex;flex-direction:column;
  box-shadow:0 22px 80px rgba(0,0,0,.55)}
.lb-head{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line)}
.lb-head .t{font-weight:650}
.lb-head .n{color:var(--fg3);font-size:12px}
.lb-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
  padding:14px;min-height:220px;cursor:zoom-out}
.lb-body img{max-width:100%;max-height:calc(97vh - 140px);object-fit:contain;
  border-radius:4px;background:var(--bg3)}
.lb-foot{display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-top:1px solid var(--line);font-size:12.5px}
.lb-foot .btn{padding:4px 14px}

/* the skills page: what each stage writes with, and what it costs */
.sk-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--line)}
.sk-row:last-child{border-bottom:0}
.sk-name{font-weight:650;font-size:13.5px;white-space:nowrap}
.sk-size{color:var(--fg3);font-size:12px;white-space:nowrap;
  min-width:78px;text-align:right}
.sk-desc{color:var(--fg2);font-size:13px;line-height:1.55;flex:1;min-width:0}
.sk-pick{border:1px solid var(--line);background:var(--bg3);color:var(--fg2);
  border-radius:6px;min-height:28px;padding:4px 10px;font-size:12px;cursor:pointer;
  white-space:nowrap;font-family:inherit;
  transition:background .14s ease,border-color .14s ease,color .14s ease}
.sk-pick:hover{border-color:var(--confirm);color:var(--confirm)}
.sk-pick.on{background:var(--confirm);border-color:var(--confirm);color:var(--on-accent)}
.sk-cost{font-variant-numeric:tabular-nums}
/* the cross on a selected skill is a mark, not a second control: the
  whole chip is one button and the mark only shows where it leads */
.chip .sk-x{opacity:.7;font-size:13px;line-height:1}
.chip.on:hover .sk-x{opacity:1}

  /* ---------- compact console ----------
     The console is a work surface, not a document: the padding is small,
     the cards sit close together, and the reading copy is gone. */
  #main{padding:14px 16px 52px}
  .card{padding:12px 13px;margin-bottom:10px}
  h1.page{font-size:17px}
  .hero{gap:12px;margin-bottom:10px}
  .hero .cover{min-height:212px;width:auto}
  .hero .ht{font-size:17px}
  .statrow{gap:6px;margin:8px 0 2px}
  .stat{padding:5px 9px;min-width:76px}
  .stat b{font-size:15px}
  .stat span{font-size:11.5px}
  .epgrid{grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px}
  .epcard{padding:9px}
  .shotgrid{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:7px;padding:8px 10px}
  .shotcard .media{height:168px}
  .assetgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
  .asset .am{height:150px}
  .castgrid{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
  .row{gap:8px}
  .btn{min-height:32px;padding:5px 12px;font-size:12.5px}
  .btn.sm{min-height:28px}
  .btn.xs{min-height:24px}
  input.f,textarea.f,select.f{min-height:32px;padding:5px 9px;font-size:13px}
  details.fold{margin-bottom:8px}
  details.fold>summary{padding:7px 12px}
  details.fold .inner{padding:11px 12px}

  /* ---------- the workspace tabs ---------- */
  .wb-tabs{display:flex;gap:3px;padding:3px;margin-bottom:12px;width:fit-content;
    border:1px solid var(--line);border-radius:9px;background:var(--bg2);overflow-x:auto}
  .wb-tab{min-height:30px;padding:3px 13px;border:0;border-radius:6px;background:transparent;
    color:var(--fg2);cursor:pointer;font-size:12.5px;font-family:inherit;white-space:nowrap}
  .wb-tab:hover{background:var(--bg3);color:var(--fg)}
  .wb-tab.on{background:var(--bg3);color:var(--fg);font-weight:650}
  .wb-pane[hidden]{display:none}
  /* The book on the left, the steps on the right: the two things a
     person reads before touching anything. */
  .wb-head{display:grid;grid-template-columns:minmax(290px,.95fr) minmax(0,1.75fr);
    gap:12px;align-items:start;margin-bottom:10px}
  .wb-head > .card{margin-bottom:0}
  .wb-head h1{margin:0}
  @media(max-width:1080px){.wb-head{grid-template-columns:1fr}}

  /* ---------- the five steps ---------- */
  .stepstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .step{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;
    cursor:pointer;text-align:left;font-family:inherit;color:var(--fg);min-width:0}
  .step:hover{border-color:var(--line2)}
  .step .sn{font:600 11px var(--mono);color:var(--fg3)}
  .step .st{font-weight:650;font-size:12.5px;display:flex;align-items:center;gap:5px}
  .step .sd{color:var(--fg3);font-size:11.5px;margin-top:0;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step.done{border-color:var(--done-line);background:var(--done-bg)}
  .step.done .st{color:var(--done-fg)}
  .step.partial{border-color:var(--partial-line);background:var(--partial-bg)}
  .step.running{border-color:var(--confirm);box-shadow:0 0 0 1px var(--confirm)}
  .step.failed{border-color:var(--danger2);background:color-mix(in srgb,var(--danger2) 8%,var(--bg2))}
  .step.on{border-color:var(--confirm);outline:2px solid var(--confirm);
    outline-offset:1px;background:color-mix(in srgb,var(--confirm) 14%,var(--bg2));
    box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .step.on .sn{color:var(--confirm)}
  .step.on .st{color:var(--fg)}
  .step .tick{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--confirm);
    border:1px solid var(--confirm);border-radius:9px;padding:0 6px;line-height:1.5}
  .step .sbar{display:block;height:3px;border-radius:2px;background:var(--bg4);margin-top:4px;overflow:hidden}
  .step .sbar i{display:block;height:100%;background:var(--go2)}
  .stepchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--fg3);
    border:1px solid var(--line);border-radius:9px;padding:1px 7px;background:var(--bg)}
  .stepchip.done{color:var(--done-fg);border-color:var(--done-line);background:var(--done-bg)}

  /* ---------- the bar along the bottom of the page ---------- */
  .statusbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;
    align-items:center;gap:10px;padding:5px 14px;background:var(--bg2);
    border-top:1px solid var(--line);box-shadow:0 -1px 8px rgba(0,0,0,.18);
    font-size:12px}
  .statusbar .sb-left{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .statusbar .sb-nodes{color:var(--fg3);font-size:11.5px;white-space:nowrap}
  .statusbar .sb-ticker{flex:1;min-width:0;overflow:hidden;position:relative;height:19px;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
  .statusbar .sb-track{display:inline-flex;white-space:nowrap;
    animation:sbroll 45s linear infinite;will-change:transform}
  .statusbar .sb-track span{padding-right:48px}
  .statusbar .sb-track:hover{animation-play-state:paused}
  @keyframes sbroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .envrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .runbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .envchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--fg3);
    border:1px solid var(--line);border-radius:9px;padding:1px 8px;background:var(--bg)}
  .envchip.ok{color:var(--go2);border-color:color-mix(in srgb,var(--go2) 40%,var(--line))}
  .envchip.bad{color:var(--danger2);border-color:color-mix(in srgb,var(--danger2) 40%,var(--line))}

  /* ---------- the workbench: the work on the left, the book on the right --
     The novel is what the whole page is about and it is the smallest
     thing on it, so it gets a column of its own that does not scroll
     away with the rest of the page. */
  .wb-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
  .wb-setup{display:grid;
    grid-template-columns:minmax(240px,.8fr) minmax(300px,1fr) minmax(560px,2.2fr);
    gap:12px;align-items:stretch;margin-bottom:12px}
  /* The three cards are as tall as the tallest of them, so the page has
     one row of three and not three rows of different lengths.  The
     chapter list is the one that can be longer than the others, so it
     is given no height of its own to contribute - it takes what the
     row has and scrolls in it. */
  .wb-setup > .card{margin-bottom:0;display:flex;flex-direction:column;min-height:0}
  .wb-setup #work-chapters .chap-body{flex:1 1 0;min-height:0;max-height:none;
    overflow:auto;overscroll-behavior:contain}
  .wb-setup #lookCard .looknote{margin-top:auto}
  /* the skills take a column of their own, and the list of checkboxes
     is two wide only where there is room for two */
  .skcard .skgrid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .wb-main{min-width:0}
  .wb-side{position:sticky;top:8px;display:flex;flex-direction:column;gap:12px;
    height:calc(100vh - 76px);overflow:hidden;padding-right:2px}
  .wb-side .card{margin-bottom:0}
  .wb-side #lookCard{flex:0 0 auto}
  .wb-side #work-chapters{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .wb-side #work-chapters > *{flex:0 0 auto}
  .wb-side .chap-body{flex:1 1 auto;min-height:0;max-height:none;overflow:auto}
  .looknote{margin-top:7px;font-size:12px;color:var(--fg2);line-height:1.5}
  .segrow{display:flex;gap:6px;margin-bottom:8px}
  .seg{flex:1;min-height:32px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg3);color:var(--fg2);cursor:pointer;font-family:inherit;font-size:12.5px}
  .seg:hover{border-color:var(--line2);color:var(--fg)}
  .seg.on{background:var(--pcard-on);border-color:var(--proj-on-line);color:var(--fg);font-weight:650}

  /* ---------- the skills, one column per step ---------- */
  .skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin-top:8px}
  .skcol{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:7px 8px;min-width:0;container-type:inline-size}
  .skcol .skt{font-weight:650;font-size:12.5px;margin-bottom:6px}  .skcol .skt{display:flex;align-items:center;gap:6px}
  .skcol .skstep{font-weight:400;font-size:11.5px;color:var(--fg3);
    border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .skdim{color:var(--fg3);font-size:11.5px}
  .skgrp{margin-bottom:8px}
  .skgrp:last-child{margin-bottom:0}
  .skgrp .sks{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg2);
    margin-bottom:4px;white-space:nowrap}
  .skgrp .sks .muted{font-size:11.5px;margin-left:auto}
  .skopts{columns:1;column-gap:10px;padding-right:2px}
  @container (min-width:235px){.skopts{columns:2}}
  .skopts .skck{break-inside:avoid}
  .skck{display:flex;align-items:flex-start;gap:5px;font-size:11.5px;color:var(--fg2);
    cursor:pointer;line-height:1.35}
  .skck:hover{color:var(--fg)}
  .skck input{margin:2px 0 0;flex:0 0 auto}

  @media(max-width:1440px){.wb-setup{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .wb-setup > .card.skcard{grid-column:1/-1}}
  @media(max-width:1180px){.wb-grid{grid-template-columns:1fr}
    .wb-setup{grid-template-columns:1fr}
    .wb-setup > .card.skcard{grid-column:auto}
    /* one card per row: the chapter list needs a height of its own again */
    .wb-setup #work-chapters .chap-body{flex:0 0 auto;max-height:min(50vh,540px)}
    .wb-side{position:static;height:auto;max-height:none;overflow:visible}
    .wb-side #work-chapters{display:block}
    .wb-side .chap-body{max-height:calc(100vh - 210px)}
    .skgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:980px){.stepstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
    .two-col{grid-template-columns:1fr}}
  @media(max-width:640px){.stepstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
    .skgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wb-tabs{width:100%}}
</style>

</head>
<body>
<div id="app">
  <nav id="rail" aria-label="主导航">
    <button class="brand" id="brandBtn" title="工作台" aria-label="工作台">DK</button>
    <button class="railbtn on" data-page="workbench" title="工作台">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>工作台</span>
    </button>
    <button class="railbtn" data-page="nodes" title="节点">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>节点</span>
    </button>
    <button class="railbtn" data-page="settings" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9-.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>设置</span>
    </button>
    <div class="rail-sp"></div>
    <button class="railbtn" id="healthBtn" title="环境自检">
      <svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>
      <span>环境</span><span class="job-count" id="jobCount" hidden>0</span>
    </button>
  </nav>

  <div id="shell">
    <header>
      <div class="crumb"><b id="projTitle">DramaKit</b><span id="projMeta">制作台</span></div>
      <div class="hchips" id="hchips"></div>
      <button class="btn sm ghost" id="themeBtn" title="切换到深色模式" aria-label="切换到深色模式">
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn sm ghost icon" id="refreshBtn" title="刷新全部数据" aria-label="刷新全部数据">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6"/></svg>
      </button>
    </header>

    <div id="cmdbar">
      <span class="lbl">AI</span>
      <select id="cmdproj"></select>
      <input id="cmd" placeholder="一句话下指令：把第3集重做成卡通风 / 只生成配音和字幕 / 找出所有夜戏特写…  （按 / 聚焦）">
      <button class="btn ai" id="cmdGo">解析</button>
    </div>
    <div id="preview"></div>

    <div id="body">
      <aside id="side">
        <div class="side-content">
          <div class="side-h">项目 <button class="btn xs ghost icon" id="newProj" title="新建项目" aria-label="新建项目">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button></div>
          <div id="projlist"></div>
          <div class="side-h">标签 <span class="muted" id="tagCount"></span></div>
          <div class="tagfilter" id="tagfilter"></div>
          <details class="fold" id="flowNewFold" style="margin:12px 0 4px">
            <summary>新建项目 · 导入小说</summary>
            <div class="inner" id="flowNewBody"></div>
          </details>
        </div>
        <button class="btn sm ghost" id="sideToggle" title="收起项目栏" aria-label="收起项目栏" aria-controls="side" aria-expanded="true"><span aria-hidden="true">‹</span><span>收起项目栏</span></button>
      </aside>

      <main id="main">
        <section id="page-workbench" class="page">
          <nav class="wb-tabs" id="wbTabs" aria-label="工作台"></nav>
          <div id="page-flow" class="wb-pane"></div>
          <section id="page-board" class="wb-pane" hidden></section>
          <section id="page-cast" class="wb-pane" hidden></section>
          <section id="page-assets" class="wb-pane" hidden></section>
          <section id="page-jobs" class="wb-pane" hidden></section>
        </section>
        <section id="page-nodes" class="page" style="display:none"></section>
        <section id="page-settings" class="page" style="display:none">
          <nav class="wb-tabs" id="setTabs" aria-label="设置"></nav>
          <div id="tab-settings" class="wb-pane"></div>
          <div id="page-settings-prod" class="wb-pane" hidden><div id="prodPanel"></div></div>
          <div id="page-settings-ai" class="wb-pane" hidden><div id="tab-setup"></div></div>
          <section id="page-skills" class="wb-pane" hidden></section>
          <div id="page-settings-hist" class="wb-pane" hidden"></div>
        </section>
      </main>
    </div>
  </div>
</div>

<div id="previewOld" style="display:none"></div>
<div class="toast" id="toast"></div>
<div id="drawerMask"></div>
<aside id="drawer">
  <div class="dhead"><span class="dt" id="dTitle">编辑</span>
    <button class="btn sm ghost icon" id="dClose" aria-label="关闭编辑面板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
// Both quotes get escaped: a value that lands inside an inline handler is
// written between single quotes, and a name with an apostrophe in it would
// otherwise close the string and break the click.
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num = (v,d)=>{const x=parseFloat(v);return Number.isFinite(x)?x:d;};

// Keystrokes stay inside an overlay: Tab must not walk the page behind it.
function trapFocus(rootEl){
  const sel = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';
  rootEl.addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const items = [...rootEl.querySelectorAll(sel)].filter(el =>
      el.offsetParent !== null || getComputedStyle(el).position === "fixed");
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

// A node's address is worth clicking: it is the card that is doing the
// work, and its own console says what it is doing right now. Only a
// real http address becomes a link - anything else is shown as plain
// text, so a broken setting is not dressed up as something clickable.
const nodeLink = (url, label)=>{
  const u=String(url||"").trim();
  if(!/^https?:\/\/[^\s"'<>]+$/i.test(u)) return esc(label||u);
  return `<a href="${attr(u)}" target="_blank" rel="noopener noreferrer" `
       + `style="font-size:12px;text-decoration:underline;text-underline-offset:2px">`
       + `${esc(label||u)}</a>`;
};

// ---------- api ----------
async function api(path, opts={}){
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type")||"";
  if(ct.includes("json")) return r.json();
  return {ok:r.ok, text:await r.text()};
}
const getJSON = p => api(p);
const postJSON = (p,b) => api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});

function toast(msg, kind="", ms=3200){
  const t=$("#toast"); t.className="toast show "+kind; t.innerHTML=msg;
  clearTimeout(t._x); t._x=setTimeout(()=>t.className="toast "+kind, ms);
}
async function pollJob(jid, onDone){
  const tick = async ()=>{
    const r = await getJSON("/api/jobs?id="+encodeURIComponent(jid));
    // a request that did not come back is not a lost job: the console is
    // busy with the run, and the answer is asked again
    if(!r){ setTimeout(tick, 1200); return; }
    const j = r.job;
    if(!j){ toast("任务丢失","err"); return; }
    if(j.status==="queued"||j.status==="running"){ setTimeout(tick, 900); return; }
    if(j.status==="error"){ toast("任务失败："+esc(j.error),"err",6000); onDone&&onDone(null,j); return; }
    onDone&&onDone(j.result,j);
  };
  tick();
}

async function boot(){
  const st = await getJSON("/api/state");
  if(!st.ok){ toast("无法连接后端","err"); return; }
  S.state=st; S.projects=st.projects||[];
  if(!S.current || !S.projects.some(p=>p.slug===S.current)) S.current=st.current_project||(S.projects[0]&&S.projects[0].slug)||"";
  if(!S.templates) S.templates=await getJSON("/api/templates");
  renderHeader(); renderCmdProj(); renderProjects(); renderTags();
  // selectProject renders every page itself, so the second call here only
  // drew the same pages twice on every load.
  if(S.current) await selectProject(S.current, true); else { S.detail=null; renderAllPages(); }
  if(!S.booted){
    // a refresh lands where the user was: #project/page in the address
    let pg="", pj="";
    try{
      const m=(location.hash||"").replace(/^#/,"").split("/");
      if(m.length>=2){ pj=decodeURIComponent(m[0]||""); pg=m[1]||""; }
    }catch(e){}
    if(pj && S.projects.some(x=>x.slug===pj) && pj!==S.current){
      S.current=pj; await selectProject(pj, true);
    }
    const known=["workbench","nodes","settings"];
    S.activePage = pg && known.includes(pg) ? pg : "workbench";
    S.booted=true;
  }
  switchPage(S.activePage, true);
  startProgressPoll();
  startStatusBar();
  // The environment chips on the workbench are worth having without a
  // click. The probe is slow and it talks to other machines, so it runs in
  // the background and the page redraws when it lands.
  if(!S.health) probeHealth(()=>{
    renderStatusBar();
    if(S.activePage==="workbench"&&S.wbTab==="flow") renderFlow();
  });
}

function stageSummary(slug){
  // A stage counts as done when the project says so, or when the episode
  // says so: the first stages are recorded on the project, the rest on the
  // episode, and counting only one of them leaves a finished project
  // looking half finished.
  const p=S.projects.find(x=>x.slug===slug);
  const nEp=(p&&p.episodes)?p.episodes:1;
  const total=pipeStages().length*nEp;
  const det=(S.detail&&S.detail.slug===slug)?S.detail:null;
  const projStatus=(det&&det.stage_status)||{};
  const eps=(det&&det.episodes)||[];
  const done=(s,ep)=>String(projStatus[s]||"").endsWith("done")
                 ||String((ep&&(ep.stage_status||{})[s])||"").endsWith("done");
  let n=0;
  if(eps.length){
    eps.forEach(ep=>{ pipeStages().forEach(s=>{ if(done(s,ep)) n++; }); });
  }else{
    pipeStages().forEach(s=>{ if(done(s,null)) n+=nEp; });
  }
  return {total,done:n};
}

function ensureStatusBar(){
  let bar=document.getElementById("statusbar");
  if(!bar){
    bar=document.createElement("div");

function statusTaskText(){
  const bits=[];
  const proj=(S.detail&&(S.detail.meta&&S.detail.meta.title||S.detail.meta.name))||S.current||"";
  const st=runningStageName();
  const rs=S.runStats||{};
  if(st){
    bits.push((proj||"当前项目")+" · "+(STAGE_ZH[st]||st)+" 进行中");
    if(rs.total) bits.push("已完成 "+rs.done+"/"+rs.total);
    if(rs.inflight) bits.push("在跑 "+rs.inflight+" 项");
    const lanes=rs.lanes||{};
    for(const k in lanes){
      const v=lanes[k]||{};
      if(v.running) bits.push((STAGE_ZH[k]||k)+" "+v.running);
    }
  }else if(proj){
    bits.push(proj+" · 空闲");
  }else{
    bits.push("没有打开的项目");
  }
  const last=(S.lastLog||"");
  if(last) bits.push(last);
  return bits.join("　·　");
}

function gEnvState(){
  const h=S.health, p=(h&&h.probe)||{}, b=(h&&h.brain)||{};
  const comfy=!!(p.comfyui&&p.comfyui.reachable);
  const llm=!!(b.main&&b.main.ok)||!!((p.llm_endpoints||[]).length);
  const tts=!!(p.tts&&p.tts.voice_count);
  const ff=!!p.ffmpeg;
  return {checked:!!h,ff,llm,comfy,tts,done:[ff,llm,comfy,tts].filter(Boolean).length};
}

// the state of one big step, gathered from the stages inside it
function stepState(sp){
  const st=sp.stages.map(stageState);
  if(st.indexOf("failed")>=0) return "failed";
  if(st.indexOf("running")>=0) return "running";
  if(st.indexOf("interrupted")>=0) return "partial";
  if(st.every(x=>x==="done")) return "done";
  if(st.indexOf("done")>=0) return "partial";
  return "pending";
}
function stepPct(sp){
  return Math.round(sp.stages.filter(s=>stageState(s)==="done").length/sp.stages.length*100);
}
function stepSelected(sp){ return sp.stages.every(s=>runSel.has(s)); }
function toggleStep(sp){
  const all=stepSelected(sp);
  sp.stages.forEach(s=> all ? runSel.delete(s) : runSel.add(s));
  renderFlow();
}

// ---------- the frame and the look ----------
// The two things a short drama is decided by before a word is written: the
// shape of the picture and the look of it.  They are chosen here, they are
// written on the project, and from there they travel into every character
// picture, every shot prompt and every clip.
let LOOKS=null, LOOKS_PROMISE=null;
async function loadLooks(){
  if(LOOKS) return;
  if(LOOKS_PROMISE) return LOOKS_PROMISE;
  LOOKS_PROMISE=(async()=>{
    const r=await getJSON("/api/looks");
    if(!r||!r.ok) return;
    LOOKS=r;
    if(S.activePage==="workbench"&&S.wbTab==="flow") renderFlow();
  })();
  return LOOKS_PROMISE;
}
function lookAspect(ratio){
  const list=(LOOKS&&LOOKS.aspects)||[];
  return list.find(a=>a.id===ratio)||list[0]||null;
}
function lookStyleOf(ad){
  const list=(LOOKS&&LOOKS.styles)||[];
  return list.find(s=>(ad&&ad.style_prompt_prefix&&ad.style_prompt_prefix===s.prompt)
                     ||(ad&&ad.style===s.style)||(ad&&ad.style===s.name))||null;
}
// what ComfyUI will be asked for: the models want whole steps, so
// 1080 wide is asked for as 1088 and the film is cut to 1080
function snapSize(w,h){
  const s=v=>Math.max(512,Math.round((v||0)/16)*16);
  return [s(w),s(h)];
}
function lookSizeNote(w,h){
  if(!w||!h) return "ComfyUI 出图与视频都按这个尺寸生成";
  const [sw,sh]=snapSize(w,h);
  return (sw===w&&sh===h)
    ? `ComfyUI 出图与视频：${w}×${h}`
    : `ComfyUI 出图与视频：${sw}×${sh}（模型要 16 的倍数）`;
}
function lookPanelHtml(d){
  const ad=(d&&d.art_direction)||{};
  // what the person has chosen but not yet saved.  The page draws itself
  // again whenever the server says something new, and a re-draw that

// the choice in the card, before it is written to the project
function lookDraftSet(patch){
  if(!S.current) return;
  const d=(S.lookDraft&&S.lookDraft.project===S.current)
    ?Object.assign({},S.lookDraft):{project:S.current};
  Object.assign(d,patch);

function bindLookPanel(){
  const row=$("#arRow"); if(!row) return;

async function saveLook(quiet){
  if(!S.current){ if(!quiet) toast("先选一个项目","err"); return false; }
  const on=$("#arRow .seg.on");
  const ratio=on?on.dataset.ar:"9:16";
  const sz=$("#lookSize");
  const wh=(sz&&sz.value?sz.value.split("x"):["0","0"]);
  const st=$("#lookStyle");
  const body={project:S.current,aspect_ratio:ratio,
              width:parseInt(wh[0])||0,height:parseInt(wh[1])||0};
  // The style is only sent when the person picked one.  A project whose
  // style came from the analysis of the book is not in the list, so the
  // dropdown shows the first entry - and saving that would quietly
  // replace the style the analysis chose.
  const draft=(S.lookDraft&&S.lookDraft.project===S.current)?S.lookDraft:null;
  if(draft&&draft.style) body.style=draft.style;
  // the skills that came with the look are written first, so that the
  // answer to the look's save is the last thing on the wire - a box
  // ticked a moment later must not be written over by an earlier write
  if(SK&&SK.selection){
    const sr=await saveSkills(SK.selection);
    if(sr&&sr.ok){
      SK.selection=sr.selection||SK.selection;
      SK.costs=sr.costs||SK.costs;
    }
  }
  const r=await postJSON("/api/project/look",body);
  if(!r||!r.ok){
    if(!quiet) toast("保存失败："+esc((r&&r.error)||"未知错误"),"err");
    return false;
  }
  if(S.detail) S.detail.art_direction=r.art_direction;
  // it is on the project now; the card shows the project, not a draft
  S.lookDraft=null;
  if(!quiet) toast("已保存 · 画幅与风格会贯穿角色制图与视频提示词","ok",3600);
  renderFlow();
  return true;
}

// The look decides what the writing has to be good at: a story set in
// the Republican era is written with different craft than a sweet
// romance.  Choosing a look brings its skills with it - and the person
// can take anything off the list and add anything back, and the change
// is saved as they make it.
async function applyStyleSkills(styleId){
  if(!styleId||!SK||!SK.by_style) return;
  const got=SK.by_style[styleId];
  if(!got||!got.skills) return;
  try{
    const names=(SK.skills||[]).map(x=>x.name);
    const clean={};
    for(const stage of ["analyze","script","storyboard","promptgen"]){
      const want=(got.skills[stage]||[]).filter(n=>names.indexOf(n)>=0);
      if(want.length) clean[stage]=want;
    }
    // the genre card is not the look's business: it is the card the book
    // is read with, and a new look does not change the book
    if((SK.selection||{}).genre) clean.genre=(SK.selection.genre||[]).slice();
    // on the page, not on the server: the 保存 button writes the look
    // and the skills together, so a box ticked in between is not written
    // over by the answer to an earlier write
    SK.selection=clean;
    SK.recommended=false;
    syncSkillBoxes();
    for(const stage of ["analyze","script","storyboard","promptgen"]){
      const head=document.getElementById("skhead-"+stage);
      if(!head) continue;
      const n=(SK.selection[stage]||[]).length;
      const c=head.querySelector(".muted");
      if(c) c.textContent=n+" 个 · "+fmtChars(skillCost(stage,clean));
    }
    const note=document.getElementById("skNote");
    if(note) note.textContent="按「"+esc(got.name)+"」换的一套，点保存一起写进去";
  }catch(e){/* a failed save must not break the page */}
}

// ---------- the skills, listed by step ----------
const SK_STAGE_ZH={analyze:"解析",script:"编剧",storyboard:"分镜",promptgen:"提示词"};
// the skills that belong to each stage, and the theory that the
// screenwriter and the director may draw on
const SK_SUGGEST={
  analyze:["novel-outline","novel-characters","novel-art","character-refs"],
  script:["novel-script"],
  storyboard:["novel-storyboard","novel-staging"],
  promptgen:["novel-storyboard"]
};
function skLabel(x){ return x.title_zh||x.family_zh||x.title; }
// The genre cards have their own column: one card, chosen by name.
// They are not in the stage lists - a card that is ticked sits in the
// script stage, so the column writes there.
function genreSkills(){ return ((SK&&SK.skills)||[]).filter(x=>x.family==="genre"); }
function skillsForStage(stage){
  const all=(SK&&SK.skills)||[];
  const sug=new Set(SK_SUGGEST[stage]||[]);
  const out=[];
  all.forEach(x=>{ if(sug.has(x.name)) out.push(x); });
  // whatever this stage already uses is offered too, even if it is not one
  // of the usual ones
  const sel=((SK&&SK.selection)||{})[stage]||[];
  sel.forEach(n=>{ const f=all.find(x=>x.name===n); if(f&&out.indexOf(f)<0) out.push(f); });
  return out.filter(x=>x.family!=="genre");
}
function skillsPanelHtml(){
  if(!SK) return `<div class="card"><b>技能</b><span class="muted" style="font-size:12px">读取中…</span></div>`;
  const sel=SK.selection||{}, costs=SK.costs||{};
  // A column for every stage that takes skills, and none for the steps
  // that inject nothing: three empty columns were space taken for
  // nothing.
  const stepOf={analyze:"全文分析",script:"改成剧集",storyboard:"改成剧集",promptgen:"分镜制作"};
  const cols=Object.keys(SK_STAGE_ZH).map(st=>{
    const names=sel[st]||[];
    const opts=skillsForStage(st).map(x=>`<label class="skck"
        title="${attr(x.description||"")}"><input type="checkbox" data-skstage="${esc(st)}"
        data-sk="${esc(x.name)}" ${names.indexOf(x.name)>=0?"checked":""}><span>${esc(skLabel(x))}</span></label>`).join("");
    return `<div class="skcol">
      <div class="skt">${esc(SK_STAGE_ZH[st])}
        <span class="skstep">${esc(stepOf[st]||"")}</span>
        <span class="muted" style="margin-left:auto">${names.length} 个 · ${fmtChars(costs[st]||0)}</span>
      </div>
      <div class="skopts">${opts}</div></div>`;
  }).join("");
  // the genre column: the fifteen cards, one of them for this book
  const gcards=genreSkills();
  const gsel=sel.genre||[];
  const gopts=gcards.map(x=>`<label class="skck"
      title="${attr(x.description||"")}"><input type="checkbox" data-skstage="genre"
      data-sk="${esc(x.name)}" ${gsel.indexOf(x.name)>=0?"checked":""}><span>${esc(skLabel(x))}</span></label>`).join("");
  const gcol=`<div class="skcol">
    <div class="skt">类型
      <span class="skstep">改成剧集</span>
      <span class="muted" style="margin-left:auto" id="genreCount">${gsel.length} 个</span>
    </div>
    <div class="skopts">${gopts}</div></div>`;
  const rec=SK.recommended?" · 按这本书推荐的":"";
  return `<div class="card skcard">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <b>技能</b>
      <span class="muted" style="font-size:12px">勾上就存到本项目，下次跑流水线生效${esc(rec)}</span>
      <span class="muted" id="skNote" style="font-size:12px"></span>
    </div>
    <div class="skgrid">${cols}${gcol}</div>
  </div>`;
}
// The skill saves, in a line.  The look brings its own skills and the
// boxes are ticked by hand, and the two must not write over each other.
function skillCost(stage,selection){
  const sel=selection||((SK&&SK.selection)||{});
  const byName={};
  ((SK&&SK.skills)||[]).forEach(x=>{ byName[x.name]=x.chars||0; });
  let n=0;
  (sel[stage]||[]).forEach(x=>{ n+=byName[x]||0; });
  return n;
}
let skillSaveQueue=Promise.resolve();
function saveSkills(selection){
  skillSaveQueue=skillSaveQueue.then(()=>
    postJSON("/api/skills/save",{project:S.current,selection}))
    .catch(()=>null);
  return skillSaveQueue;
}
// every box shows what the server now holds
function syncSkillBoxes(){
  if(!SK||!SK.selection) return;
  $$("#page-flow .skck input").forEach(cb=>{
    const list=SK.selection[cb.dataset.skstage]||[];
    const want=list.indexOf(cb.dataset.sk)>=0;
    if(cb.checked!==want) cb.checked=want;
  });
}
function bindSkillChecks(){
  $$("#page-flow .skck input").forEach(cb=>cb.onchange=()=>{
    const stage=cb.dataset.skstage, name=cb.dataset.sk;
    const list=(SK.selection[stage]=SK.selection[stage]||[]);
    const i=list.indexOf(name);
    if(cb.checked&&i<0) list.push(name); else if(!cb.checked&&i>=0) list.splice(i,1);
    // the genre is one thing: a book is read with one card, and two of
    // them in the same prompt is how the writing stops being about
    // anything.  So ticking one puts the other away.
    if(stage==="genre"){
      SK.selection[stage]= cb.checked ? [name] : [];
    }
    saveSkills({[stage]:list}).then(r=>{
      if(!r||!r.ok){ toast("技能保存失败","err"); return; }
      SK.selection=r.selection||SK.selection;
      SK.costs=r.costs||SK.costs;
      // the page and the server must say the same thing - the page may
      // have been drawn again while the answer was on its way
      syncSkillBoxes();
      const head=document.getElementById("skhead-"+stage);
      if(head){
        const names=SK.selection[stage]||[];
        head.innerHTML=esc(SK_STAGE_ZH[stage])+` <span class="muted">${names.length} 个 · ${fmtChars(SK.costs[stage]||0)}</span>`;
      }
      // the genre column counts its own cards
      const gc=document.getElementById("genreCount");
      if(gc){
        gc.textContent=(SK.selection.genre||[]).length+" 个";
      }
    });
  });
}
async function loadSkillsForFlow(){
  if(SK) return;
  const slug=S.current;
  // One load at a time, and only for the project being looked at.  Two
  // loads at once means two answers, and the older one can land after
  // the person has ticked something - and put the old answer on the
  // page, while the server has the new one.
  if(SK_PROMISE&&SK_FOR===slug) return SK_PROMISE;
  SK_FOR=slug;
  SK_PROMISE=(async()=>{
    const q=slug?("?project="+encodeURIComponent(slug)):"";
    const r=await getJSON("/api/skills"+q);
    if(!r||!r.ok) return;
    if(S.current!==slug) return;      // the person has moved on
    SK=r;
    if(S.activePage==="workbench"&&S.wbTab==="flow") renderFlow();
  })();
  return SK_PROMISE;
}

function projectNameFromFilename(filename){
  return (filename||"").replace(/\.[^.]+$/, "").trim();
}
function bindGuideSourcePicker(picker,sourceInput,nameInput,fileName){
  if(!picker||!sourceInput) return;
  if(nameInput) nameInput.oninput=()=>{ delete nameInput.dataset.autoName; };
  picker.onchange=()=>{
    const file=picker.files&&picker.files[0];
    if(!file){ if(fileName) fileName.textContent=""; return; }
    sourceInput.value=file.name;
    const suggested=projectNameFromFilename(file.name);
    if(nameInput&&suggested){
      const previousAuto=nameInput.dataset.autoName||"";
      if(!nameInput.value.trim()||nameInput.value===previousAuto){
        nameInput.value=suggested;
        nameInput.dataset.autoName=suggested;
      }
    }
    const size=file.size>=1024*1024?(file.size/1024/1024).toFixed(1)+" MB":Math.max(1,Math.round(file.size/1024))+" KB";
    if(fileName) fileName.textContent=`已选择本地文件 · ${size}`;
  };
  sourceInput.oninput=()=>{
    const file=picker.files&&picker.files[0];
    if(file&&sourceInput.value.trim()!==file.name){
      picker.value="";
      if(fileName) fileName.textContent="已改用手动路径";
    }
  };
}

// Read a novel in the encoding it actually is. The browser's own text()
// assumes UTF-8 and swaps anything else for U+FFFD, which destroys a GBK
// book before it reaches the server - and destroys it for good, because
// the server is handed the already-mangled text.
async function readNovelFile(file){
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const tries = ["utf-8", "gb18030", "gbk", "big5"];
  for(const enc of tries){
    try{
      // fatal:true makes an undecodable byte throw instead of becoming "?",
      // so a wrong guess fails loudly and the next encoding gets a turn
      return new TextDecoder(enc, {fatal:true}).decode(bytes);
    }catch(e){ /* not this encoding; try the next */ }
  }
  // nothing decoded cleanly: hand back what UTF-8 can make of it, and say so
  toast("这个文件的编码认不出来，可能有乱码","err",5000);
  return new TextDecoder("utf-8").decode(bytes);
}
