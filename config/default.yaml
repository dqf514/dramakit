# --------------------- 画面生成 ComfyUI（你的视频服务器）--------------------
# 这是短剧画面的来源。ComfyUI 用 "Save (API Format)" 导出工作流，
# 放到 config/comfyui/ 下，然后把下面的节点ID映射对上你的图。
# 支持对接另一台机器（远程/局域网），含鉴权与断线重试。
comfyui:
  enabled: true
  base_url: http://127.0.0.1:8188           # 视频服务器地址（远程就填 http://IP:8188）
  client_id: dramakit
  timeout: 600.0                            # 单张图/单段视频生成上限（秒）
  request_timeout: 60.0                     # 短HTTP调用（提交/查询/下载）超时
  poll_interval: 1.0
  concurrency: 1 # 受显存限制，单卡建议 1
  max_retries: 3                            # 远程网络抖动重试次数
  use_proxy: false                          # 直连(false)：局域网/远程 ComfyUI 必须 false，
                                            #   否则 httpx 会读系统代理导致连不上/卡住
  # --- 远程鉴权（对接另一台机器，尤其走 Nginx 反代时）---
  auth: none                                # none | basic | token | header
  auth_username: ""                         # basic 用
  auth_password: ""                         # basic 用；建议走环境变量 DRAMAKIT_COMFYUI_PASSWORD
  auth_token: ""                            # token(bearer) 用；建议走 DRAMAKIT_COMFYUI_TOKEN
  extra_headers: {}                         # 任意自定义头（auth=header 或附加头）
    # X-Api-Key: your-key
  verify_tls: true                          # 内网自签名证书可设 false
  # --- 进度监听：优先 WebSocket，失败自动回退轮询 /history ---
  use_websocket: true
  ws_fallback_to_poll: true
  # 出图用 FLUX 3 Image Klein。带角色/场景参考图时用多参考图那版，
  # 没有参考图的空镜用普通版（多参考版无参考时会退化成正方形空潜空间）。
  t2i_workflow: config/comfyui/t2i_flux3_klein.json
  t2i_workflow_ref: config/comfyui/t2i_flux3_klein_ref.json
  i2v_workflow: config/comfyui/i2v_minimax_h3.json
  auto_workflows: true # 上面留空/文件不存在时，自动扫描 config/comfyui/*.json
  auto_map: true       # 从工作流图结构自动推断节点ID；手填的仍优先（失效时自动修复）
  upscale_workflow: ""                      # 可选：放大工作流
  # --- 首尾帧：用起始/结束两张关键帧驱动 i2v，镜头更可控 ---
  # 需要一份支持双图输入的工作流（如 FLF2V / IP-Adapter 双图），
  # 留空则自动退回单图 i2v，不影响现有流程。
  first_last_frame: false
  flf_workflow: "" # 例：config/comfyui/i2v_flf.json
  # --- FLUX 3 Image Klein 的三件套（UNETLoader / CLIPLoader / VAELoader）---
  # 注意：文本编码器必须用 bf16 版。int8_convrot 版（qwen3vl_4b_int8_convrot）
  # 在 ComfyUI 0.42.0 上会产出垃圾条件——画面有正确的颜色语义但完全没结构。
  clip_name: qwen3vl_4b_bf16.safetensors
  vae_name: flux2-vae.safetensors
  # 出图提示词格式：flux3 = 完整场景描述；sdxl = 关键词堆叠
  prompt_format: flux3
  # 语义名 → 节点ID（字符串）。全部可留空/删掉：auto_map 会按图结构自动推断；
  # 想锁定某个节点再手填，手填优先。工作流换编号后失效项会被自动忽略并重新推断。
  t2i_nodes:
    positive: "104"      # CLIPTextEncode（写 text）
    negative: "105"      # CLIPTextEncode（写 text，FLUX 3 留空）
    seed: "107"          # KSampler（写 seed / noise_seed）
    width: "106"         # EmptyFlux2LatentImage（写 width，普通版用）
    height: "106"        # EmptyFlux2LatentImage（写 height，普通版用）
    steps: "107"         # KSampler（写 steps）
    cfg: "107"           # KSampler（写 cfg）
    sampler: "107"       # KSampler（写 sampler_name / scheduler）
    checkpoint: "101"    # UNETLoader（写 unet_name）
    clip: "102"          # CLIPLoader（写 clip_name）
    vae: "103"           # VAELoader（写 vae_name）
    sampling: "112"      # ModelSamplingFlux（写 width / height）
    ref_image: "201"     # LoadImage：角色参考图（第二个槽位=场景参考图，自动推断）
  i2v_nodes:
    image: "1"           # LoadImage（写 image，上传后的首帧）
    last_image: ""       # H3 单图 i2v，暂不用尾帧
    positive: "104"      # MiniMaxH3ImageToVideo（写 prompt）
    negative: ""         # H3 无负向提示词
    seed: "15"           # RandomNoise（写 noise_seed）
    frames: "104"        # MiniMaxH3ImageToVideo（写 length，17k+5 网格自动对齐）
    fps: "91"            # CreateVideo（写 fps）
    width: "104"         # MiniMaxH3ImageToVideo（写 width）
    height: "104"        # MiniMaxH3ImageToVideo（写 height）
  # ---- 节点池：额外的 ComfyUI 机器（方案B 的调度对象）----
  # 工作流即清单：扫描 config/comfyui/*.json 的模型加载节点，自动得出要传的模型。
  # 新增节点后 `dj nodes check` 看缺什么，`dj nodes sync <名字>` 自动补齐（带进度）。
  nodes: []
  #  - name: gpu3090-v0        # 3090#0，专做视频
  #    base_url: http://<3090IP>:8188
  #    roles: [i2v]            # t2i=出图 / i2v=出视频；留空=什么都接
  #    transfer: scp           # shared=该节点 models 目录已挂载到本机；scp=走 ssh 传
  #    local_models: /mnt/gpu3090/ComfyUI/models
  #    # 或用 scp：
  #    # transfer: scp
  #    # ssh_host: 192.168.1.50
  #    # ssh_user: ubuntu
  #    # ssh_key: ~/.ssh/id_ed25519
  #    # remote_models: /home/ubuntu/ComfyUI/models
  #  - name: gpu3090-v1        # 3090#1，专做视频
  #    base_url: http://<3090IP>:8189
  #    roles: [i2v]
  #    transfer: scp
  #  - name: img-box          # 出图专机
  #    base_url: http://<IMGIP>:8188
  #    roles: [t2i]
  #    transfer: scp
  # 本机 ComfyUI 的 models 目录（模型文件存放处，也是同步来源）
  models_dir: E:\\ComfyUI\\models
  mode: image_then_video # image | video | image_then_video
  width: 768                              # 出图分辨率（FLUX 3 / H3 都吃 32 的倍数）
  height: 1344                            # 9:16 竖屏原生（短剧就是竖着看的）
  steps: 16                               # FLUX 3 Klein 蒸馏版：16 步
  cfg: 1.0                                # 蒸馏版无引导，cfg 必须 1
  sampler: euler
  scheduler: simple
  checkpoint: flux3-image-klein-int8-convrot.safetensors
  # 出视频分辨率（H3 标准 16:9 = 960x544，32 的倍数）
  video_width: 768
  video_height: 1344
  frames: 124                               # frame_mode=fixed 时所有镜头都用这个帧数
  # 视频时长：auto = 按每个镜头在时间线上实际占多长生成（对齐 H3 的 17k+5 网格）
  frame_mode: auto
  max_video_seconds: 15.0                   # 单镜头最长多少秒（H3 训练范围到 362 帧）
  fps: 24
  seed_mode: character # random | fixed | character（按角色固定种子保一致性）
  fixed_seed: 12345
  save_intermediate: true                   # 保留 tmp/ 中间文件便于排查

# --------------------------- 配乐 BGM -------------------------------------
# provider:
#   library  本地曲库：把版权音乐丢进 assets/music，按情绪自动匹配（零成本）
#   musicgen 本地/HTTP Meta MusicGen 生成（需 torch，见 requirements 的 musicgen extra）
#   suno     Suno 兼容 API 生成
#   none     不加 BGM
music:
  provider: library
  library_dir: assets/music
  base_url: http://localhost:8001           # musicgen HTTP 服务地址
  model: facebook/musicgen-small
  duration: 30.0
  api_key: ""
  use_proxy: false                          # 直连(false)：走 HTTP 生成音乐时避免系统代理卡住
  mood_map: {}                              # 情绪标签 → 文件名列表（不填则按文件名关键词匹配）
    # 紧张: [tense1.mp3, suspense2.wav]
    # 悲伤: [sad_piano.mp3]
  bgm_volume: 0.22 # 相对人声音量
  loop_to_fit: true                         # 自动循环铺满整集
  fade_in: 1.0
  fade_out: 2.0
  duck_voice: true                          # 有人说话时自动压低 BGM（侧链）

# --------------------------- 分集 segment -----------------------------------
segment:
  strategy: auto                            # auto | fixed_count | fixed_duration | by_chapter
  episode_count: 0                          # fixed_count 时用
  episode_duration: 90.0                    # 目标每集秒数（红果常见 60~120s）
  min_episode_duration: 45.0
  max_episode_duration: 180.0
  respect_chapters: true                    # 尽量沿章节边界切
  hook_style: 强悬念反转                     # 每集结尾钩子风格
  max_chars_per_episode: 0                  # 0=按秒数让系统估算
  opening_recap: true                       # 生成"前情提要"
  cold_open: true                           # 第一集冷开场直接抛冲突

# --------------------------- 分镜 storyboard --------------------------------
storyboard:
  shots_per_scene: auto
  min_shots_per_scene: 2
  max_shots_per_episode: 14
  max_shots_per_scene: 10
  shot_duration_range: [2.0, 4.0]
  prefer_dynamic: true                      # 多用推拉摇移增强节奏
  include_insert_shots: true                # 允许空镜/特写插入
  language: bilingual                       # 提示词语言 zh | en | bilingual

# --------------------------- 合成 compose -----------------------------------
compose:
  width: 1080
  height: 1920                            # 9:16 竖屏成片（平台标准）
  fps: 30
  video_bitrate: 6M
  audio_bitrate: 192k
  codec: libx264
  pixel_format: yuv420p
  crf: 20                                   # 越小越清晰、文件越大（18~23 常用）
  preset: medium                            # ultrafast..veryslow
  transition: fade # none=硬切 | fade/dissolve=场间淡入淡出
  transition_duration: 0.35 # 淡入淡出时长；会按镜头时长自动收缩
  motion_effect: kenburns                   # 静图镜头的运动：kenburns | zoompan | none
  kenburns_scale: 1.12                      # 静图最大缩放幅度
  loudness_normalize: true
  target_loudness_lufs: -16.0
  # H3 原生音频：bed=只当配乐/环境声垫底（人声走 TTS 轨，避免双声混叠）；discard=完全丢弃
  h3_audio: bed
  # H3 垫底的音量。垫底要在对白之下 10 LU 以上才听得清台词，
  # 实测 0.45 时只差 6.4 LU，音乐会盖住人声。
  h3_audio_gain: 0.18               # 短视频平台常用 -14~-16 LUFS
  burn_subtitles: true # 硬字幕（红果/抖音常用，不可关闭显示）
  also_write_srt: true                      # 同时输出软字幕 .srt
  show_speaker_name: false                  # 台词上方不显示角色名（画面上更干净）
  # 2026 年起 AIGC 微短剧必须在画面上标注 AI 生成，备案号一起带上
  ai_declaration: "本片画面与声音由AI生成"
  ai_declaration_seconds: 3                    # 声明只放在片头 3 秒（平台要求）
  filing_number: ""                        # 备案号（上线前填）
  film_grain: 4                            # 胶片颗粒强度（去掉 AI 塑料感，0=关）
  # 口型对齐：画面里的嘴由模型自己动，录好的声音和嘴对不上，
  # 观众就会觉得声音飘在画面外。MuseTalk 用录好的音频重画嘴。
  voice_room: 0.14                         # 台词上的房间混响（0=干声）
  lipsync: true                            # 打开后每个有台词的镜头都会过一遍 MuseTalk
  musetalk_root: "E:/musetalk"            # MuseTalk 的代码与权重
  musetalk_python: "E:/ComfyUI/venv/Scripts/python.exe"
  lipsync_timeout: 900                     # 一个镜头的口型对齐最多等多久（秒）
  line_gap: 0.35                            # 每句台词之间的留白（秒）
  subtitle_style:
    font: Microsoft YaHei
    font_size: 30                           # 以 960 宽为基准，按画面宽度放大
    primary_color: "&H00FFFFFF"             # 白字（&HAABBGGRR）
    outline_color: "&H00000000"             # 黑边
    outline: 2
    shadow: 0
    margin_v: 1                              # 距画面底部几个字高（1 = 紧贴底部上方一个文字高）
    margin_v_pct: 12                         # 至少离底部这么高（%）：竖屏里底部是平台自己的按钮区
    bold: true
    alignment: 2                            # 底部居中
    speaker_color: "&H0000E5FF"             # 角色名高亮色
    # 旁白专用样式：顶部居中 + 半透明底板 + 斜体暖色，不占用底部对白区
    narration_font: Microsoft YaHei
    narration_font_size: 26
    narration_color: "&H00A0DCFA"           # 暖米色
    narration_back_color: "&H66000000"      # 40% 透明黑底板
    narration_margin_v: 40                  # 距顶部距离
    narration_alignment: 5                  # 居中（在顶部像是没剪完的说明）
  generate_cover: true
  cover_from_shot: first                  # first/best/last
  cover_title: true                       # 封面烧上标题（手机上要看得清）                    # first | best | last

# --------------------------- 流水线控制 -------------------------------------
pipeline:
  output_dir: projects
  stages_enabled:                           # 想跳过某步就从这里删掉
    - ingest
    - analyze
    - character
    - segment
    - script
    - storyboard
    - promptgen
    - visual
    - voice
    - subtitle
    - music
    - precheck
    - compose
  resume: true                              # 跳过已完成节点，可断点续跑
  stop_after: null                          # 例: storyboard —— 只跑到分镜就停
  only_episodes: []                         # 例: [1,2,3] 只处理这几集
  fail_fast: false                          # true=任一阶段报错即中止
  verbose: true
