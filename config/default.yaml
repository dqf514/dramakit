# ===========================================================================
#  DramaKit 主配置  (config/default.yaml)
#  小说 → 多集竖屏短剧 的全流程参数。改完直接 `dj run <项目>` 生效。
#  密钥建议放环境变量，别写进文件：
#    set DRAMAKIT_LLM_API_KEY=sk-xxxx        (Windows)
#    export DRAMAKIT_LLM_API_KEY=sk-xxxx     (Linux/Mac)
#  也可以在 Web 控制台（dj serve）→「设置」页里图形化增删模型、调优先级、勾选任务分工。
# ===========================================================================

# --------------------------- 大模型 LLM -----------------------------------
# provider 目前统一走 OpenAI 兼容接口，云端/本地都能接：
#   DeepSeek   base_url: https://api.deepseek.com/v1        model: deepseek-chat
#   通义千问    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1  model: qwen-plus
#   Kimi       base_url: https://api.moonshot.cn/v1         model: moonshot-v1-32k
#   OpenAI     base_url: https://api.openai.com/v1          model: gpt-4o-mini
#   Ollama本地  base_url: http://localhost:11434/v1          model: qwen2.5:14b
#   LMStudio   base_url: http://localhost:1234/v1           model: <你加载的模型>
llm:
  provider: openai_compat
  base_url: https://api.minimax.cn/v1 # 默认指向本地 Ollama
  api_key: sk-cp-21ybJjlHsJm41qZL8jJxySDGJy91RZit0okb2KhYlcsyTMEnUh3cIR_h3vPM9Nbsni7wk_L0iZp4nTu8ahGn8xo0RQCd_za4B2YRuet4KkUxBU5SA27Ann4 # 本地随便填；云端用环境变量覆盖
  model: MiniMax-M3.1-Flash
  temperature: 0.7
  max_tokens: 102400
  top_p: 1.0
  timeout: 300.0
  max_retries: 3
  concurrency: 4                           # 每次请求的并发（实测 MiniMax 端点支持 6 并发）
  use_proxy: false # 直连(false)；仅当需经系统代理访问海外API时设 true
  json_mode: true                          # 要求结构化输出
  system_prompt_extra: ""
  # 旧版单模型阶段覆盖（模型清单 models.entries 为空时才生效）
  model_overrides:
    # analyze: qwen2.5:32b
    # segment: deepseek-chat
    # promptgen: qwen2.5:7b

# --------------------------- 模型清单 -----------------------------------
# entries 顺序即优先级；roles 指定每个模型负责的任务；default 是兜底模型。
# 在 Web 控制台「设置」页里图形化增删/排序/勾选，保存会自动写回这里。
models:
  default: m1
  entries:
  - id: m1
    label: miniMax-M3.1
    base_url: https://api.minimax.cn/v1
    model: MiniMax-M3.1-Flash
    api_key: sk-cp-21ybJjlHsJm41qZL8jJxySDGJy91RZit0okb2KhYlcsyTMEnUh3cIR_h3vPM9Nbsni7wk_L0iZp4nTu8ahGn8xo0RQCd_za4B2YRuet4KkUxBU5SA27Ann4
    temperature: 0.7
    max_tokens: 102400
    timeout: 300.0
    use_proxy: false
    roles:
    - analyze
    - segment
    - script
    - storyboard
    - promptgen
    - config
    - actions
    - search
    - tag

# --------------------- AI 原生层（大脑/一键配置/标签/检索）------------------
# 这一层让「所有事交给 AI」：探测环境自动生成配置、给素材打标签分类、
# 自然语言检索、自然语言→动作。全部失败即优雅降级，不影响手动跑流水线。

ai:
  enabled: true
  language: zh                             # AI 输出/标签语言
  main_timeout: 90.0                       # 交互式调用的超时上限；端点挂了不卡界面
  # --- 旧版小模型配置（模型清单 models.entries 非空时不生效）---
  # 留空则自动复用上面的主 LLM，无感降级。
  light_base_url: ""                       # 例：http://localhost:11434/v1
  light_api_key: ""                        # 建议走环境变量 DRAMAKIT_AI_LIGHT_API_KEY
  light_model: ""                          # 例：qwen2.5:3b
  light_temperature: 0.2
  light_max_tokens: 1024
  light_timeout: 120.0
  light_use_proxy: false                   # 直连(false)；同 llm.use_proxy
  # --- 行为开关 ---
  auto_tag: true                           # 流水线产出后自动打标签入库
  intent_confirm: true                     # 自然语言动作执行前需确认
  catalog_db: catalog.db                   # 资产目录库（相对 projects 目录或绝对路径）
  max_search_results: 60
  tag_max: 8                               # 每个资产最多标签数
  # 内置标签分类体系（AI 打标签时受此约束，保证分类清晰统一）
  tag_taxonomies:
    genre: [都市, 古装, 玄幻, 悬疑, 甜宠, 战神, 重生, 穿越, 复仇]
    scene_type: [对白, 独白, 旁白, 打斗, 情感, 反转, 回忆, 空镜]
    mood: [紧张, 温馨, 悲伤, 愤怒, 喜悦, 悬疑, 燃, 虐]
    shot: [特写, 近景, 中景, 全景, 远景, 过肩, 主观, 空镜]
    time: [日, 夜, 晨, 昏]
    asset: [小说, 剧本, 分镜, 画面, 视频, 配音, 字幕, 配乐, 成片, 封面]

# --------------------------- Web 控制台 -----------------------------------
# `dj serve` 打开的本地控制台（零依赖，标准库实现）。
web:
  host: 127.0.0.1                          # 仅本机；要在局域网访问填 0.0.0.0
  port: 8756
  open_browser: true
  projects_dir: projects
  title: DramaKit 控制台

# --------------------------- 角色定妆 -------------------------------------
# 先给每个角色定一张"锚点脸"和三视图，之后所有镜头都复用同一组参考图，
# 跨镜头/跨集不换脸。consistency=ref 需要画面工作流支持 LoadImage 参考图。
characters:
  enabled: true
  use_llm_anchor: true                      # 用 LLM 把外貌整理成稳定英文锚点
  anchor_max_chars: 320
  generate_refs: true # 用 ComfyUI 生成三视图
  generate_location_refs: true # 每个场景生成一张无人的环境参考图（注入镜头）
  auto_cast: true           # 由 AI 从可用音色里给角色分配声音（失败按性别回退）
  ref_views: [front, side, three_quarter]
  ref_width: 768
  ref_height: 1024
  consistency: ref   # prompt=只靠文字锚点 | ref=附带参考图（推荐） | lora

# --------------------------- 配音 TTS -------------------------------------
# provider:
#   edge      免费！微软 Edge 神经音色，开箱即用，无需 Key（推荐起步）
#   cosyvoice 本地 CosyVoice HTTP 服务（可克隆音色），base_url 指向你的服务
#   openai    任意 OpenAI 兼容 /v1/audio/speech
#   minimax   MiniMax 云端多情感音色
tts:
  provider: minimax
  edge_default_voice: zh-CN-YunxiNeural     # 男主/男声（provider=edge 时用）
  edge_narrator_voice: zh-CN-YunyangNeural  # 旁白/解说（provider=edge 时用）
  edge_female_voice: zh-CN-XiaoxiaoNeural   # 女主/女声（provider=edge 时用）
  base_url: https://api.minimax.cn          # cosyvoice / 其它本地服务地址
  api_key: "sk-cp-21ybJjlHsJm41qZL8jJxySDGJy91RZit0okb2KhYlcsyTMEnUh3cIR_h3vPM9Nbsni7wk_L0iZp4nTu8ahGn8xo0RQCd_za4B2YRuet4KkUxBU5SA27Ann4"
  model: speech-2.8-hd
  rate: "+0%"                               # 语速，如 +10% / -10%
  volume: "+0%"
  pitch: "+0Hz"
  speed: 1.0                                # 非 edge 提供商的语速
  concurrency: 4
  use_proxy: false                          # 直连(false)；本地 CosyVoice 必须 false
  silence_pad_ms: 120                       # 每句尾部留白，避免字幕/语音太挤
  # 旁白/解说是否朗读。false = 只做屏幕文字（独有样式，不挡画面），不进配音轨
  speak_narration: false
  # 旁白专用音色（provider=edge 时用上面的 edge_narrator_voice）
  narrator_voice: "Chinese (Mandarin)_Radio_Host"
  # --- 音色池筛选（自动选角时只从这里挑，避免港台腔/方言混进短剧）---
  voice_locales: ["zh-CN"]                  # 只用这些语言前缀（edge 专有）
  voice_pool: []                            # 显式白名单（留空=用提供商的中文音色表）
  voice_exclude: []                         # 额外排除
  voice_notes: {}                           # 音色备注（喂给配音导演 LLM）
  # 角色名 → 音色（不填则按性别回退到上面的默认音色）
  voice_map: {}
  # 情绪 → 提供商的情感参数（MiniMax 用 happy/sad/angry/fearful/disgusted/surprised/neutral）
  # 剧本里的情绪标签常常带修饰（"冷笑（愤怒）"），voice 阶段会拆出括号里的本体来查这张表，
  # 所以这里尽量把常见说法都收进来，查不到就等于没有情绪——台词会被平读。
  emotion_map:
    平静: neutral
    愤怒: angry
    悲伤: sad
    惊讶: surprised
    喜悦: happy
    紧张: fearful
    得意: happy
    坚定: neutral
    恐惧: fearful
    厌恶: disgusted
    疑惑: surprised
    冷漠: neutral
    警惕: fearful
    犹豫: surprised
    震惊: surprised
    惊惧: fearful
    焦急: fearful
    心虚: fearful
    失态: surprised
    压抑: angry
    咬牙: angry
    强硬: angry
    逼问: angry
    质问: angry
    冷笑: neutral
    苦笑: sad
    轻蔑: disgusted
    嘲讽: disgusted
    讽刺: disgusted
    无奈: sad
    自责: sad
    委屈: sad
    决心: neutral
    决绝: neutral
    冷静: neutral
    克制: neutral
    公事公办: neutral
    敷衍: neutral
    意味深长: neutral
    暗藏得意: happy
    诱劝: happy
    期待: happy
    温柔: happy
    感激: happy
    愧疚: sad
  # 情绪 → 语速/音高微调。短剧要的是戏感：愤怒要顶上去，委屈要弱下来。
  # MiniMax 有真正的 emotion 参数，这张表主要给没有情感能力的 TTS 兜底。
  emotion_modulation:
    愤怒: {speed: 1.12, pitch: -1}
    悲伤: {speed: 0.90, pitch: -1}
    惊讶: {speed: 1.08, pitch: 1}
    喜悦: {speed: 1.06, pitch: 1}
    紧张: {speed: 1.10, pitch: 0}
    得意: {speed: 0.98, pitch: 0}
    坚定: {speed: 0.95, pitch: -1}
    恐惧: {speed: 1.05, pitch: 1}
    厌恶: {speed: 0.95, pitch: -1}
    警惕: {speed: 1.05, pitch: 0}
    犹豫: {speed: 0.92, pitch: 0}
