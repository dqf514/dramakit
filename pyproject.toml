[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dramakit"
version = "0.1.0"
description = "Novel-to-multi-episode vertical short-drama pipeline (红果短剧工厂): segmentation, script, storyboard, voiceover, subtitles, music and ComfyUI-driven video, fully pluggable between cloud APIs and local models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "dqf514" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "edge-tts>=6.1",
    "mutagen>=1.47",
]

[project.optional-dependencies]
docx = ["docx2txt>=0.8"]
openai = ["openai>=1.30"]
musicgen = ["torch>=2.2", "transformers>=4.41", "librosa>=0.10"]

[project.scripts]
dramakit = "dramakit.cli:app"
dj = "dramakit.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dramakit*"]
